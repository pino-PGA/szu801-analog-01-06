/strong>\u003cspan>道精选题\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>14\u003c/strong>\u003cspan>道核心题\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>2\u003c/strong>\u003cspan>道拓展题\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\n\u003cdiv class=\"app-shell\">\n  \u003caside class=\"sidebar\">\n    \u003cbutton class=\"learn-entry active\" data-view=\"learn\">\u003cspan>先学\u003c/span> 知识点汇总 →\u003c/button>\n    \u003cdiv class=\"side-heading\">练习模块\u003cspan>CHAPTER 08\u003c/span>\u003c/div>\n    \u003cdiv id=\"module-list\">\u003c/div>\n    \u003cdiv class=\"side-note\">\u003cspan class=\"tiny-label\">本批定位\u003c/span>\u003cp>只学基础概念与一步简算：14 道核心题 + 2 道 OTL / BTL 拓展题。按学习价值精选，不代表命题预测。\u003c/p>\u003c/div>\n    \u003cdiv class=\"side-actions\">\u003cbutton id=\"export-btn\">导出进度 ↗\u003c/button>\u003cbutton id=\"import-btn\">导入进度 ↙\u003c/button>\u003c/div>\n    \u003cinput id=\"import-file\" type=\"file\" accept=\"application/json,.json\" hidden>\n    \u003cp class=\"local-note\">进度保存在当前浏览器；换设备请先导出。\u003c/p>\n  \u003c/aside>\n  \u003cmain>\n    \u003csection id=\"view-learn\" class=\"view\" aria-label=\"知识点汇总\">\n      \u003cdiv class=\"learn-intro\">\n  \u003cdiv class=\"eyebrow\">LEARN FIRST / 16 道精选\u003c/div>\n  \u003ch2>功放核心知识点汇总\u003c/h2>\n  \u003cp class=\"learn-lead\">没学过也可以从这里开始。7 个主题，只讲基础概念和一步简算；学完即可完成 14 道核心题和 2 道结构拓展题。\u003c/p>\n  \u003cdiv class=\"learn-route\">\u003cspan>01 读概念\u003c/span>\u003ci>→\u003c/i>\u003cspan>02 看例子\u003c/span>\u003ci>→\u003c/i>\u003cspan>03 做对应题\u003c/span>\u003c/div>\n  \u003cdiv class=\"learn-intro-bottom\">\u003cp>题目已精选为 01—16，不再追求整章覆盖。先读前 6 节，完成 01—14 题，再看 OTL / BTL 两道拓展题。\u003c/p>\u003cbutton id=\"start-practice\" class=\"primary\" data-view=\"practice\">进入 16 道精选 →\u003c/button>\u003c/div>\n\u003c/div>\n\u003cnav class=\"lesson-index\" aria-label=\"知识点目录\">\n  \u003cbutton data-lesson-target=\"learn-1\">01 功放的作用\u003c/button>\u003cbutton data-lesson-target=\"learn-2\">02 工作类别与导通角\u003c/button>\n  \u003cbutton data-lesson-target=\"learn-3\">03 OCL 与电流路径\u003c/button>\u003cbutton data-lesson-target=\"learn-4\">04 交越失真与改善\u003c/button>\n  \u003cbutton data-lesson-target=\"learn-5\">05 输出功率简算\u003c/button>\u003cbutton data-lesson-target=\"learn-6\">06 效率、管耗与耐压\u003c/button>\n  \u003cbutton class=\"index-optional\" data-lesson-target=\"learn-7\">07 OTL / BTL · 拓展\u003c/button>\n\u003c/nav>\n\n\u003cdetails class=\"lesson-card\" id=\"learn-1\" open>\n  \u003csummary>\u003cspan class=\"lesson-number\">01\u003c/span>\u003cspan class=\"lesson-title\">功放做什么？\u003csmall>输入起控制作用，电源提供输出能量\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">基础\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>功率放大电路常放在放大系统最后一级，驱动扬声器等负载。输入信号控制功率管的导通变化，把直流电源的能量按信号规律送给负载。\u003c/p>\n    \u003cdiv class=\"concept-flow\" aria-label=\"输入控制、电源供能、功放驱动负载\">\u003cspan>输入信号\u003csmall>控制变化\u003c/small>\u003c/span>\u003cb>→\u003c/b>\u003cspan>功率输出级\u003csmall>直流电源供能\u003c/small>\u003c/span>\u003cb>→\u003c/b>\u003cspan>负载\u003csmall>得到交流功率\u003c/small>\u003c/span>\u003c/div>\n    \u003cdiv class=\"lesson-tip\">\u003cb>记住一句话\u003c/b>输出能量主要来自\u003cstrong>直流电源\u003c/strong>，不是来自输入信号源，也不是由功率管凭空产生。\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"1\">01 能量来源\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"lesson-card\" id=\"learn-2\" open>\n  \u003csummary>\u003cspan class=\"lesson-number\">02\u003c/span>\u003cspan class=\"lesson-title\">甲类、乙类、甲乙类怎么分？\u003csmall>看单只功率管在一个周期内的导通角\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">基础\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>一个正弦周期为 360°。导通角表示\u003cstrong>一只管\u003c/strong>在这个周期内导通了多少角度；“静态”指没有输入信号时的状态。\u003c/p>\n    \u003cdiv class=\"lesson-table-wrap\">\u003ctable class=\"lesson-table\">\u003ccaption>三种工作类别\u003c/caption>\u003cthead>\u003ctr>\u003cth>类别\u003c/th>\u003cth>单管导通角\u003c/th>\u003cth>主要特点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      \u003ctr>\u003ctd>甲类 A\u003c/td>\u003ctd>360°\u003c/td>\u003ctd>整个周期都导通，静态也有电流。\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>乙类 B\u003c/td>\u003ctd>180°\u003c/td>\u003ctd>每只管工作半周期；理想静态电流为零。\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>甲乙类 AB\u003c/td>\u003ctd>180°＜θ＜360°\u003c/td>\u003ctd>设置小静态电流，改善两管交接时的失真。\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n    \u003cdiv class=\"lesson-tip\">\u003cb>易错点\u003c/b>乙类两管合起来完成完整波形，不代表每只管都导通 360°。甲乙类也不等于甲类。\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"4\">02 甲类与乙类\u003c/button>\u003cbutton data-goto=\"6\">03 甲乙类\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"lesson-card\" id=\"learn-3\" open>\n  \u003csummary>\u003cspan class=\"lesson-number\">03\u003c/span>\u003cspan class=\"lesson-title\">互补 OCL 电路怎么看？\u003csmall>无输出耦合电容，正负半周轮流导通\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">基础\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>典型互补 OCL 采用正、负双电源，上管为 NPN，下管为 PNP。输出静态电位接近 0 V，负载直接接输出端与地，\u003cstrong>不串联输出耦合电容\u003c/strong>。\u003c/p>\n    \u003cdiv class=\"lesson-split\">\u003cdiv id=\"lesson-ocl\" data-diagram=\"ocl\">\u003c/div>\u003cdiv>\n      \u003cdiv class=\"current-path\">\u003cb>正半周 · 上管 T1 导通\u003c/b>\u003cspan>＋V\u003csub>CC\u003c/sub> → T1 → R\u003csub>L\u003c/sub> → 地\u003c/span>\u003c/div>\n      \u003cdiv class=\"current-path\">\u003cb>负半周 · 下管 T2 导通\u003c/b>\u003cspan>地 → R\u003csub>L\u003c/sub> → T2 → −V\u003csub>CC\u003c/sub>\u003c/span>\u003c/div>\n      \u003cp>这里按\u003cstrong>常规电流方向\u003c/strong>分析。输出电压为负，不意味着电流必须从负电源流出。\u003c/p>\n      \u003cdiv class=\"lesson-tip\">\u003cb>易错点\u003c/b>“无输出耦合电容”不等于整台放大器没有电容。\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"7\">04 OCL 结构\u003c/button>\u003cbutton data-goto=\"8\">05 正半周电流\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"lesson-card\" id=\"learn-4\" open>\n  \u003csummary>\u003cspan class=\"lesson-number\">04\u003c/span>\u003cspan class=\"lesson-title\">交越失真怎么产生、怎么改善？\u003csmall>过零处两管可能都截止，适当偏置让交接更平滑\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">基础\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>按硅管发射结导通压降约为 0.7 V 的简化模型，无偏置互补输出级在 −0.7 V＜u\u003csub>i\u003c/sub>＜＋0.7 V 时，两管都截止。负载接地时输出近似为零，形成\u003cstrong>交越死区\u003c/strong>，使过零附近出现缺口。\u003c/p>\n    \u003cp>适当增加两基极间的静态偏置，让两管在静态时微导通，可改善交越失真，这就是常见甲乙类输出级的基本思路。\u003c/p>\n    \u003cdiv class=\"lesson-tip\">\u003cb>不要混淆\u003c/b>交越失真常表现为\u003cstrong>过零缺口\u003c/strong>，主要考虑偏置；削顶失真表现为\u003cstrong>波峰、波谷被截平\u003c/strong>，常因输出要求超过允许摆幅。只提高电源电压不能直接解决交越死区，偏置也不是越大越好。\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"10\">06 交越死区\u003c/button>\u003cbutton data-goto=\"13\">07 改善措施\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"lesson-card\" id=\"learn-5\" open>\n  \u003csummary>\u003cspan class=\"lesson-number\">05\u003c/span>\u003cspan class=\"lesson-title\">输出功率，只掌握这几步\u003csmall>分清电压表示方法，再找最大允许峰值\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">基础 · 简算\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>纯电阻负载上的无直流正弦电压，其峰值记为 U\u003csub>om\u003c/sub>，有效值记为 U\u003csub>o\u003c/sub>。峰峰值是正峰到负峰的总距离，等于 2U\u003csub>om\u003c/sub>。\u003c/p>\n    \u003cdiv class=\"lesson-formulas\">\u003cspan>U\u003csub>o\u003c/sub>＝U\u003csub>om\u003c/sub>/√2\u003c/span>\u003cspan>P\u003csub>o\u003c/sub>＝U\u003csub>o\u003c/sub>²/R\u003csub>L\u003c/sub>＝U\u003csub>om\u003c/sub>²/(2R\u003csub>L\u003c/sub>)\u003c/span>\u003c/div>\n    \u003cdiv class=\"lesson-example\">\u003cb>输出功率小算\u003c/b>正弦峰值 4 V，负载 8 Ω：P\u003csub>o\u003c/sub>＝4²/(2×8)＝\u003cstrong>1 W\u003c/strong>。若给的是有效值 4 V，则为 4²/8＝2 W，不能再除以 2。\u003c/div>\n    \u003cp>对称双电源 ±V\u003csub>CC\u003c/sub> 中，V\u003csub>CC\u003c/sub> 是\u003cstrong>单路电源幅值\u003c/strong>。理想 OCL 忽略压降、驱动充足时，最大不失真正弦峰值为 V\u003csub>CC\u003c/sub>。\u003c/p>\n    \u003cdiv class=\"lesson-formulas\">\u003cspan>理想：P\u003csub>om\u003c/sub>＝V\u003csub>CC\u003c/sub>²/(2R\u003csub>L\u003c/sub>)\u003c/span>\u003cspan>有余量：U\u003csub>om,max\u003c/sub>＝V\u003csub>CC\u003c/sub>−所需余量\u003c/span>\u003c/div>\n    \u003cdiv class=\"lesson-example\">\u003cb>最大输出小算\u003c/b>±12 V 电源、8 Ω 负载，理想最大输出为 12²/(2×8)＝\u003cstrong>9 W\u003c/strong>。若每侧需留 2 V 余量，峰值改为 10 V，功率为 10²/(2×8)＝\u003cstrong>6.25 W\u003c/strong>。\u003c/div>\n    \u003cdiv class=\"lesson-tip\">\u003cb>三个常见错误\u003c/b>把峰值当有效值；把 ±12 V 中的 24 V 当作输出对地峰值；题目已给出总余量后，又额外减去一次 0.7 V。\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"15\">08 峰值与有效值\u003c/button>\u003cbutton data-goto=\"16\">09 输出功率\u003c/button>\u003cbutton data-goto=\"17\">10 理想最大输出\u003c/button>\u003cbutton data-goto=\"18\">11 简单压降余量\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"lesson-card\" id=\"learn-6\" open>\n  \u003csummary>\u003cspan class=\"lesson-number\">06\u003c/span>\u003cspan class=\"lesson-title\">效率、管耗、耐压各记什么？\u003csmall>一个效率结论，一个功率平衡，一次电压相减\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">基础 · 简算\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003ch3>效率：输出功率占电源功率的比例\u003c/h3>\n    \u003cdiv class=\"lesson-formulas\">\u003cspan>η＝P\u003csub>o\u003c/sub>/P\u003csub>V\u003c/sub>\u003c/span>\u003cspan>理想乙类最大效率＝π/4≈78.5%\u003c/span>\u003c/div>\n    \u003cp>P\u003csub>V\u003c/sub> 指正负两路电源的总平均功率。78.5% 只适用于理想乙类、正弦输出达到最大摆幅的情况；较小输出幅度或实际甲乙类整机不能直接套作实际效率。\u003c/p>\n    \u003ch3>管耗：功率管自身转化为热的功率\u003c/h3>\n    \u003cp>忽略其他损耗，对称输出时，两管合计管耗为 P\u003csub>V\u003c/sub>−P\u003csub>o\u003c/sub>，每管平均分担一半。\u003c/p>\n    \u003cdiv class=\"lesson-formulas\">\u003cspan>P\u003csub>T\u003c/sub>＝(P\u003csub>V\u003c/sub>−P\u003csub>o\u003c/sub>)/2\u003c/span>\u003c/div>\n    \u003cdiv class=\"lesson-example\">\u003cb>一步小算\u003c/b>电源供给 20 W，负载得到 12 W，两管合计耗散 8 W，\u003cstrong>每管平均管耗 4 W\u003c/strong>。输出功率和管耗不是同一个量。\u003c/div>\n    \u003ch3>耐压：截止管可能承受接近两倍单路电源电压\u003c/h3>\n    \u003cp>上管集电极接 ＋V\u003csub>CC\u003c/sub>，当输出接近负峰值 −V\u003csub>CC\u003c/sub> 时，上管截止，承受的电压约为 V\u003csub>CC\u003c/sub>−(−V\u003csub>CC\u003c/sub>)＝\u003cstrong>2V\u003csub>CC\u003c/sub>\u003c/strong>。例如 ±12 V 供电时，可接近 24 V；实际选型还要留余量。\u003c/p>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"24\">12 理想最大效率\u003c/button>\u003cbutton data-goto=\"26\">13 管耗简算\u003c/button>\u003cbutton data-goto=\"34\">14 截止管耐压\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"lesson-card lesson-optional\" id=\"learn-7\">\n  \u003csummary>\u003cspan class=\"lesson-number\">07\u003c/span>\u003cspan class=\"lesson-title\">OTL / BTL 只作基础认识\u003csmall>OTL 看隔直电容，BTL 看两端电压之差\u003c/small>\u003c/span>\u003cspan class=\"lesson-level optional\">2 道拓展\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>\u003cstrong>典型单电源 OTL：\u003c/strong>输出级静态中点约在电源电压的一半，通过串联输出电容连接负载。电容阻隔直流，使工作频带内的交流信号进入负载；低频仍受容抗影响。\u003c/p>\n    \u003cp>\u003cstrong>BTL 桥接：\u003c/strong>负载跨接两路有源输出。两路交流分量等幅反相时，负载电压取两端之差，峰值为单路的 2 倍；同负载下，功率理论上为单端的 4 倍。\u003c/p>\n    \u003cdiv class=\"lesson-two-col\">\u003cdiv id=\"lesson-otl\" data-diagram=\"otl\">\u003c/div>\u003cdiv id=\"lesson-btl\" data-diagram=\"btl\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"lesson-example\">\u003cb>倍数小算\u003c/b>每路交流峰值均为 6 V，反相桥接后负载峰值为 6−(−6)＝12 V。电压为 2 倍，功率为 2²＝\u003cstrong>4 倍\u003c/strong>，前提是电源、电流和散热能力足够。\u003c/div>\n    \u003cdiv class=\"lesson-tip\">\u003cb>接线提醒\u003c/b>BTL 的两个负载端都是有源输出，不可把其中一端随意接地。OCL / OTL 与 BTL 的分类角度不同。\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"47\">15 OTL 电容隔直\u003c/button>\u003cbutton data-goto=\"49\">16 BTL 功率倍数\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\n\u003cdiv class=\"learn-finish\">\u003cp>先完成 01—14 核心题，再做 15—16 拓展题；遇到生疏概念时可随时回来查。\u003c/p>\u003cbutton id=\"finish-practice\" class=\"primary\" data-view=\"practice\">开始 16 道精选 →\u003c/button>\u003c/div>\n\u003cp class=\"learn-source\">本页与题库使用相同的符号和理想模型，教材定位和参考来源见\u003cbutton class=\"text-button\" data-view=\"guide\">“使用说明”\u003c/button>。精选依据为基础性与小题学习价值，不代表官方命题预测。\u003c/p>\n\n    \u003c/section>\n    \u003csection id=\"view-practice\" class=\"view\" hidden>\n      \u003cdiv class=\"learning-return\">\u003cspan>遇到没学过的概念，可以随时回来查。\u003c/span>\u003cbutton class=\"text-button\" data-view=\"learn\">← 知识点汇总\u003c/button>\u003c/div>\n      \u003cdiv class=\"progress-strip\" aria-label=\"练习进度\">\u003cdiv>\u003cspan>已作答\u003c/span>\u003cstrong id=\"stat-done\">0\u003csmall>/ 16\u003c/small>\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>答对\u003c/span>\u003cstrong id=\"stat-right\">0\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>正确率 · 按已答计\u003c/span>\u003cstrong id=\"stat-rate\">—\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>当前错题\u003c/span>\u003cstrong id=\"stat-wrong\">0\u003c/strong>\u003c/div>\u003cdiv class=\"progress-track\">\u003cdiv class=\"track\">\u003ci id=\"progress-fill\">\u003c/i>\u003c/div>\u003cspan id=\"progress-text\">从第一题开始\u003c/span>\u003c/div>\u003c/div>\n      \u003cdiv class=\"toolbar\">\u003cdiv class=\"filter-tabs\" role=\"group\" aria-label=\"题目筛选\">\u003cbutton class=\"filter active\" data-filter=\"all\">全部\u003c/button>\u003cbutton class=\"filter\" data-filter=\"unanswered\">未答\u003c/button>\u003cbutton class=\"filter\" data-filter=\"wrong\">错题\u003c/button>\u003cbutton class=\"filter\" data-filter=\"starred\">收藏\u003c/button>\u003c/div>\u003clabel class=\"search\">\u003cspan>⌕\u003c/span>\u003cinput id=\"search\" type=\"search\" placeholder=\"搜索知识点或题目\" aria-label=\"搜索知识点或题目\">\u003c/label>\u003c/div>\n      \u003cdiv class=\"practice-layout\">\u003cdiv id=\"question-area\" aria-live=\"polite\">\u003c/div>\u003caside class=\"question-map\">\u003cdiv class=\"map-title\">题目导航\u003cspan id=\"filtered-count\">\u003c/span>\u003c/div>\u003cdiv class=\"map-legend\">\u003cspan>\u003ci class=\"dot right\">\u003c/i>答对\u003c/span>\u003cspan>\u003ci class=\"dot wrong\">\u003c/i>答错\u003c/span>\u003cspan>☆ 已收藏\u003c/span>\u003c/div>\u003cdiv id=\"question-grid\">\u003c/div>\u003cdiv class=\"map-foot\">\u003cp id=\"module-description\">\u003c/p>\u003cbutton id=\"continue-btn\" class=\"text-button\">跳到下一道未答 →\u003c/button>\u003c/div>\u003c/aside>\u003c/div>\n      \u003cdiv class=\"print-bar\">\u003cp>需要纸上练习？题目、图和解析可一起打印。\u003c/p>\u003cdiv>\u003cbutton id=\"print-questions\">打印全部题目\u003c/button>\u003cbutton id=\"print-solutions\">打印题目与解析\u003c/button>\u003c/div>\u003c/div>\n    \u003c/section>\n    \u003csection id=\"view-coverage\" class=\"view\" hidden>\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">COVERAGE MAP\u003c/div>\u003ch2>16 道题，学清核心知识\u003c/h2>\u003cp>12 个核心节点 + 2 个结构拓展节点，对应 14 道核心题和 2 道拓展题。这里只列本精选版实际练习的知识，不追求整章覆盖，也不代表命题概率。\u003c/p>\u003c/div>\u003cdiv id=\"coverage-summary\" class=\"coverage-summary\">\u003c/div>\u003cdiv class=\"coverage-table-wrap\">\u003ctable class=\"coverage-table\">\u003cthead>\u003ctr>\u003cth>教材定位\u003c/th>\u003cth>知识节点\u003c/th>\u003cth>对应题号\u003c/th>\u003cth>已答\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"coverage-body\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n    \u003csection id=\"view-guide\" class=\"view\" hidden>\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">READ BEFORE PRACTICE\u003c/div>\u003ch2>使用说明与计算约定\u003c/h2>\u003cp>这一批只处理模电功放。数电将独立成册、独立建库。\u003c/p>\u003c/div>\u003cdiv class=\"guide-card\">\u003ch3>范围与来源\u003c/h3>\u003cp>本题集依据《模拟电子技术基础》第五版第 8 章的章节结构编写，题目均为原创教学练习，并非深圳大学官方试题，也不声称复现近年真题。功放章节未在所核对的官方大纲条目中单列；它仍与基本放大电路等条目存在联系，所以本库采用“拓展练习”的定位。\u003c/p>\u003cp>本精选版只保留 8.1—8.2 中的基础概念、输出功率简算、理想最大效率、功率平衡和截止管耐压；OTL / BTL 各保留一道结构认识题。共 16 道，按 01—16 连续编号。管耗极值、瞬时损耗、散热器设计和多重约束计算不纳入本版。\u003c/p>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://ehall.szu.edu.cn/gsapp/sys/zsjzapp/index.do#/2027/2/801\" target=\"_blank\" rel=\"noopener\">深圳大学：801 电子电路考试大纲（2027） ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://xuanshu.hep.com.cn/front/book/findBookDetails?bookId=59cf4af2ba9eb884cf822130\" target=\"_blank\" rel=\"noopener\">高等教育出版社：模电第五版及章节目录 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.ti.com/lit/ds/symlink/lm1875.pdf\" target=\"_blank\" rel=\"noopener\">Texas Instruments：LM1875 数据手册，应用与散热参考 ↗\u003c/a>\u003c/li>\u003c/ul>\u003cp class=\"muted\">大纲以对应报考年度官方发布为准。题型信息按你的说明作为编写背景，本题集不把它表述为独立核验的官方规定。\u003c/p>\u003c/div>\n      \u003cdiv class=\"guide-card\">\u003ch3>先统一符号，再代入公式\u003c/h3>\u003cdiv class=\"notation-grid\">\u003cdiv>\u003cb>V\u003csub>CC\u003c/sub>\u003c/b>\u003cp>对称电源每一路的幅值；±18 V 时取 18 V。\u003c/p>\u003c/div>\u003cdiv>\u003cb>U\u003csub>om\u003c/sub>\u003c/b>\u003cp>输出正弦电压峰值；有效值为 U\u003csub>om\u003c/sub>/√2。\u003c/p>\u003c/div>\u003cdiv>\u003cb>P\u003csub>o\u003c/sub> / P\u003csub>V\u003c/sub>\u003c/b>\u003cp>负载交流功率 / 正负两路电源总平均功率。\u003c/p>\u003c/div>\u003cdiv>\u003cb>P\u003csub>T\u003c/sub>\u003c/b>\u003cp>单只输出管按完整周期计算的平均耗散功率。\u003c/p>\u003c/div>\u003c/div>\u003cp>除题干另有说明，计算模型为：理想乙类互补 OCL、对称供电、纯电阻负载、正弦稳态；忽略基极电流、驱动级功耗和静态电流。带压降或甲乙类偏置等情况，按题干另行判断。\u003c/p>\u003cdiv class=\"formula-block\">P\u003csub>o\u003c/sub> = U\u003csub>om\u003c/sub>² / (2R\u003csub>L\u003c/sub>)\u003cbr>η = P\u003csub>o\u003c/sub> / P\u003csub>V\u003c/sub>\u003cbr>P\u003csub>T\u003c/sub> = (P\u003csub>V\u003c/sub> − P\u003csub>o\u003c/sub>) / 2\u003c/div>\u003cp>理想乙类在最大正弦摆幅时，最大效率 π/4 ≈ 78.5%；输出幅度较小时效率更低。单管管耗简算只使用对称理想输出级的功率平衡。\u003c/p>\u003c/div>\n      \u003cdiv class=\"guide-card\">\u003ch3>做题与保存\u003c/h3>\u003cp>先选择选项，再点“核对答案”。核对后可看解析和易错提醒；“重新作答”会清除该题当前记录，再答后更新错题状态。收藏独立于作答记录。\u003c/p>\u003cp>键盘支持 1—4 选择选项、Enter 核对、左右方向键切换题目。输入搜索文字时不会触发这些快捷键。页面没有计时要求，可按模块反复练习。\u003c/p>\u003cp>进度只存于本机当前浏览器。浏览器清理数据、隐私模式结束、更换 HTML 文件位置或换浏览器时，进度可能无法沿用；请使用“导出进度”保存 JSON，之后用“导入进度”恢复。导入会合并已有记录，同一题采用导入记录。旧版进度中仍保留的题目可自动对应到本版；被删题目的记录不会计入。\u003c/p>\u003cbutton id=\"reset-btn\" class=\"danger-button\">清空本页全部进度与收藏\u003c/button>\u003c/div>\n    \u003c/section>\n    \u003cfooter class=\"footer\">\u003cspan>深大 801 · 模电拓展练习 01\u003c/span>\u003cspan>14 道核心 + 2 道拓展 · 精选版 v1.2\u003c/span>\u003c/footer>\n  \u003c/main>\n\u003c/div>\n\u003cdiv id=\"toast\" role=\"status\" hidden>\u003c/div>\u003cdiv id=\"print-root\">\u003c/div>\n\u003cscript>const BANK = {\n  \"version\": 1,\n  \"edition\": \"selected16\",\n  \"title\": \"功率放大电路\",\n  \"subtitle\": \"深大 801 电子电路 · 16 道精选\",\n  \"groups\": [\n    {\n      \"id\": \"A\",\n      \"name\": \"功放的作用\",\n      \"section\": \"8.1\",\n      \"scope\": \"主体\",\n      \"intro\": \"先弄清输入信号控制什么，输出能量来自哪里。\"\n    },\n    {\n      \"id\": \"B\",\n      \"name\": \"甲类、乙类与甲乙类\",\n      \"section\": \"8.1\",\n      \"scope\": \"主体\",\n      \"intro\": \"按单只功率管的导通角区分三种工作类别。\"\n    },\n    {\n      \"id\": \"C\",\n      \"name\": \"互补 OCL 电路\",\n      \"section\": \"8.2\",\n      \"scope\": \"主体\",\n      \"intro\": \"识别输出结构，沿正、负半周电流路径分析导通情况。\"\n    },\n    {\n      \"id\": \"D\",\n      \"name\": \"交越失真与改善\",\n      \"section\": \"8.1—8.2\",\n      \"scope\": \"主体\",\n      \"intro\": \"理解过零死区，以及适当甲乙类偏置的作用。\"\n    },\n    {\n      \"id\": \"E\",\n      \"name\": \"输出功率简算\",\n      \"section\": \"8.2\",\n      \"scope\": \"主体\",\n      \"intro\": \"分清峰值和有效值，只做输出功率与简单压降计算。\"\n    },\n    {\n      \"id\": \"F\",\n      \"name\": \"效率、管耗与耐压\",\n      \"section\": \"8.2\",\n      \"scope\": \"主体\",\n      \"intro\": \"记住理想最大效率，理解功率平衡和截止管耐压。\"\n    },\n    {\n      \"id\": \"G\",\n      \"name\": \"OTL / BTL 结构认识\",\n      \"section\": \"关联拓展\",\n      \"scope\": \"拓展\",\n      \"intro\": \"用两道基础题认识输出隔直电容与桥接摆幅。\"\n    }\n  ],\n  \"questions\": []\n};\n// Stable ids retain the original question identity for saved progress; number is the visible 01–16 order.\nfunction Q(id, group, tag, difficulty, stem, options, answer, explanation, pitfall, fig='') {\n  BANK.questions.push({id,number:BANK.questions.length+1,group,tag,difficulty,stem,options,answer,explanation,pitfall,fig});\n}\nQ(1,'A','能量来源','基础','功率放大电路向负载提供的交流功率，主要由哪一部分提供能量？',\n ['输入信号源','直流电源','反馈电阻','功率管自身储存的能量'],1,\n '输入信号控制功率管的导通变化，使直流电源的能量按信号规律输送到负载。功率管是能量转换与控制器件。',\n '输入信号起控制作用，不能因为输出波形跟随输入，就认为负载能量主要来自信号源。');\n\nQ(4,'B','工作类别与导通角','基础','对正弦输入下的单只功放管，甲类、乙类的理想导通角依次为',\n ['360°、180°','180°、360°','360°、小于 180°','180°、180°'],0,\n '甲类器件在一个完整信号周期内导通，导通角为 360°；理想乙类器件只在半个周期内导通，导通角为 180°。',\n '互补乙类电路的两只管合起来完成完整波形，不代表每只管都导通 360°。');\n\nQ(6,'B','甲乙类导通角','基础','甲乙类功放管在正弦输入下的导通角 θ 通常满足',\n ['θ＜180°','θ＝180°','180°＜θ＜360°','θ＝360°'],2,\n '甲乙类通过设置小的静态电流，使每只管的导通时间超过半周期，但又不到整个周期，从而改善换向附近的失真。',\n '给输出级加偏置并不意味着一定变成甲类，仍需看静态工作点及实际导通区间。');\n\nQ(7,'C','OCL 结构','基础','关于 OCL 功率放大电路，正确的是',\n ['输入端绝不允许有耦合电容','必须采用输出变压器','只能使用一只功率管','输出端与负载之间不使用串联的输出耦合电容'],3,\n 'OCL 的结构特征是省去输出耦合电容。典型互补 OCL 使用正、负双电源，使输出静态电位接近地电位。',\n '“无输出耦合电容”不等于整台放大器都没有电容。');\n\nQ(8,'C','正半周电流路径','理解','图示互补乙类输出级中，T1 为 NPN 管，T2 为 PNP 管。输出为正半周时，主要负载电流路径为',\n ['＋VCC → T1 → RL → 地','地 → RL → T2 → −VCC','＋VCC → T2 → RL → 地','两只功率管始终同时承载相同负载电流'],0,\n '正半周由上管 T1 导通，从正电源经 T1 向负载提供电流；下管 T2 截止。图中电流按常规电流方向判断。',\n '不要把电子运动方向与常规电流方向混用；也不要仅按管子画在上方或下方猜极性。','ocl');\n\nQ(10,'D','交越死区','理解','无偏置互补射极输出级采用恒定导通压降模型，两管的 |UBE(on)| 均为 0.7 V。负载接地，输入范围 −0.7 V＜ui＜0.7 V 时，输出近似为',\n ['uo＝ui','uo＝0','uo＝ui＋0.7 V','uo＝ui−0.7 V'],1,\n '这一范围内上管和下管的发射结都未达到导通条件，两管均截止。由于负载接地，输出近似为零，形成交越死区。',\n '只有器件处于正常导通状态时才能使用射极跟随关系，不能把跟随关系跨死区延伸。');\n\nQ(13,'D','交越失真的改善','理解','典型互补输出级在小信号过零附近出现明显缺口。若确认原因是偏置不足，直接改善措施是',\n ['适当增加两基极之间的静态偏置，使两管微导通','把两管都偏置到更深截止','只提高电源电压而保持偏置电路不变','把负载改成开路以得到更大有用功率'],0,\n '适当的甲乙类偏置可减小或消除两管交接时的截止区间，从而改善交越失真。实际还需要防止偏置过大造成过热。',\n '交越失真与大信号削顶的成因不同，提高电源电压主要增加摆幅余量，不能直接解决发射结死区。');\n\nQ(15,'E','峰值与有效值','基础','负载上为无直流分量的正弦电压 uo＝Uom sinωt。峰值 Uom 与有效值 Uo 的关系为',\n ['Uo＝Uom','Uo＝2Uom','Uo＝Uom/√2','Uo＝Uom/2'],2,\n '正弦电压平方的周期平均值为 Uom²/2，开平方后得到有效值 Uo＝Uom/√2。',\n '正弦波的峰值、峰峰值和有效值不能互换，输出功率计算尤其容易因此差一倍或四倍。');\n\nQ(16,'E','交流输出功率','应用','纯电阻负载 RL＝4 Ω，负载正弦电压的峰值为 12 V，则平均交流输出功率为',\n ['36 W','18 W','9 W','3 W'],1,\n '正弦负载功率 Po＝Uom²/(2RL)＝12²/(2×4)＝18 W。等价地，可先把 12 V 换成有效值再计算。',\n '直接用峰值平方除以负载得到的是峰值瞬时功率，不是周期平均输出功率。');\n\nQ(17,'E','理想最大输出','应用','理想互补乙类 OCL 采用 ±18 V 双电源，RL＝8 Ω。不计饱和压降，驱动充足，最大不失真正弦输出功率为',\n ['81 W','40.5 W','10.125 W','20.25 W'],3,\n 'VCC 表示单路电源幅值 18 V，最大正弦峰值 Uom＝18 V，故 Pom＝18²/(2×8)＝20.25 W。',\n '不能把两电源间的总电压 36 V 直接作为对地输出正弦峰值。');\n\nQ(18,'E','饱和余量限制','应用','OCL 采用 ±20 V 双电源，RL＝8 Ω。正、负输出相对对应电源轨均需保留 2 V 余量，其他条件不构成限制。最大不失真正弦输出功率为',\n ['20.25 W','25 W','40.5 W','50 W'],0,\n '输出峰值受限为 Uom＝20−2＝18 V，因此 Pom＝18²/(2×8)＝20.25 W。',\n '题中已把器件和驱动所需总余量规定为 2 V，不应再额外减去一次 0.7 V。');\n\nQ(24,'F','理想最大效率','基础','理想互补乙类 OCL 在输出峰值达到 VCC 时，最大效率为',\n ['25%','50%','π/4，约 78.5%','100%'],2,\n 'Po＝Uom²/(2RL)，两路电源总功率 PV＝2VCCUom/(πRL)，故 η＝πUom/(4VCC)。在 Uom＝VCC 时取最大值 π/4。',\n '78.5% 适用于理想乙类正弦输出的最大摆幅情形，不能套给任意幅度或实际甲乙类整机。');\n\nQ(26,'F','功率平衡','理解','对称理想乙类 OCL 的总电源功率为 20 W，负载交流功率为 12 W。不计其他损耗，则每只输出管的平均管耗为',\n ['8 W','4 W','6 W','10 W'],1,\n '由能量平衡，两管总损耗为 20−12＝8 W；对称输出时两管平均分担，因此每管为 4 W。',\n '8 W 是两管合计值，不是单管值。');\n\nQ(34,'F','截止管耐压','理解','理想乙类 OCL 采用 ±VCC 双电源，输出接近负峰值 −VCC 时，截止的上管承受的集电极—发射极电压约为',\n ['2VCC','VCC','VCC/2','0'],0,\n '上管集电极接 ＋VCC，发射极接输出 −VCC，因此 UCE≈VCC−(−VCC)＝2VCC。实际选型应考虑余量和对应耐压条件。',\n '不要只按单路电源电压选截止耐压；还需留意数据手册采用的击穿参数及基极连接条件。','ocl');\n\nQ(47,'G','OTL 输出耦合','基础','典型单电源 OTL 结构中，输出级静态中点电位约为电源电压的一半，负载通过大电容连接。该电容的主要作用是',\n ['阻隔中点的直流分量，同时让工作频带内的交流信号进入负载','提高晶体管直流耐压额定值','使所有频率的交流都无衰减通过','把直流电源变成双电源'],0,\n '单电源中点带有直流电位，串联电容隔直，使负载主要接收交流分量。它还会与负载形成低频响应限制。',\n '隔直不等于对任意频率都没有阻抗，低频时仍需考虑电容容抗。','otl');\n\nQ(49,'G','BTL 差分摆幅','理解','理想 BTL 两端输出为幅值相同、相位相反的正弦电压，每端相对共同静态中点的交流峰值均为 6 V。同一 RL 下，与单端峰值 6 V 驱动相比，BTL 的负载功率为',\n ['相同','2 倍','4 倍','8 倍'],2,\n '负载两端取差，交流峰值为 6−(−6)＝12 V，是单端的 2 倍。相同负载下功率正比于电压峰值平方，所以为 4 倍。',\n '该倍数关系要求两路确实能保持规定摆幅，且没有受到电流、供电和热条件限制。','btl');\n\nconst COVERAGE = [\n  [\n    \"8.1\",\n    \"输出能量的来源\",\n    [\n      1\n    ]\n  ],\n  [\n    \"8.1\",\n    \"甲类、乙类、甲乙类的导通角\",\n    [\n      4,\n      6\n    ]\n  ],\n  [\n    \"8.2\",\n    \"OCL 输出结构\",\n    [\n      7\n    ]\n  ],\n  [\n    \"8.2\",\n    \"互补输出级半周导通与电流路径\",\n    [\n      8\n    ]\n  ],\n  [\n    \"8.1—8.2\",\n    \"过零死区与交越失真\",\n    [\n      10\n    ]\n  ],\n  [\n    \"8.1—8.2\",\n    \"甲乙类偏置改善交越失真\",\n    [\n      13\n    ]\n  ],\n  [\n    \"8.2\",\n    \"正弦峰值与有效值\",\n    [\n      15\n    ]\n  ],\n  [\n    \"8.2\",\n    \"负载交流输出功率\",\n    [\n      16\n    ]\n  ],\n  [\n    \"8.2\",\n    \"理想最大输出及简单压降余量\",\n    [\n      17,\n      18\n    ]\n  ],\n  [\n    \"8.2\",\n    \"理想乙类最大效率\",\n    [\n      24\n    ]\n  ],\n  [\n    \"8.2\",\n    \"总管耗与单管平均管耗\",\n    [\n      26\n    ]\n  ],\n  [\n    \"8.2\",\n    \"截止管耐压\",\n    [\n      34\n    ]\n  ],\n  [\n    \"关联拓展\",\n    \"OTL 输出电容隔直\",\n    [\n      47\n    ]\n  ],\n  [\n    \"关联拓展\",\n    \"BTL 差分摆幅与功率倍数\",\n    [\n      49\n    ]\n  ]\n];\n\nconst $ = s => document.querySelector(s);\nconst $$ = s => Array.from(document.querySelectorAll(s));\nconst KEY = 'szu801.analog01.selected16.v1';\nconst LEGACY_KEY = 'szu801.analog01.v1';\nconst TOTAL = BANK.questions.length;\nconst byId = new Map(BANK.questions.map(q => [q.id,q]));\nconst letters = ['A','B','C','D'];\nlet state = {answers:{},stars:[],current:1};\nlet moduleId = 'all', filter = 'all', view = 'learn', query = '';\nlet draft = {}, storageAvailable = true, toastTimer;\nconst esc = text => String(text).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction rich(text) {\n  const symbols = {VCC:'V\u003csub>CC\u003c/sub>',Uom:'U\u003csub>om\u003c/sub>',Iom:'I\u003csub>om\u003c/sub>',UOQ:'U\u003csub>OQ\u003c/sub>',UCE:'U\u003csub>CE\u003c/sub>',UBE:'U\u003csub>BE\u003c/sub>',RL:'R\u003csub>L\u003c/sub>',Po:'P\u003csub>o\u003c/sub>',Pom:'P\u003csub>om\u003c/sub>',PV:'P\u003csub>V\u003c/sub>',PT:'P\u003csub>T\u003c/sub>',PDC:'P\u003csub>DC\u003c/sub>',Tj:'T\u003csub>j\u003c/sub>',Ta:'T\u003csub>a\u003c/sub>',Rf:'R\u003csub>f\u003c/sub>',Rg:'R\u003csub>g\u003c/sub>',fL:'f\u003csub>L\u003c/sub>',Av:'A\u003csub>v\u003c/sub>'};\n  return esc(text).replace(/\\b(VCC|Uom|Iom|UOQ|UCE|UBE|RL|Pom|Po|PV|PT|PDC|Tj|Ta|Rf|Rg|fL|Av)\\b/g,m=>'\u003cspan class=\"math\">'+symbols[m]+'\u003c/span>');\n}\nfunction cleanRecord(raw) {\n  const result = {answers:{},stars:[],current:1};\n  if (!raw || typeof raw !== 'object') return result;\n  if (raw.answers && typeof raw.answers === 'object') for (const q of BANK.questions) {\n    const record = raw.answers[q.id];\n    if (record && Number.isInteger(record.choice) && record.choice>=0 && record.choice\u003c4) {\n      result.answers[q.id] = {choice:record.choice,correct:record.choice===q.answer,at:typeof record.at==='string'?record.at.slice(0,40):''};\n    }\n  }\n  if (Array.isArray(raw.stars)) result.stars = [...new Set(raw.stars.filter(id=>byId.has(id)))];\n  if (byId.has(raw.current)) result.current=raw.current;\n  return result;\n}\ntry {\n  const saved=localStorage.getItem(KEY);\n  state=cleanRecord(JSON.parse(saved===null?localStorage.getItem(LEGACY_KEY):saved));\n} catch(e) { storageAvailable=false; }\nfunction save() {\n  try { localStorage.setItem(KEY,JSON.stringify(state)); storageAvailable=true; } catch(e) { storageAvailable=false; }\n  $('#storage-warning').hidden=storageAvailable;\n}\nfunction toast(message) { $('#toast').textContent=message; $('#toast').hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('#toast').hidden=true,3500); }\nfunction filtered() {\n  return BANK.questions.filter(q=>{\n    const a=state.answers[q.id];\n    return (moduleId==='all'||q.group===moduleId) &&\n      (filter==='all'||filter==='unanswered'&&!a||filter==='wrong'&&a&&!a.correct||filter==='starred'&&state.stars.includes(q.id)) &&\n      (!query||[q.stem,q.tag,q.number,...q.options].join(' ').toLowerCase().includes(query.toLowerCase()));\n  });\n}\nfunction renderModules() {\n  $('#module-list').innerHTML = `\u003cbutton class=\"module-btn ${moduleId==='all'?'active':''}\" data-module=\"all\">\u003cspan class=\"module-letter\">∑\u003c/span>\u003cspan class=\"module-info\">全部模块\u003csmall>主体与关联拓展\u003c/small>\u003c/span>\u003cspan class=\"module-number\">${TOTAL}\u003c/span>\u003c/button>` + BANK.groups.map(g=>`\u003cbutton class=\"module-btn ${moduleId===g.id?'active':''}\" data-module=\"${g.id}\">\u003cspan class=\"module-letter\">${g.id}\u003c/span>\u003cspan class=\"module-info\">${esc(g.name)}\u003csmall>${g.scope==='拓展'?'选学 · 关联拓展':'教材 '+g.section}\u003c/small>\u003c/span>\u003cspan class=\"module-number\">${BANK.questions.filter(q=>q.group===g.id).length}\u003c/span>\u003c/button>`).join('');\n}\nfunction renderStats() {\n  const answers=Object.values(state.answers),right=answers.filter(a=>a.correct).length;\n  $('#stat-done').innerHTML=`${answers.length}\u003csmall>/ ${TOTAL}\u003c/small>`;\n  $('#stat-right').textContent=right;\n  $('#stat-rate').textContent=answers.length?Math.round(right/answers.length*100)+'%':'—';\n  $('#stat-wrong').textContent=answers.length-right;\n  $('#progress-fill').style.width=answers.length/TOTAL*100+'%';\n  $('#progress-text').textContent=answers.length===TOTAL?'16 道精选题已全部作答':answers.length?`已完成 ${Math.round(answers.length/TOTAL*100)}% · 按自己的节奏继续`:'从第一题开始';\n}\nfunction diagram(type, prefix) {\n  const start = (label,box='0 0 600 455')=>`\u003csvg id=\"${prefix}diagram\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"${box}\" role=\"img\" aria-label=\"${label}\">\u003cdefs>\u003cmarker id=\"${prefix}arr\" markerWidth=\"7\" markerHeight=\"7\" refX=\"6\" refY=\"3.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\u003cpath d=\"M0 0L7 3.5L0 7Z\" fill=\"#146c59\"/>\u003c/marker>\u003c/defs>\u003cstyle>#${prefix}diagram text{font:16px 'Microsoft YaHei',sans-serif;fill:#274c3f}#${prefix}diagram .wire{fill:none;stroke:#355f4f;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}#${prefix}diagram .fine{fill:none;stroke:#9eafa4;stroke-width:1.3}#${prefix}diagram .arrow{stroke:#146c59;stroke-width:2;marker-end:url(#${prefix}arr)}#${prefix}diagram .lbl{font-size:13px;fill:#778a7d}\u003c/style>`;\n  const ground=(x,y)=>`\u003cpath class=\"wire\" d=\"M${x} ${y}v10m-17 0h34m-27 7h20m-14 7h8\"/>`;\n  const resistor=(x,y,h=68)=>`\u003cpath class=\"wire\" d=\"M${x} ${y}v10h-10v${h-20}h20v-${h-20}h-10m0 ${h-20}v10\"/>`;\n  if(type==='ocl') return `\u003cfigure>${start('理想乙类互补OCL电路，NPN上管与PNP下管的发射极共同接负载，双电源供电')}\u003cpath class=\"wire\" d=\"M300 28v32l-60 44m0-14v60m0-14 60 44v48m0 0v44l-60 43m0-15v65m0-16 60 41v35M100 228h85m0-108v213m0-213h55m-55 213h55M300 228h160v42\"/>\u003cpath class=\"arrow\" d=\"M263 153l22 16\"/>\u003cpath class=\"arrow\" d=\"M287 281l-25 18\"/>\u003ccircle cx=\"300\" cy=\"228\" r=\"4\" fill=\"#146c59\"/>${resistor(460,270)}\u003cpath class=\"wire\" d=\"M460 338v37\"/>${ground(460,375)}\u003ctext x=\"319\" y=\"36\">+VCC\u003c/text>\u003ctext x=\"319\" y=\"427\">−VCC\u003c/text>\u003ctext x=\"320\" y=\"116\">T1 · NPN\u003c/text>\u003ctext x=\"320\" y=\"348\">T2 · PNP\u003c/text>\u003ctext x=\"68\" y=\"214\">ui\u003c/text>\u003ctext x=\"397\" y=\"211\">uo\u003c/text>\u003ctext x=\"483\" y=\"310\">RL\u003c/text>\u003ctext class=\"lbl\" x=\"72\" y=\"408\">双电源 · 负载对地\u003c/text>\u003c/svg>\u003cfigcaption>理想乙类 OCL：两管基极相连，互补射极输出。省略驱动级和保护电路；本图不含甲乙类偏置。\u003c/figcaption>\u003c/figure>`;\n  if(type==='otl') return `\u003cfigure>${start('单电源OTL输出经电容隔直后驱动对地负载','0 0 600 300')}\u003crect x=\"135\" y=\"75\" width=\"170\" height=\"135\" rx=\"9\" fill=\"#edf4ec\" stroke=\"#779b83\" stroke-width=\"1.6\"/>\u003ctext x=\"164\" y=\"143\">单电源功放\u003c/text>\u003ctext class=\"lbl\" x=\"169\" y=\"166\">静态输出约 VCC/2\u003c/text>\u003cpath class=\"wire\" d=\"M50 142h85M220 35v40M220 210v32M305 142h69m0-21v42m12-42v42m0-21h104v32\"/>${resistor(490,174,58)}\u003cpath class=\"wire\" d=\"M490 232v10\"/>${ground(490,242)}${ground(220,242)}\u003ctext x=\"237\" y=\"42\">+VCC\u003c/text>\u003ctext x=\"45\" y=\"129\">ui\u003c/text>\u003ctext x=\"374\" y=\"102\">C\u003c/text>\u003ctext x=\"511\" y=\"211\">RL\u003c/text>\u003ctext class=\"lbl\" x=\"415\" y=\"129\">uo（交流）\u003c/text>\u003c/svg>\u003cfigcaption>OTL 结构示意：输出电容隔开静态直流，负载得到交流分量。不是完整的晶体管接线图。\u003c/figcaption>\u003c/figure>`;\n  if(type==='btl') return `\u003cfigure>${start('BTL负载跨接两个反相变化的有源输出端，负载不接地','0 0 600 325')}\u003cpath d=\"M115 45L115 133L218 89Z\" fill=\"#edf4ec\" stroke=\"#779b83\" stroke-width=\"2\"/>\u003cpath d=\"M115 192L115 280L218 236Z\" fill=\"#edf4ec\" stroke=\"#779b83\" stroke-width=\"2\"/>\u003cpath class=\"wire\" d=\"M45 89h70M45 236h70M218 89h225v45m0 70v32H218\"/>${resistor(443,134,70)}\u003ccircle cx=\"443\" cy=\"89\" r=\"4\" fill=\"#146c59\"/>\u003ccircle cx=\"443\" cy=\"236\" r=\"4\" fill=\"#146c59\"/>\u003ctext x=\"145\" y=\"95\">A1\u003c/text>\u003ctext x=\"145\" y=\"242\">A2\u003c/text>\u003ctext class=\"lbl\" x=\"18\" y=\"72\">同相驱动\u003c/text>\u003ctext class=\"lbl\" x=\"18\" y=\"219\">反相驱动\u003c/text>\u003ctext class=\"lbl\" x=\"272\" y=\"72\">v1 = VQ + u\u003c/text>\u003ctext class=\"lbl\" x=\"272\" y=\"264\">v2 = VQ − u\u003c/text>\u003ctext x=\"466\" y=\"177\">RL\u003c/text>\u003ctext class=\"lbl\" x=\"233\" y=\"309\">负载电压 vL = v1 − v2 = 2u\u003c/text>\u003c/svg>\u003cfigcaption>BTL 结构示意：两个有源输出端共同驱动负载，两端不可随意接地；VQ 为共同静态电位。\u003c/figcaption>\u003c/figure>`;\n  return '';\n}\nfunction renderQuestion(list, preserve) {\n  if(!preserve&&!list.some(q=>q.id===state.current)) state.current=list[0]?.id??null;\n  const q=byId.get(state.current);\n  if(!q) { $('#question-area').innerHTML='\u003cdiv class=\"empty-state\">\u003cdiv class=\"eyebrow\">NO MATCHES\u003c/div>\u003ch2>这里暂时没有题目\u003c/h2>\u003cp>可切换模块、清除搜索，或选择其他筛选条件。\u003c/p>\u003cbutton id=\"clear-filter\" class=\"primary\">显示全部题目\u003c/button>\u003c/div>'; return; }\n  const a=state.answers[q.id],choice=a?.choice??draft[q.id],group=BANK.groups.find(g=>g.id===q.group),idx=list.findIndex(item=>item.id===q.id),starred=state.stars.includes(q.id);\n  $('#question-area').innerHTML=`\u003carticle class=\"question-card\" data-question-id=\"${q.id}\">\u003cdiv class=\"question-top\">\u003cdiv class=\"question-meta\">\u003cspan class=\"badge ${q.group==='G'?'optional':''}\">${q.group==='G'?'关联拓展 · 选学':group.section+' · '+q.tag}\u003c/span>\u003cspan class=\"badge level\">${q.difficulty}\u003c/span>\u003c/div>\u003cbutton class=\"star-button ${starred?'on':''}\" id=\"star-question\" aria-pressed=\"${starred}\" aria-label=\"${starred?'取消收藏':'收藏本题'}\">${starred?'★':'☆'}\u003c/button>\u003c/div>\u003cdiv class=\"question-body\">\u003cdiv class=\"question-id\">QUESTION ${String(q.number).padStart(2,'0')} / ${TOTAL}${q.group==='G'?' · '+esc(q.tag):''}\u003c/div>\u003ch2 class=\"stem\">${rich(q.stem)}\u003c/h2>${diagram(q.fig,'q'+q.id)}\u003cdiv class=\"options\" role=\"group\" aria-label=\"选择答案\">${q.options.map((o,i)=>`\u003cbutton class=\"option ${choice===i?'selected':''} ${a&&i===q.answer?'correct':''} ${a&&choice===i&&!a.correct?'incorrect':''}\" data-choice=\"${i}\" aria-pressed=\"${choice===i}\" ${a?'disabled':''}>\u003cspan class=\"option-letter\">${letters[i]}\u003c/span>\u003cspan>${rich(o)}\u003c/span>${a&&i===q.answer?'\u003cspan class=\"option-status\" aria-label=\"正确答案\">✓\u003c/span>':a&&choice===i&&!a.correct?'\u003cspan class=\"option-status\" aria-label=\"你的错误答案\">×\u003c/span>':''}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"answer-actions\">${a?'\u003cbutton id=\"retry-question\" class=\"text-button\">↻ 重新作答本题\u003c/button>':`\u003cbutton id=\"check-answer\" class=\"primary\" ${choice===undefined?'disabled':''}>核对答案\u003c/button>`}\u003cspan class=\"answer-hint\">1—4 选择 · Enter 核对\u003c/span>\u003c/div>${a?`\u003cdiv class=\"explanation\">\u003cdiv class=\"result ${a.correct?'':'wrong'}\">${a.correct?'✓ 回答正确':'× 本题答错'}\u003cspan>·\u003c/span>正确答案 ${letters[q.answer]}\u003c/div>\u003ch3>解析\u003c/h3>\u003cp>${rich(q.explanation)}\u003c/p>\u003cdiv class=\"pitfall\">\u003ch3>易错提醒\u003c/h3>\u003cp>${rich(q.pitfall)}\u003c/p>\u003c/div>\u003c/div>`:''}\u003c/div>\u003cdiv class=\"question-bottom\">\u003cbutton id=\"prev-question\" ${idx===0||!list.length?'disabled':''}>← 上一题\u003c/button>\u003cspan>${idx>=0?`当前筛选 ${idx+1} / ${list.length}`:'本题已完成当前筛选条件'}\u003c/span>\u003cbutton id=\"next-question\" ${idx===list.length-1||!list.length?'disabled':''}>下一题 →\u003c/button>\u003c/div>\u003c/article>`;\n}\nfunction renderMap(list) {\n  $('#filtered-count').textContent=`${list.length} 题`;\n  $('#question-grid').innerHTML=list.map(q=>{const a=state.answers[q.id];return `\u003cbutton class=\"grid-btn ${a?(a.correct?'is-right':'is-wrong'):''} ${q.id===state.current?'current':''} ${state.stars.includes(q.id)?'is-starred':''}\" data-goto=\"${q.id}\" aria-label=\"第${q.number}题，${a?(a.correct?'已答对':'已答错'):'未答'}${state.stars.includes(q.id)?'，已收藏':''}\" ${q.id===state.current?'aria-current=\"true\"':''}>${String(q.number).padStart(2,'0')}\u003c/button>`;}).join('');\n  $('#module-description').textContent=moduleId==='all'?'按模块学习，或从题号直接跳转。主体与关联拓展在题目上分别标注。':BANK.groups.find(g=>g.id===moduleId).intro;\n}\nfunction renderCoverage() {\n  const core=COVERAGE.filter(row=>row[0]!=='关联拓展'),optional=COVERAGE.filter(row=>row[0]==='关联拓展');\n  const completed=rows=>rows.filter(row=>row[2].every(id=>state.answers[id])).length;\n  $('#coverage-summary').innerHTML=`核心节点已全部作答 \u003cb>${completed(core)} / ${core.length}\u003c/b> &nbsp; · &nbsp; 关联拓展节点已全部作答 \u003cb>${completed(optional)} / ${optional.length}\u003c/b>`;\n  $('#coverage-body').innerHTML=COVERAGE.map(row=>`\u003ctr class=\"${row[0]==='关联拓展'?'opt-row':''}\">\u003ctd>${row[0]}\u003c/td>\u003ctd>${esc(row[1])}\u003c/td>\u003ctd>${row[2].map(id=>`\u003cbutton class=\"qid-link\" data-goto=\"${id}\" aria-label=\"练习第${byId.get(id).number}题\">${String(byId.get(id).number).padStart(2,'0')}\u003c/button>`).join('')}\u003c/td>\u003ctd>${row[2].filter(id=>state.answers[id]).length} / ${row[2].length}\u003c/td>\u003c/tr>`).join('');\n}\nfunction render(preserve=false) {\n  const list=filtered();\n  renderModules(); renderStats(); renderQuestion(list,preserve); renderMap(list); renderCoverage();\n  $$('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));\n  $('#storage-warning').hidden=storageAvailable;\n}\nfunction switchView(name) {\n  if(!['learn','practice','coverage','guide'].includes(name))return;\n  view=name;\n  $$('.view').forEach(el=>el.hidden=el.id!=='view-'+name);\n  $$('.tab, .learn-entry').forEach(b=>{b.classList.toggle('active',b.dataset.view===name);b.setAttribute('aria-pressed',String(b.dataset.view===name));});\n  $$('.module-btn').forEach(b=>b.classList.toggle('active',view==='practice'&&b.dataset.module===moduleId));\n}\nfunction openLesson(id) {\n  const lesson=document.getElementById(id);\n  if(!lesson||!lesson.classList.contains('lesson-card'))return;\n  switchView('learn');lesson.open=true;\n  lesson.scrollIntoView({block:'start'});lesson.querySelector('summary').focus({preventScroll:true});\n}\nfunction focusQuestion() {\n  const target=$('#question-area .stem')||$('#question-area');\n  target.tabIndex=-1;target.focus({preventScroll:true});\n  $('#question-area').scrollIntoView({block:'start'});\n}\nfunction go(id,reset=false) {\n  if(reset) { moduleId='all';filter='all';query='';$('#search').value=''; }\n  if(!byId.has(id)) return;\n  state.current=id; switchView('practice'); render(); save();\n  focusQuestion();\n}\nfunction navigate(delta) {\n  const list=filtered(),idx=list.findIndex(q=>q.id===state.current);\n  const next=idx\u003c0?(delta>0?list[0]:list.at(-1)):list[idx+delta];\n  if(next) go(next.id);\n}\nfunction choose(choice) { if(!byId.has(state.current)||state.answers[state.current]) return;draft[state.current]=choice;render(true); }\nfunction check() {\n  const q=byId.get(state.current),choice=draft[state.current];\n  if(!q||state.answers[q.id]||choice===undefined)return;\n  state.answers[q.id]={choice,correct:choice===q.answer,at:new Date().toISOString()};save();render(true);\n}\nfunction printBank(solutions) {\n  let html=`\u003cdiv class=\"print-cover\">\u003ch1>功率放大电路 · 拓展练习\u003c/h1>\u003cp>深大 801 电子电路 · 模电第一批 · ${TOTAL} 道精选单选题${solutions?' · 含解析':' · 学生练习版'}\u003c/p>\u003cp>教材参照：童诗白 / 华成英《模拟电子技术基础》第五版，第 8 章 8.1—8.2 基础内容；OTL / BTL 为关联拓展。非官方试题。\u003c/p>\u003cp>统一约定：除题干另有说明，按理想乙类 OCL、对称供电、纯电阻负载、正弦稳态处理；VCC 为每路电源幅值，Uom 为输出峰值，PV 为两路电源总功率，PT 为单管完整周期平均管耗。\u003c/p>\u003cp>姓名：__________________ 日期：__________________\u003c/p>\u003c/div>`;\n  for (const g of BANK.groups) {\n    html+=`\u003ch2 class=\"print-section\">${g.id}　${g.name}${g.scope==='拓展'?'（关联拓展 · 选学）':''}\u003c/h2>`;\n    for(const q of BANK.questions.filter(q=>q.group===g.id)) html+=`\u003carticle class=\"print-question\">\u003cdiv class=\"print-meta\">${g.section} · ${q.tag} · ${q.difficulty}\u003c/div>\u003ch3>${String(q.number).padStart(2,'0')}. ${rich(q.stem)}\u003c/h3>${diagram(q.fig,'print'+q.id)}\u003cdiv class=\"print-options\">${q.options.map((o,i)=>`\u003cdiv>${letters[i]}. ${rich(o)}\u003c/div>`).join('')}\u003c/div>${solutions?`\u003cdiv class=\"print-answer\">\u003cb>答案：${letters[q.answer]}\u003c/b>\u003cp>解析：${rich(q.explanation)}\u003c/p>\u003cp>易错提醒：${rich(q.pitfall)}\u003c/p>\u003c/div>`:''}\u003c/article>`;\n  }\n  if(solutions) html+=`\u003ch2 class=\"print-section\">答案速查\u003c/h2>\u003cp class=\"print-key\">${BANK.questions.map(q=>`${q.number}.${letters[q.answer]}`).join('　')}\u003c/p>`;\n  html+='\u003cp class=\"print-source\">参考来源：深圳大学研究生招生 801 考试大纲（2027）；高等教育出版社模电第五版目录；TI LM1875 数据手册。官方范围以对应报考年度发布为准。\u003c/p>';\n  $('#print-root').innerHTML=html;\n  window.print();\n}\ndocument.addEventListener('click',event=>{\n  const b=event.target.closest('button');if(!b)return;\n  if(b.dataset.view) { switchView(b.dataset.view);if(view==='practice')focusQuestion();return; }\n  if(b.dataset.module) { moduleId=b.dataset.module;switchView('practice');render();save();return; }\n  if(b.dataset.filter) { filter=b.dataset.filter;render();save();return; }\n  if(b.dataset.lessonTarget) {openLesson(b.dataset.lessonTarget);return;}\n  if(b.dataset.goto) {go(Number(b.dataset.goto),view==='coverage'||view=
