wers === 'object') for (const q of BANK.questions) {\r\n    const record = raw.answers[q.id];\r\n    if (record && Number.isInteger(record.choice) && record.choice>=0 && record.choice\u003c4) {\r\n      result.answers[q.id] = {choice:record.choice,correct:record.choice===q.answer,at:typeof record.at==='string'?record.at.slice(0,40):''};\r\n    }\r\n  }\r\n  if (Array.isArray(raw.stars)) result.stars = [...new Set(raw.stars.filter(id=>byId.has(id)))];\r\n  if (byId.has(raw.current)) result.current=raw.current;\r\n  return result;\r\n}\r\ntry {\r\n  const saved=localStorage.getItem(KEY);\r\n  state=cleanRecord(JSON.parse(saved));\r\n} catch(e) { storageAvailable=false; }\r\nfunction save() {\r\n  try { localStorage.setItem(KEY,JSON.stringify(state)); storageAvailable=true; } catch(e) { storageAvailable=false; }\r\n  $('#storage-warning').hidden=storageAvailable;\r\n}\r\nfunction toast(message) { $('#toast').textContent=message; $('#toast').hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('#toast').hidden=true,3500); }\r\nfunction filtered() {\r\n  return BANK.questions.filter(q=>{\r\n    const a=state.answers[q.id];\r\n    return (moduleId==='all'||q.group===moduleId) &&\r\n      (filter==='all'||filter==='unanswered'&&!a||filter==='wrong'&&a&&!a.correct||filter==='starred'&&state.stars.includes(q.id)) &&\r\n      (!query||[q.stem,q.tag,q.number,...q.options,lessonById.get(q.lesson)?.[2]||''].join(' ').toLowerCase().includes(query.toLowerCase()));\r\n  });\r\n}\r\nfunction renderModules() {\r\n  $('#module-list').innerHTML = `\u003cbutton class=\"module-btn ${moduleId==='all'?'active':''}\" data-module=\"all\">\u003cspan class=\"module-letter\">∑\u003c/span>\u003cspan class=\"module-info\">全部模块\u003csmall>基础概念与一步简算\u003c/small>\u003c/span>\u003cspan class=\"module-number\">${TOTAL}\u003c/span>\u003c/button>` + BANK.groups.map(g=>`\u003cbutton class=\"module-btn ${moduleId===g.id?'active':''}\" data-module=\"${g.id}\">\u003cspan class=\"module-letter\">${g.batch}\u003c/span>\u003cspan class=\"module-info\">${esc(g.name)}\u003csmall>${'第'+g.batch+'批 · 教材'+g.section}\u003c/small>\u003c/span>\u003cspan class=\"module-number\">${BANK.questions.filter(q=>q.group===g.id).length}\u003c/span>\u003c/button>`).join('');\r\n}\r\nfunction renderStats() {\r\n  const answers=Object.values(state.answers),right=answers.filter(a=>a.correct).length;\r\n  $('#stat-done').innerHTML=`${answers.length}\u003csmall>/ ${TOTAL}\u003c/small>`;\r\n  $('#stat-right').textContent=right;\r\n  $('#stat-rate').textContent=answers.length?Math.round(right/answers.length*100)+'%':'—';\r\n  $('#stat-wrong').textContent=answers.length-right;\r\n  $('#progress-fill').style.width=answers.length/TOTAL*100+'%';\r\n  $('#progress-text').textContent=answers.length===TOTAL?`${TOTAL} 道精选题已全部作答`:answers.length?`已完成 ${Math.round(answers.length/TOTAL*100)}% · 按自己的节奏继续`:'从第一题开始';\r\n}\r\nfunction renderQuestion(list, preserve) {\r\n  if(!preserve&&!list.some(q=>q.id===state.current)) state.current=list[0]?.id??null;\r\n  const q=byId.get(state.current);\r\n  if(!q) { $('#question-area').innerHTML='\u003cdiv class=\"empty-state\">\u003cdiv class=\"eyebrow\">NO MATCHES\u003c/div>\u003ch2>这里暂时没有题目\u003c/h2>\u003cp>可切换模块、清除搜索，或选择其他筛选条件。\u003c/p>\u003cbutton id=\"clear-filter\" class=\"primary\">显示全部题目\u003c/button>\u003c/div>'; return; }\r\n  const a=state.answers[q.id],choice=a?.choice??draft[q.id],group=BANK.groups.find(g=>g.id===q.group),idx=list.findIndex(item=>item.id===q.id),starred=state.stars.includes(q.id);\r\n  $('#question-area').innerHTML=`\u003carticle class=\"question-card\" data-question-id=\"${q.id}\">\u003cdiv class=\"question-top\">\u003cdiv class=\"question-meta\">\u003cspan class=\"badge \">${'第'+group.batch+'批 · '+q.tag}\u003c/span>\u003cspan class=\"badge level\">${q.difficulty}\u003c/span>\u003c/div>\u003cbutton class=\"star-button ${starred?'on':''}\" id=\"star-question\" aria-pressed=\"${starred}\" aria-label=\"${starred?'取消收藏':'收藏本题'}\">${starred?'★':'☆'}\u003c/button>\u003c/div>\u003cdiv class=\"question-body\">\u003cbutton class=\"back-to-lesson text-button\" data-lesson-target=\"${q.lesson}\">← 复习：${esc(lessonById.get(q.lesson)?.[2]||'知识点')}\u003c/button>\u003cdiv class=\"question-id\">QUESTION ${String(q.number).padStart(2,'0')} / ${TOTAL}\u003c/div>\u003ch2 class=\"stem\">${rich(q.stem)}\u003c/h2>${diagram(q.fig,'q'+q.id)}\u003cdiv class=\"options\" role=\"group\" aria-label=\"选择答案\">${q.options.map((o,i)=>`\u003cbutton class=\"option ${choice===i?'selected':''} ${a&&i===q.answer?'correct':''} ${a&&choice===i&&!a.correct?'incorrect':''}\" data-choice=\"${i}\" aria-pressed=\"${choice===i}\" ${a?'disabled':''}>\u003cspan class=\"option-letter\">${letters[i]}\u003c/span>\u003cspan>${rich(o)}\u003c/span>${a&&i===q.answer?'\u003cspan class=\"option-status\" aria-label=\"正确答案\">✓\u003c/span>':a&&choice===i&&!a.correct?'\u003cspan class=\"option-status\" aria-label=\"你的错误答案\">×\u003c/span>':''}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"answer-actions\">${a?'\u003cbutton id=\"retry-question\" class=\"text-button\">↻ 重新作答本题\u003c/button>':`\u003cbutton id=\"check-answer\" class=\"primary\" ${choice===undefined?'disabled':''}>核对答案\u003c/button>`}\u003cspan class=\"answer-hint\">1—4 选择 · Enter 核对\u003c/span>\u003c/div>${a?`\u003cdiv class=\"explanation\">\u003cdiv class=\"result ${a.correct?'':'wrong'}\">${a.correct?'✓ 回答正确':'× 本题答错'}\u003cspan>·\u003c/span>正确答案 ${letters[q.answer]}\u003c/div>\u003ch3>解析\u003c/h3>\u003cp>${rich(q.explanation)}\u003c/p>\u003cdiv class=\"pitfall\">\u003ch3>易错提醒\u003c/h3>\u003cp>${rich(q.pitfall)}\u003c/p>\u003c/div>\u003c/div>`:''}\u003c/div>\u003cdiv class=\"question-bottom\">\u003cbutton id=\"prev-question\" ${idx===0||!list.length?'disabled':''}>← 上一题\u003c/button>\u003cspan>${idx>=0?`当前筛选 ${idx+1} / ${list.length}`:'本题已完成当前筛选条件'}\u003c/span>\u003cbutton id=\"next-question\" ${idx===list.length-1||!list.length?'disabled':''}>下一题 →\u003c/button>\u003c/div>\u003c/article>`;\r\n}\r\nfunction renderMap(list) {\r\n  $('#filtered-count').textContent=`${list.length} 题`;\r\n  $('#question-grid').innerHTML=list.map(q=>{const a=state.answers[q.id];return `\u003cbutton class=\"grid-btn ${a?(a.correct?'is-right':'is-wrong'):''} ${q.id===state.current?'current':''} ${state.stars.includes(q.id)?'is-starred':''}\" data-goto=\"${q.id}\" aria-label=\"第${q.number}题，${a?(a.correct?'已答对':'已答错'):'未答'}${state.stars.includes(q.id)?'，已收藏':''}\" ${q.id===state.current?'aria-current=\"true\"':''}>${String(q.number).padStart(2,'0')}\u003c/button>`;}).join('');\r\n  $('#module-description').textContent=moduleId==='all'?'按第三至第六批专题学习，或从题号直接跳转。只编基础概念和一步简算。':BANK.groups.find(g=>g.id===moduleId).intro;\r\n}\r\nfunction renderCoverage() {\r\n  const complete=COVERAGE.filter(row=>row[2].every(id=>state.answers[id])).length;\r\n  $('#coverage-summary').innerHTML=`知识节点已全部作答 \u003cb>${complete} / ${COVERAGE.length}\u003c/b> · 这里只统计本合集精选内容`;\r\n  $('#coverage-body').innerHTML=COVERAGE.map(row=>`\u003ctr class=\"${row[0]==='关联拓展'?'opt-row':''}\">\u003ctd>第${BANK.groups.find(g=>g.id===byId.get(row[2][0]).group).batch}批 · ${row[0]}\u003c/td>\u003ctd>${esc(row[1])}\u003c/td>\u003ctd>${row[2].map(id=>`\u003cbutton class=\"qid-link\" data-goto=\"${id}\" aria-label=\"练习第${byId.get(id).number}题\">${String(byId.get(id).number).padStart(2,'0')}\u003c/button>`).join('')}\u003c/td>\u003ctd>${row[2].filter(id=>state.answers[id]).length} / ${row[2].length}\u003c/td>\u003c/tr>`).join('');\r\n}\r\nfunction render(preserve=false) {\r\n  const list=filtered();\r\n  renderModules(); renderStats(); renderQuestion(list,preserve); renderMap(list); renderCoverage();\r\n  $$('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));\r\n  $('#storage-warning').hidden=storageAvailable;\r\n}\r\nfunction switchView(name) {\r\n  if(!['learn','practice','coverage','guide'].includes(name))return;\r\n  view=name;\r\n  $$('.view').forEach(el=>el.hidden=el.id!=='view-'+name);\r\n  $$('.tab, .learn-entry').forEach(b=>{b.classList.toggle('active',b.dataset.view===name);b.setAttribute('aria-pressed',String(b.dataset.view===name));});\r\n  $$('.module-btn').forEach(b=>b.classList.toggle('active',view==='practice'&&b.dataset.module===moduleId));\r\n}\r\nfunction renderLessons(){\r\n $('#batch-index').innerHTML=BANK.groups.map(function(g){return '\u003cbutton class=\"batch-card\" data-learn-batch=\"'+g.id+'\">\u003cspan>第 '+g.batch+' 批\u003c/span>\u003cb>'+esc(g.name)+'\u003c/b>\u003csmall>'+BANK.questions.filter(function(q){return q.group===g.id}).length+' 道基础精选题\u003c/small>\u003c/button>'}).join('');\r\n $('#lesson-index').innerHTML=BANK.groups.map(function(g){return '\u003cdiv class=\"lesson-batch-label\" data-batch=\"'+g.id+'\">第 '+g.batch+' 批 · '+esc(g.name)+'\u003c/div>'+LESSONS.filter(function(l){return BANK.questions.some(function(q){return q.lesson===l[1]&&q.group===g.id})}).map(function(l){return '\u003cbutton data-lesson-target=\"'+l[1]+'\">'+esc(l[2])+'\u003c/button>'}).join('')}).join('');\r\n const images={'learn-A1':'bode','learn-A2':'rc','learn-A3':'miller','learn-A4':'feedback','learn-B1':'filter','learn-B2':'rc','learn-C1':'comp','learn-C2':'window','learn-C3':'hysteresis','learn-C4':'waveforms','learn-D1':'vi','learn-D2':'rectifier','learn-D4':'ina','learn-D5':'charge','learn-D6':'noise'};\r\n $('#lesson-container').innerHTML=LESSONS.map(function(l,i){const g=BANK.groups.find(function(x){return BANK.questions.some(function(q){return q.lesson===l[1]&&q.group===x.id})});return '\u003cdetails class=\"lesson-card\" id=\"'+l[1]+'\" data-batch=\"'+g.id+'\">\u003csummary>\u003cspan class=\"lesson-number\">'+String(i+1).padStart(2,'0')+'\u003c/span>\u003cspan class=\"lesson-title\">'+esc(l[2])+'\u003csmall>教材 '+esc(l[0])+'\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">基础概念\u003c/span>\u003c/summary>\u003cdiv class=\"lesson-body\">\u003cp>'+esc(l[3])+'\u003c/p>'+diagram(images[l[1]],l[1])+'\u003cdiv class=\"lesson-formulas\">'+l[4].map(function(f){return '\u003cspan>'+esc(f)+'\u003c/span>'}).join('')+'\u003c/div>\u003cdiv class=\"lesson-example\">\u003cb>看一个例子\u003c/b>\u003cp>'+esc(l[6])+'\u003c/p>\u003c/div>\u003cdiv class=\"lesson-tip\">\u003cb>易混点与范围\u003c/b>\u003cp>'+esc(l[7])+'\u003c/p>\u003c/div>\u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>'+l[5].map(function(id){return '\u003cbutton data-goto=\"'+id+'\">'+String(id).padStart(2,'0')+' '+esc(byId.get(id).tag)+'\u003c/button>'}).join('')+'\u003c/div>\u003c/div>\u003c/details>'}).join('');\r\n}\r\nfunction showBatch(id){\r\n  if(!BANK.groups.some(g=>g.id===id))return;\r\n  $$('.lesson-card').forEach(c=>{c.hidden=c.dataset.batch!==id;c.open=false;});\r\n  $$('#lesson-index [data-lesson-target]').forEach(b=>{b.hidden=BANK.questions.find(q=>q.lesson===b.dataset.lessonTarget)?.group!==id;});\r\n  $$('.lesson-batch-label').forEach(b=>b.hidden=b.dataset.batch!==id);\r\n  $$('.batch-card').forEach(b=>{b.classList.toggle('active',b.dataset.learnBatch===id);b.setAttribute('aria-pressed',String(b.dataset.learnBatch===id));});\r\n  const first=document.querySelector('.lesson-card[data-batch=\"'+id+'\"]');if(first)first.open=true;\r\n}\r\n\r\nfunction openLesson(id) {\r\n  const lesson=document.getElementById(id);\r\n  if(!lesson||!lesson.classList.contains('lesson-card'))return;\r\n  showBatch(lesson.dataset.batch);switchView('learn');lesson.open=true;\r\n  lesson.scrollIntoView({block:'start'});lesson.querySelector('summary').focus({preventScroll:true});\r\n}\r\nfunction focusQuestion() {\r\n  const target=$('#question-area .stem')||$('#question-area');\r\n  target.tabIndex=-1;target.focus({preventScroll:true});\r\n  $('#question-area').scrollIntoView({block:'start'});\r\n}\r\nfunction go(id,reset=false) {\r\n  if(reset) { moduleId='all';filter='all';query='';$('#search').value=''; }\r\n  if(!byId.has(id)) return;\r\n  state.current=id; switchView('practice'); render(); save();\r\n  focusQuestion();\r\n}\r\nfunction navigate(delta) {\r\n  const list=filtered(),idx=list.findIndex(q=>q.id===state.current);\r\n  const next=idx\u003c0?(delta>0?list[0]:list.at(-1)):list[idx+delta];\r\n  if(next) go(next.id);\r\n}\r\nfunction choose(choice) { if(!byId.has(state.current)||state.answers[state.current]) return;draft[state.current]=choice;render(true); }\r\nfunction check() {\r\n  const q=byId.get(state.current),choice=draft[state.current];\r\n  if(!q||state.answers[q.id]||choice===undefined)return;\r\n  state.answers[q.id]={choice,correct:choice===q.answer,at:new Date().toISOString()};save();render(true);\r\n}\r\nfunction printBank(solutions) {\r\n  let html=`\u003cdiv class=\"print-cover\">\u003ch1>模电第三至六批 · 基础拓展练习\u003c/h1>\u003cp>深大801电子电路 · ${TOTAL}道原创四选一单选题${solutions?' · 含解析':' · 学生练习版'}\u003c/p>\u003cp>教材参考：童诗白、华成英《模拟电子技术基础》第五版，第4—7章筛选的基础内容。非官方试题。\u003c/p>\u003cp>计算与工作条件以题设给定模型为准；不作复杂推导。姓名：__________________ 日期：__________________\u003c/p>\u003c/div>`;\r\n  for (const g of BANK.groups) {\r\n    html+=`\u003ch2 class=\"print-section\">第${g.batch}批　${g.name}\u003c/h2>`;\r\n    for(const q of BANK.questions.filter(q=>q.group===g.id)) html+=`\u003carticle class=\"print-question\">\u003cdiv class=\"print-meta\">${g.section} · ${q.tag} · ${q.difficulty}\u003c/div>\u003ch3>${String(q.number).padStart(2,'0')}. ${rich(q.stem)}\u003c/h3>${diagram(q.fig,'print'+q.id)}\u003cdiv class=\"print-options\">${q.options.map((o,i)=>`\u003cdiv>${letters[i]}. ${rich(o)}\u003c/div>`).join('')}\u003c/div>${solutions?`\u003cdiv class=\"print-answer\">\u003cb>答案：${letters[q.answer]}\u003c/b>\u003cp>解析：${rich(q.explanation)}\u003c/p>\u003cp>易错提醒：${rich(q.pitfall)}\u003c/p>\u003c/div>`:''}\u003c/article>`;\r\n  }\r\n  if(solutions) html+=`\u003ch2 class=\"print-section\">答案速查\u003c/h2>\u003cp class=\"print-key\">${BANK.questions.map(q=>`${q.number}.${letters[q.answer]}`).join('　')}\u003c/p>`;\r\n  html+='\u003cp class=\"print-source\">参考来源：深圳大学研究生招生 801 考试大纲（2027）；高等教育出版社模电第五版目录；Texas Instruments 有源滤波与比较器资料、Analog Devices 仪表放大器和乘法器数据手册。本练习为原创教学材料，并非官方试题。大纲及器件参数以对应年份和具体型号发布的原文为准。\u003c/p>';\r\n  $('#print-root').innerHTML=html;\r\n  window.print();\r\n}\r\ndocument.addEventListener('click',event=>{\r\n  const b=event.target.closest('button');if(!b)return;\r\n  if(b.dataset.view) { switchView(b.dataset.view);if(view==='practice')focusQuestion();return; }\r\n  if(b.dataset.module) { moduleId=b.dataset.module;switchView('practice');render();save();return; }\r\n  if(b.dataset.filter) { filter=b.dataset.filter;render();save();return; }\r\n  if(b.dataset.lessonTarget) {openLesson(b.dataset.lessonTarget);return;}\r\n  if(b.dataset.learnBatch){showBatch(b.dataset.learnBatch);return;}\r\n  if(b.dataset.practiceBatch){moduleId=b.dataset.practiceBatch;filter='all';query='';$('#search').value='';switchView('practice');render();save();focusQuestion();return;}\r\n  if(b.dataset.goto) {go(Number(b.dataset.goto),view==='coverage'||view==='learn');return;}\r\n  if(b.dataset.choice!==undefined) {choose(Number(b.dataset.choice));return;}\r\n  switch(b.id) {\r\n    case 'star-question': state.stars=state.stars.includes(state.current)?state.stars.filter(id=>id!==state.current):[...state.stars,state.current];save();render(true);break;\r\n    case 'check-answer': check();break;\r\n    case 'retry-question': delete state.answers[state.current];delete draft[state.current];save();render(true);break;\r\n    case 'prev-question':navigate(-1);break;\r\n    case 'next-question':navigate(1);break;\r\n    case 'continue-btn': {const q=filtered().find(q=>!state.answers[q.id]);q?go(q.id):toast('当前筛选中的题目已全部作答');break;}\r\n    case 'clear-filter':moduleId='all';filter='all';query='';$('#search').value='';render();break;\r\n    case 'export-btn':{\r\n      const data={kind:'szu801-analog03-06-progress',version:1,edition:BANK.edition,exportedAt:new Date().toISOString(),...state};\r\n      const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));\r\n      const a=document.createElement('a');a.href=url;a.download='深大801-模电第三至六批-学习进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('进度已导出，请保存下载的 JSON 文件');break;\r\n    }\r\n    case 'import-btn':$('#import-file').click();break;\r\n    case 'print-questions':printBank(false);break;\r\n    case 'print-solutions':printBank(true);break;\r\n    case 'reset-btn':if(confirm('清空这份题集的所有作答和收藏记录？此操作无法撤销。可先导出进度备份。')){state={answers:{},stars:[],current:1};draft={};save();render();toast('本页进度已清空');}break;\r\n  }\r\n});\r\n$('#search').addEventListener('input',event=>{query=event.target.value.trim();render();});\r\n$('#import-file').addEventListener('change',async event=>{\r\n  const file=event.target.files[0];if(!file)return;\r\n  try {\r\n    if(file.size>1024*1024)throw new Error('文件超过 1 MB，请选择本题集导出的进度 JSON');\r\n    const raw=JSON.parse(await file.text());\r\n    if(raw.kind!=='szu801-analog03-06-progress'||raw.version!==1)throw new Error('这不是本题集可识别的进度文件');\r\n    const imported=cleanRecord(raw);\r\n    state={answers:{...state.answers,...imported.answers},stars:[...new Set([...state.stars,...imported.stars])],current:imported.current};\r\n    draft={};save();render();toast('已合并导入 '+Object.keys(imported.answers).length+' 道题的作答记录');\r\n  }catch(e){toast('导入失败：'+(e instanceof SyntaxError?'JSON 格式不正确':e.message));}\r\n  event.target.value='';\r\n});\r\ndocument.addEventListener('keydown',event=>{\r\n  if(view!=='practice'||event.ctrlKey||event.altKey||event.metaKey||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName))return;\r\n  if(/^[1-4]$/.test(event.key)){event.preventDefault();choose(Number(event.key)-1);}\r\n  else if(event.key==='Enter'&&!event.target.closest('button')){event.preventDefault();check();}\r\n  else if(event.key==='ArrowLeft'){event.preventDefault();navigate(-1);}\r\n  else if(event.key==='ArrowRight'){event.preventDefault();navigate(1);}\r\n});\r\n$('.brand').addEventListener('click',event=>{event.preventDefault();switchView('learn');$('#view-learn').scrollIntoView({block:'start'});});\r\n$$('[data-diagram]').forEach(el=>el.innerHTML=diagram(el.dataset.diagram,el.id));\r\nrenderLessons();render();showBatch('A');switchView('learn');save();\r\n\u003c/script>\u003c/body>\u003c/html>\r\n\r\n\r\n\r\n"}]</script>
<script>
(() => {
  const data=JSON.parse(document.getElementById('app-data').textContent);
  const batchRoutes={
    1:{page:'analog01',title:'功率放大电路'},
    2:{page:'analog02',title:'直流电源'},
    3:{page:'analog36',title:'频率响应'},
    4:{page:'analog36',title:'有源滤波'},
    5:{page:'analog36',title:'比较器与非正弦波'},
    6:{page:'analog36',title:'信号处理'}
  };
  const navButtons=[...document.querySelectorAll('.batch-btn')];
  const label=document.getElementById('selected-title');
  const status=document.getElementById('status');
  const frames=new Map();
  const loaded=new Set();
  const requested=new Set();
  for(const item of data){
    const frame=document.createElement('iframe');
    frame.className='batch-frame';
    frame.dataset.page=item.page;
    frame.title=item.title;
    frame.setAttribute('aria-label',frame.title);
    frames.set(item.page,frame);
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc?.querySelector('#view-learn'))return;
      loaded.add(item.page);
      if(item.page==='analog36'){
        doc.addEventListener('click',()=>queueMicrotask(()=>{
          if(!frame.classList.contains('active'))return;
          let batch;
          if(!doc.getElementById('view-learn').hidden){
            const group=doc.querySelector('.batch-card.active')?.dataset.learnBatch;
            batch={A:3,B:4,C:5,D:6}[group];
          }else if(!doc.getElementById('view-practice').hidden){
            const match=doc.querySelector('.question-meta .badge')?.textContent.match(/第([3-6])批/);
            if(match)batch=Number(match[1]);
          }
          if(batch){frame.dataset.selectedBatch=String(batch);updateNavigation(batch);}
        }));
        activateCombinedBatch(Number(frame.dataset.selectedBatch));
      }
    });
    document.body.insertBefore(frame,document.getElementById('app-data'));
  }
  function activateCombinedBatch(batch){
    const frame=frames.get('analog36');
    const group={3:'A',4:'B',5:'C',6:'D'}[batch];
    frame.contentDocument.querySelector('[data-view="learn"]')?.click();
    frame.contentDocument.querySelector('[data-learn-batch="'+group+'"]')?.click();
    frame.contentWindow.scrollTo(0,0);
  }
  function updateNavigation(batch){
    const route=batchRoutes[batch];
    navButtons.forEach(button=>{
      if(Number(button.dataset.batch)===batch){
        button.setAttribute('aria-current','page');
        button.scrollIntoView({inline:'nearest',block:'nearest'});
      }else button.removeAttribute('aria-current');
    });
    label.textContent='第'+batch+'批 · '+route.title;
    document.title='模电第'+batch+'批 '+route.title+' · 深大801';
    history.replaceState(null,'','#batch-'+batch);
  }
  function showBatch(batch){
    const route=batchRoutes[batch];
    if(!route)return;
    const frame=frames.get(route.page);
    for(const [pageKey,candidate] of frames){
      const active=pageKey===route.page;
      candidate.classList.toggle('active',active);
      candidate.hidden=!active;
    }
    updateNavigation(batch);
    status.hidden=true;
    frame.dataset.selectedBatch=String(batch);
    if(!requested.has(route.page)){
      requested.add(route.page);
      frame.srcdoc=data.find(entry=>entry.page===route.page).html;
    }else if(loaded.has(route.page)&&batch>=3)activateCombinedBatch(batch);
  }
  navButtons.forEach(button=>button.addEventListener('click',()=>showBatch(Number(button.dataset.batch))));
  document.querySelector('.brand').addEventListener('click',event=>{event.preventDefault();showBatch(1);});
  window.addEventListener('hashchange',()=>{
    const match=location.hash.match(/^#batch-([1-6])$/);
    if(match)showBatch(Number(match[1]));
  });
  const initial=Number(location.hash.match(/^#batch-([1-6])$/)?.[1]||1);
  showBatch(initial);
})();
</script>
</body>
</html>
