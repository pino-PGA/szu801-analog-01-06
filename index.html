reak-after:avoid;page-break-after:avoid}}\r\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"topbar\">\n  \u003ca class=\"brand\" href=\"#learn\" aria-label=\"返回知识点汇总\">\u003cspan class=\"brand-symbol\">801\u003c/span>\u003cspan>电子电路\u003cspan class=\"brand-sub\">拓展题库\u003c/span>\u003c/span>\u003c/a>\n  \u003cnav class=\"tabs\" aria-label=\"主导航\">\u003cbutton class=\"tab active\" data-view=\"learn\">知识点汇总\u003c/button>\u003cbutton class=\"tab\" data-view=\"practice\">专项练习\u003c/button>\u003cbutton class=\"tab\" data-view=\"coverage\">覆盖清单\u003c/button>\u003cbutton class=\"tab\" data-view=\"guide\">使用说明\u003c/button>\u003c/nav>\n  \u003cspan class=\"edition\">模电 · 第二批\u003c/span>\n\u003c/header>\n\u003cdiv id=\"storage-warning\" class=\"notice\" hidden>当前浏览器无法保存本地进度；关闭页面前可用“导出进度”保存记录。\u003c/div>\n\u003csection class=\"hero\">\n  \u003cdiv>\u003cdiv class=\"eyebrow\">ANALOG ELECTRONICS / 02\u003c/div>\u003ch1>直流电源\u003cspan class=\"hero-dot\">.\u003c/span>\u003c/h1>\u003cp>先学基础概念，再做简单小题。\u003c/p>\u003cdiv class=\"hero-tags\">\u003cspan>童诗白 · 模电第五版\u003c/span>\u003cspan>基础概念优先\u003c/span>\u003cspan>支持离线使用\u003c/span>\u003c/div>\u003c/div>\n  \u003cdiv class=\"hero-facts\">\u003cdiv>\u003cstrong>16\u003c/strong>\u003cspan>道精选题\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>7\u003c/strong>\u003cspan>个学习主题\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>4\u003c/strong>\u003cspan>幅原理图解\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\n\u003cdiv class=\"app-shell\">\n  \u003caside class=\"sidebar\">\n    \u003cbutton class=\"learn-entry active\" data-view=\"learn\">\u003cspan>先学\u003c/span> 知识点汇总 →\u003c/button>\n    \u003cdiv class=\"side-heading\">练习模块\u003cspan>CHAPTER 09\u003c/span>\u003c/div>\n    \u003cdiv id=\"module-list\">\u003c/div>\n    \u003cdiv class=\"side-note\">\u003cspan class=\"tiny-label\">本批定位\u003c/span>\u003cp>只学基础概念与一步简算，16 道题覆盖整流、滤波、稳压的核心入门知识。按学习价值精选，不代表命题预测。\u003c/p>\u003c/div>\n    \u003cdiv class=\"side-actions\">\u003cbutton id=\"export-btn\">导出进度 ↗\u003c/button>\u003cbutton id=\"import-btn\">导入进度 ↙\u003c/button>\u003c/div>\n    \u003cinput id=\"import-file\" type=\"file\" accept=\"application/json,.json\" hidden>\n    \u003cp class=\"local-note\">进度保存在当前浏览器；换设备请先导出。\u003c/p>\n  \u003c/aside>\n  \u003cmain>\n    \u003csection id=\"view-learn\" class=\"view\" aria-label=\"知识点汇总\">\n      \u003cdiv class=\"learn-intro\">\n  \u003cdiv class=\"eyebrow\">LEARN FIRST / DC POWER SUPPLY\u003c/div>\u003ch2>先看懂电源，再开始做题。\u003c/h2>\n  \u003cp class=\"learn-lead\">即使没系统学过直流电源，也可以从这里开始：交流经过整流变成单向脉动，滤波减小起伏，稳压让输出更稳定。本批只讲基础概念和简单代入，读完即可进入 16 道练习。\u003c/p>\n  \u003cdiv class=\"learn-route\">\u003cspan>01 整流与滤波\u003c/span>\u003ci>→\u003c/i>\u003cspan>02 稳压的思路\u003c/span>\u003ci>→\u003c/i>\u003cspan>03 16 道基础小题\u003c/span>\u003c/div>\n  \u003cdiv class=\"learn-intro-bottom\">\u003cp>7 个主题，按教材第 9 章的主线组织。每节附对应练习；已学过可直接开始，遇到问题再回来查。\u003c/p>\u003cbutton id=\"start-practice\" class=\"primary\" data-view=\"practice\">开始 / 继续练习 →\u003c/button>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"lesson-index\" aria-label=\"知识点目录\">\n  \u003cbutton data-lesson-target=\"learn-1\">01 电源由什么组成\u003c/button>\u003cbutton data-lesson-target=\"learn-2\">02 桥式整流\u003c/button>\n  \u003cbutton data-lesson-target=\"learn-3\">03 电容滤波与纹波\u003c/button>\u003cbutton data-lesson-target=\"learn-4\">04 稳压管并联稳压\u003c/button>\n  \u003cbutton data-lesson-target=\"learn-5\">05 串联型稳压\u003c/button>\u003cbutton data-lesson-target=\"learn-6\">06 三端稳压器\u003c/button>\n  \u003cbutton data-lesson-target=\"learn-7\">07 开关稳压初识\u003c/button>\n\u003c/div>\n\u003cdetails class=\"lesson-card\" id=\"learn-1\" open>\n  \u003csummary>\u003cspan class=\"lesson-number\">01\u003c/span>\u003cspan class=\"lesson-title\">电源由什么组成\u003csmall>先分清每一步负责什么 · 教材 9.1\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">基础概念\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>电子电路通常需要较稳定的直流供电。典型工频线性电源先用变压器把交流电压变到所需范围，再依次进行\u003cstrong>整流、滤波、稳压\u003c/strong>。\u003c/p>\n    \u003cdiv id=\"lesson-chain\" data-diagram=\"chain\">\u003c/div>\n    \u003cdiv class=\"lesson-two-col\">\u003cdiv class=\"mini-concept\">\u003ch3>整流：先改变方向\u003c/h3>\u003cp>利用二极管的单向导电性，使负载电流保持同一方向。输出通常仍明显起伏。\u003c/p>\u003c/div>\u003cdiv class=\"mini-concept\">\u003ch3>滤波与稳压：再改善输出\u003c/h3>\u003cp>滤波主要减小周期性起伏；稳压进一步抑制输入变化、负载变化引起的输出变化。\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"lesson-tip\">\u003cb>易混概念\u003c/b>“单向”不等于“平滑”，“平滑”也不保证负载变化后电压不变。三个环节不能互相替代。\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"1\">01 功能与顺序\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\u003cdetails class=\"lesson-card\" id=\"learn-2\" open>\n  \u003csummary>\u003cspan class=\"lesson-number\">02\u003c/span>\u003cspan class=\"lesson-title\">桥式整流：两对二极管轮流工作\u003csmall>回路、频率、平均值和耐压 · 教材 9.2\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">概念 + 简算\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>桥式整流用四只二极管组成电桥。正、负半周各有一对导通，使负载两端极性保持一致。读图时先标出交流端哪端电位高，再沿二极管允许的方向找\u003cstrong>完整的负载电流回路\u003c/strong>。\u003c/p>\n    \u003cdiv id=\"lesson-bridge\" data-diagram=\"bridge\">\u003c/div>\n    \u003cdiv class=\"current-path\">\u003cb>a 的电位高于 b\u003c/b>\u003cspan>a → D1 → P → R\u003csub>L\u003c/sub> → N → D3 → b\u003c/span>\u003c/div>\n    \u003cdiv class=\"current-path\">\u003cb>b 的电位高于 a\u003c/b>\u003cspan>b → D2 → P → R\u003csub>L\u003c/sub> → N → D4 → a\u003c/span>\u003c/div>\n    \u003cp>负载电流两个半周都从 P 流向 N。输入每过一个周期，输出出现两次脉动，因此桥式整流的\u003cstrong>脉动频率是输入频率的 2 倍\u003c/strong>，50 Hz 输入对应 100 Hz 脉动；半波整流只利用一个半周，脉动频率则与输入相同。\u003c/p>\n    \u003cdiv class=\"lesson-formulas\">\u003cspan>无滤波平均值：U\u003csub>D\u003c/sub> ≈ 0.9U\u003csub>2\u003c/sub>\u003c/span>\u003cspan>每只管最大反向电压：U\u003csub>RM\u003c/sub> = √2U\u003csub>2\u003c/sub>\u003c/span>\u003c/div>\n    \u003cdiv class=\"lesson-example\">\u003cb>一步简算\u003c/b>U\u003csub>2\u003c/sub>＝12 V 时，理想无滤波桥式输出平均值约为 0.9×12＝10.8 V。这里的 12 V 是副边交流有效值，副边峰值则约为 17.0 V。\u003c/div>\n    \u003cdiv class=\"lesson-tip\">\u003cb>公式条件\u003c/b>这里按理想二极管、正弦输入、纯电阻负载且无滤波电容分析。二极管耐压应按反向峰值选取，并留实际余量；不能把其他整流结构的系数照搬过来。\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"2\">02 导通路径\u003c/button>\u003cbutton data-goto=\"3\">03 脉动频率\u003c/button>\u003cbutton data-goto=\"4\">04 平均电压\u003c/button>\u003cbutton data-goto=\"5\">05 反向耐压\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\u003cdetails class=\"lesson-card\" id=\"learn-3\" open>\n  \u003csummary>\u003cspan class=\"lesson-number\">03\u003c/span>\u003cspan class=\"lesson-title\">电容滤波：用储能填补电压下降\u003csmall>理解充放电，再判断纹波与电压 · 教材 9.3\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">概念 + 简算\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>滤波电容\u003cstrong>并联在负载两端\u003c/strong>。整流电压在峰值附近高于电容电压，并足以克服二极管压降时，电容被补充充电；随后整流电压下降，二极管截止，电容继续向负载放电，输出电压缓慢下降。\u003c/p>\n    \u003cdiv id=\"lesson-ripple\" data-diagram=\"ripple\">\u003c/div>\n    \u003cp>输出中残留的周期性起伏叫\u003cstrong>纹波\u003c/strong>。在其余条件相同、基本工作状态不变时，电容越大，放电造成的电压下降越小；负载电阻越大，负载越轻、电流越小，纹波也通常越小。负载电阻减小则相反。\u003c/p>\n    \u003cdiv class=\"lesson-table-wrap\">\u003ctable class=\"lesson-table\">\u003ccaption>这三个系数对应不同电路或工作条件\u003c/caption>\u003cthead>\u003ctr>\u003cth>条件\u003c/th>\u003cth>输出平均值近似\u003c/th>\u003cth>怎样使用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      \u003ctr>\u003ctd>桥式，无滤波\u003c/td>\u003ctd>0.9U\u003csub>2\u003c/sub>\u003c/td>\u003ctd>理想正弦整流波的平均值。\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>电容滤波，极轻载\u003c/td>\u003ctd>√2U\u003csub>2\u003c/sub> − 2V\u003csub>D\u003c/sub>\u003c/td>\u003ctd>近似充到峰值；每次经过两只桥中二极管。\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>电容滤波，指定有载近似\u003c/td>\u003ctd>约 1.2U\u003csub>2\u003c/sub>\u003c/td>\u003ctd>仅按题干允许的教材估算使用，不是固定精确值。\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n    \u003cdiv class=\"lesson-example\">\u003cb>两种条件，两个答案\u003c/b>副边有效值 10 V、每只导通管压降 0.7 V，极轻载时约为 √2×10−1.4＝12.7 V。若题目另行明确“忽略压降、按有载 1.2U\u003csub>2\u003c/sub> 估算”，则代入得 12 V。\u003c/div>\n    \u003cdiv class=\"lesson-tip\">\u003cb>别把近似记成定律\u003c/b>教材的 1.2U\u003csub>2\u003c/sub> 只在一定的电容、负载和整流条件下用于有载估算，具体数值还会受电源内阻和二极管压降影响。本批第 09 题直接给定此模型，不要求推导纹波。\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"6\">06 充放电\u003c/button>\u003cbutton data-goto=\"7\">07 极轻载电压\u003c/button>\u003cbutton data-goto=\"8\">08 纹波趋势\u003c/button>\u003cbutton data-goto=\"9\">09 有载估算\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\u003cdetails class=\"lesson-card\" id=\"learn-4\" open>\n  \u003csummary>\u003cspan class=\"lesson-number\">04\u003c/span>\u003cspan class=\"lesson-title\">稳压管：用电流变化换取电压稳定\u003csmall>反向击穿、限流与电流分配 · 教材 9.4\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">概念 + 简算\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>稳压管在规定的\u003cstrong>反向击穿稳压区\u003c/strong>工作时，流过它的电流可以在一定范围内变化，而两端电压变化相对较小。正输出的常见接法中，稳压管阴极接正输出、阳极接公共端，与负载并联；输入侧串联电阻 R 负责限流。\u003c/p>\n    \u003cdiv id=\"lesson-zener\" data-diagram=\"zener\">\u003c/div>\n    \u003cp>在正常稳压的近似模型中，输出 U\u003csub>O\u003c/sub>≈U\u003csub>Z\u003c/sub>。先算限流电阻电流，再减去负载分走的电流，就得到稳压管电流：\u003c/p>\n    \u003cdiv class=\"lesson-formulas\">\u003cspan>I\u003csub>R\u003c/sub> = (U\u003csub>I\u003c/sub> − U\u003csub>Z\u003c/sub>)/R\u003c/span>\u003cspan>I\u003csub>L\u003c/sub> = U\u003csub>Z\u003c/sub>/R\u003csub>L\u003c/sub>\u003c/span>\u003cspan>I\u003csub>Z\u003c/sub> = I\u003csub>R\u003c/sub> − I\u003csub>L\u003c/sub>\u003c/span>\u003c/div>\n    \u003cdiv class=\"lesson-example\">\u003cb>顺着电流算一次\u003c/b>U\u003csub>I\u003c/sub>＝12 V，U\u003csub>Z\u003c/sub>＝6 V，R＝300 Ω，R\u003csub>L\u003c/sub>＝600 Ω：I\u003csub>R\u003c/sub>＝20 mA，I\u003csub>L\u003c/sub>＝10 mA，因此 I\u003csub>Z\u003c/sub>＝10 mA。限流电阻两端的电压是 12−6＝6 V。\u003c/div>\n    \u003cdiv class=\"lesson-two-col\">\u003cdiv class=\"mini-concept\">\u003ch3>输入升高\u003c/h3>\u003cp>负载不变时，限流电阻电流增大，多出来的电流主要流入稳压管，输出近似不变。\u003c/p>\u003c/div>\u003cdiv class=\"mini-concept\">\u003ch3>负载变重\u003c/h3>\u003cp>负载分走更多电流，稳压管电流减小。若低于正常稳压所需电流，原来的稳压近似便不再适用。\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"lesson-tip\">\u003cb>必须有工作范围\u003c/b>稳压管正常稳压要求电流既不能过小，也不能使电流或功耗超额定值。击穿区可用于稳压，不意味着可以取消限流。\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"10\">10 工作区与限流\u003c/button>\u003cbutton data-goto=\"11\">11 电流简算\u003c/button>\u003cbutton data-goto=\"12\">12 输入变化\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\u003cdetails class=\"lesson-card\" id=\"learn-5\" open>\n  \u003csummary>\u003cspan class=\"lesson-number\">05\u003c/span>\u003cspan class=\"lesson-title\">串联稳压：让负反馈自动纠偏\u003csmall>不用推导电路，也能判断调节方向 · 教材 9.5\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">基础概念\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>串联型线性稳压电路把\u003cstrong>调整管串在输入与负载的供电通路中\u003c/strong>。电路取出一部分输出电压，与基准比较，再控制调整管，抵消输出偏离。\u003c/p>\n    \u003cdiv class=\"concept-flow\">\u003cspan>输出下降\u003csmall>例如负载变重\u003c/small>\u003c/span>\u003cb>→\u003c/b>\u003cspan>调整管导通增强\u003csmall>管上压降减小\u003c/small>\u003c/span>\u003cb>→\u003c/b>\u003cspan>输出回升\u003csmall>负反馈抵消变化\u003c/small>\u003c/span>\u003c/div>\n    \u003cp>反过来，输出上升时，调整管导通减弱、压降增大，推动输出下降。记住一句话：\u003cstrong>负反馈的调节方向总是反对原来的输出变化\u003c/strong>。\u003c/p>\n    \u003cdiv class=\"lesson-tip\">\u003cb>比较两种稳压方法\u003c/b>前一节靠并联稳压管分流调节；这一节靠串联调整管改变压降。两者都需要足够的输入条件和允许的电流、功耗范围，不能无限补偿。\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"13\">13 反馈调节方向\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\u003cdetails class=\"lesson-card\" id=\"learn-6\" open>\n  \u003csummary>\u003cspan class=\"lesson-number\">06\u003c/span>\u003cspan class=\"lesson-title\">三端稳压器：认型号，算发热\u003csmall>78 / 79 系列与最简单的功耗计算 · 教材 9.5\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">概念 + 简算\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>三端固定式线性稳压器把基准、比较、调整和保护等功能集成在芯片里。常规基本接法中，\u003cstrong>78xx 是正输出系列，79xx 是负输出系列\u003c/strong>；后两位表示标称输出电压的幅值。例如 7805 为＋5 V，7905 为−5 V，均以公共端为参考。\u003c/p>\n    \u003cp>稳压器要正常工作，输入与输出之间要留有足够的电压余量，还要满足电流和散热条件。普通 7805 的输入不能只因“高于 5 V”就认为一定能稳压；具体余量应查数据手册。输入也不是越高越好，多出来的压差会转化为发热。\u003c/p>\n    \u003cdiv class=\"lesson-formulas\">\u003cspan>P\u003csub>损\u003c/sub> ≈ (U\u003csub>I\u003c/sub> − U\u003csub>O\u003c/sub>)I\u003csub>O\u003c/sub>\u003c/span>\u003cspan>输入功率 ≈ 输出功率 + 耗散功率\u003c/span>\u003c/div>\n    \u003cdiv class=\"lesson-example\">\u003cb>一步简算\u003c/b>12 V 输入，5 V 输出，负载电流 0.20 A，忽略自身静态电流：芯片耗散约 (12−5)×0.20＝1.4 W；负载得到 5×0.20＝1.0 W，输入约 2.4 W。\u003c/div>\n    \u003cdiv class=\"lesson-tip\">\u003cb>计算不等于选型完成\u003c/b>这 1.4 W 要靠实际散热条件带走。器件是否能安全承受，还取决于封装、环境和散热设计；78 与 79 系列也不能凭外观猜引脚。\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"14\">14 型号与输出\u003c/button>\u003cbutton data-goto=\"15\">15 耗散功率\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\u003cdetails class=\"lesson-card\" id=\"learn-7\">\n  \u003csummary>\u003cspan class=\"lesson-number\">07\u003c/span>\u003cspan class=\"lesson-title\">开关稳压：只认识最基本的思路\u003csmall>功率器件为什么反复导通、关断 · 教材 9.6\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">基础了解\u003c/span>\u003c/summary>\n  \u003cdiv class=\"lesson-body\">\n    \u003cp>线性调整管在工作中可能同时承受较大电压和较大电流，因而发热。开关稳压让功率器件主要在\u003cstrong>导通和关断\u003c/strong>两种状态切换：导通时压降较小，关断时电流较小，从而减少器件耗散。\u003c/p>\n    \u003cp>电路还要配合储能元件、滤波和控制来传递能量、维持输出。开关器件仍有导通与开关损耗，输出也可能有纹波，所以不能说“完全无损”或“可以取消滤波”。\u003c/p>\n    \u003cdiv class=\"lesson-tip\">\u003cb>本批学到这里即可\u003c/b>只需理解提高效率的基本思路，不要求推导占空比、升降压关系、电感电流或环路设计。\u003c/div>\n    \u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>\u003cbutton data-goto=\"16\">16 降低耗散的思路\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\u003cdiv class=\"recall-grid\">\u003cdiv>\u003cb>桥式整流，无滤波\u003c/b>\u003cspan>平均值约 0.9U\u003csub>2\u003c/sub>；脉动频率 2f。\u003c/span>\u003c/div>\u003cdiv>\u003cb>电容滤波\u003c/b>\u003cspan>极轻载接近峰值；有载要考虑放电。\u003c/span>\u003c/div>\u003cdiv>\u003cb>并联稳压\u003c/b>\u003cspan>电阻电流分给负载和稳压管两路。\u003c/span>\u003c/div>\u003cdiv>\u003cb>线性稳压器\u003c/b>\u003cspan>压差 × 负载电流，近似为耗散功率。\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"learn-finish\">\u003cp>先读懂条件，再选公式。做错后可回到对应主题重看。\u003c/p>\u003cbutton id=\"finish-practice\" class=\"primary\" data-view=\"practice\">进入 16 道练习 →\u003c/button>\u003c/div>\n\u003cp class=\"learn-source\">章节定位依据《模拟电子技术基础》第五版第 9 章；题目均为原创基础练习。\u003cbutton class=\"text-button\" data-view=\"guide\">查看来源与使用说明 ↗\u003c/button>\u003c/p>\n\n    \u003c/section>\n    \u003csection id=\"view-practice\" class=\"view\" hidden>\n      \u003cdiv class=\"learning-return\">\u003cspan>遇到没学过的概念，可以随时回来查。\u003c/span>\u003cbutton class=\"text-button\" data-view=\"learn\">← 知识点汇总\u003c/button>\u003c/div>\n      \u003cdiv class=\"progress-strip\" aria-label=\"练习进度\">\u003cdiv>\u003cspan>已作答\u003c/span>\u003cstrong id=\"stat-done\">0\u003csmall>/ 16\u003c/small>\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>答对\u003c/span>\u003cstrong id=\"stat-right\">0\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>正确率 · 按已答计\u003c/span>\u003cstrong id=\"stat-rate\">—\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>当前错题\u003c/span>\u003cstrong id=\"stat-wrong\">0\u003c/strong>\u003c/div>\u003cdiv class=\"progress-track\">\u003cdiv class=\"track\">\u003ci id=\"progress-fill\">\u003c/i>\u003c/div>\u003cspan id=\"progress-text\">从第一题开始\u003c/span>\u003c/div>\u003c/div>\n      \u003cdiv class=\"toolbar\">\u003cdiv class=\"filter-tabs\" role=\"group\" aria-label=\"题目筛选\">\u003cbutton class=\"filter active\" data-filter=\"all\">全部\u003c/button>\u003cbutton class=\"filter\" data-filter=\"unanswered\">未答\u003c/button>\u003cbutton class=\"filter\" data-filter=\"wrong\">错题\u003c/button>\u003cbutton class=\"filter\" data-filter=\"starred\">收藏\u003c/button>\u003c/div>\u003clabel class=\"search\">\u003cspan>⌕\u003c/span>\u003cinput id=\"search\" type=\"search\" placeholder=\"搜索知识点或题目\" aria-label=\"搜索知识点或题目\">\u003c/label>\u003c/div>\n      \u003cdiv class=\"practice-layout\">\u003cdiv id=\"question-area\" aria-live=\"polite\">\u003c/div>\u003caside class=\"question-map\">\u003cdiv class=\"map-title\">题目导航\u003cspan id=\"filtered-count\">\u003c/span>\u003c/div>\u003cdiv class=\"map-legend\">\u003cspan>\u003ci class=\"dot right\">\u003c/i>答对\u003c/span>\u003cspan>\u003ci class=\"dot wrong\">\u003c/i>答错\u003c/span>\u003cspan>☆ 已收藏\u003c/span>\u003c/div>\u003cdiv id=\"question-grid\">\u003c/div>\u003cdiv class=\"map-foot\">\u003cp id=\"module-description\">\u003c/p>\u003cbutton id=\"continue-btn\" class=\"text-button\">跳到下一道未答 →\u003c/button>\u003c/div>\u003c/aside>\u003c/div>\n      \u003cdiv class=\"print-bar\">\u003cp>需要纸上练习？题目、图和解析可一起打印。\u003c/p>\u003cdiv>\u003cbutton id=\"print-questions\">打印全部题目\u003c/button>\u003cbutton id=\"print-solutions\">打印题目与解析\u003c/button>\u003c/div>\u003c/div>\n    \u003c/section>\n    \u003csection id=\"view-coverage\" class=\"view\" hidden>\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">COVERAGE MAP\u003c/div>\u003ch2>16 道题，学清核心知识\u003c/h2>\u003cp>16 个知识节点，对应 16 道精选题。只列实际考查的基础内容；不追求整章所有细节，不代表命题概率。\u003c/p>\u003c/div>\u003cdiv id=\"coverage-summary\" class=\"coverage-summary\">\u003c/div>\u003cdiv class=\"coverage-table-wrap\">\u003ctable class=\"coverage-table\">\u003cthead>\u003ctr>\u003cth>教材定位\u003c/th>\u003cth>知识节点\u003c/th>\u003cth>对应题号\u003c/th>\u003cth>已答\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"coverage-body\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n    \u003csection id=\"view-guide\" class=\"view\" hidden>\n      \u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">READ BEFORE PRACTICE\u003c/div>\u003ch2>使用说明与计算约定\u003c/h2>\u003cp>模电第二批 · 直流电源。先读入门讲解，再完成基础选择题。\u003c/p>\u003c/div>\n      \u003cdiv class=\"guide-card\">\u003ch3>范围与来源\u003c/h3>\u003cp>本题集参照童诗白、华成英《模拟电子技术基础》第五版第 9 章的结构，精选 9.1 电源组成、9.2 整流、9.3 电容滤波、9.4 稳压管稳压、9.5 串联型稳压及三端稳压器、9.6 开关稳压的基础内容。共 16 道原创四选一单选题，按 01—16 编号。\u003c/p>\u003cp>沿用“先学概念、再做小题”的方式，控制为基础判断与一步简算。倍压整流、复杂纹波推导、稳压性能指标设计和开关变换器定量分析不纳入本批精选。直流电源未在所核对的大纲条目中单列，本题集作为补充学习材料；并非深圳大学官方试题，不把选题优先级当作命题概率。\u003c/p>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://ehall.szu.edu.cn/gsapp/sys/zsjzapp/index.do#/2027/2/801\" target=\"_blank\" rel=\"noopener\">深圳大学：801 电子电路考试大纲（2027） ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://xuanshu.hep.com.cn/front/book/findBookDetails?bookId=59cf4af2ba9eb884cf822130\" target=\"_blank\" rel=\"noopener\">高等教育出版社：模电第五版及第 9 章目录 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.ti.com/lit/ds/symlink/lm340.pdf\" target=\"_blank\" rel=\"noopener\">Texas Instruments：LM340 / LM7805 数据手册，输出与散热参考 ↗\u003c/a>\u003c/li>\u003c/ul>\u003cp class=\"muted\">教材小节以出版社目录为定位；器件的输入范围、引脚、最大电流和散热条件以所用型号及封装的数据手册为准。\u003c/p>\u003c/div>\n      \u003cdiv class=\"guide-card\">\u003ch3>先分清电压，再选公式\u003c/h3>\u003cdiv class=\"notation-grid\">\u003cdiv>\u003cb>U\u003csub>2\u003c/sub>\u003c/b>\u003cp>变压器副边正弦交流电压的有效值，峰值为 √2U\u003csub>2\u003c/sub>。\u003c/p>\u003c/div>\u003cdiv>\u003cb>U\u003csub>D\u003c/sub>\u003c/b>\u003cp>整流或滤波后输出电压的平均值，具体电路由题干确定。\u003c/p>\u003c/div>\u003cdiv>\u003cb>U\u003csub>I\u003c/sub> / U\u003csub>O\u003c/sub>\u003c/b>\u003cp>稳压级的输入、输出电压；不与交流副边电压混用。\u003c/p>\u003c/div>\u003cdiv>\u003cb>I\u003csub>R\u003c/sub> / I\u003csub>L\u003c/sub> / I\u003csub>Z\u003c/sub>\u003c/b>\u003cp>限流电阻电流 / 负载电流 / 稳压管电流。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"formula-block\">无滤波桥式：U\u003csub>D\u003c/sub> = (2√2/π)U\u003csub>2\u003c/sub> ≈ 0.9U\u003csub>2\u003c/sub>\u003cbr>极轻载电容滤波：U\u003csub>D\u003c/sub> ≈ √2U\u003csub>2\u003c/sub> − 2V\u003csub>D\u003c/sub>\u003cbr>并联稳压：I\u003csub>Z\u003c/sub> = (U\u003csub>I\u003c/sub> − U\u003csub>Z\u003c/sub>)/R − U\u003csub>Z\u003c/sub>/R\u003csub>L\u003c/sub>\u003cbr>线性稳压器：P\u003csub>损\u003c/sub> ≈ (U\u003csub>I\u003c/sub> − U\u003csub>O\u003c/sub>)I\u003csub>O\u003c/sub>\u003c/div>\u003cp>无滤波整流的计算默认二极管理想、输入正弦且负载为电阻。电容滤波必须区分极轻载与有载；1.2U\u003csub>2\u003c/sub> 仅在题设允许对应教材近似时使用。稳压管公式以正常反向稳压为前提；线性稳压器功耗式忽略自身静态电流。\u003c/p>\u003c/div>\n      \u003cdiv class=\"guide-card\">\u003ch3>做题、打印与保存\u003c/h3>\u003cp>选择选项后，点击“核对答案”查看解析和易错提醒。“重新作答”会清除该题当前记录，再答后更新错题状态；收藏独立于作答记录。键盘支持 1—4 选择、Enter 核对、左右方向键切换，搜索输入时不会触发这些快捷键。\u003c/p>\u003cp>“打印全部题目”提供学生练习版，“打印题目与解析”附完整答案和速查表。打印包含本批全部 16 题。\u003c/p>\u003cp>进度保存在本机当前浏览器中，与第一批分别保存。换浏览器、移动 HTML 文件或清理浏览数据可能影响原有记录；换设备前请导出 JSON 进度文件。导入仅接受第二批导出的进度，并与本页已有记录合并，同一题采用导入记录。\u003c/p>\u003cbutton id=\"reset-btn\" class=\"danger-button\">清空第二批全部进度与收藏\u003c/button>\u003c/div>\n    \u003c/section>\n\n    \u003cfooter class=\"footer\">\u003cspan>深大 801 · 模电拓展练习 02\u003c/span>\u003cspan>16 道基础精选 · 第二批 v1.0\u003c/span>\u003c/footer>\n  \u003c/main>\n\u003c/div>\n\u003cdiv id=\"toast\" role=\"status\" hidden>\u003c/div>\u003cdiv id=\"print-root\">\u003c/div>\n\u003cscript>const BANK={\n version:1,edition:'basic16',title:'直流电源',subtitle:'深大 801 电子电路 · 第二批 · 16 道精选',\n groups:[\n  {id:'A',name:'电源的组成',section:'9.1',scope:'主体',intro:'沿能量转换顺序，区分整流、滤波和稳压的作用。'},\n  {id:'B',name:'桥式整流',section:'9.2',scope:'主体',intro:'看懂导通路径，掌握频率、平均电压和反向耐压的基础结论。'},\n  {id:'C',name:'电容滤波',section:'9.3',scope:'主体',intro:'从充放电理解纹波，分清轻载峰值与有载估算。'},\n  {id:'D',name:'稳压管稳压',section:'9.4',scope:'主体',intro:'认识反向击穿、限流电阻，以及电流的分配。'},\n  {id:'E',name:'串联型稳压',section:'9.5',scope:'主体',intro:'用负反馈理解调整管如何纠正输出电压变化。'},\n  {id:'F',name:'三端稳压器',section:'9.5',scope:'主体',intro:'辨认 78 / 79 系列，完成最简单的线性稳压器功耗计算。'},\n  {id:'G',name:'开关稳压初识',section:'9.6',scope:'主体',intro:'只认识开关工作的目的，不涉及变换器设计和复杂推导。'}\n ],questions:[]\n};\nfunction Q(id,group,tag,difficulty,stem,options,answer,explanation,pitfall,fig=''){\n BANK.questions.push({id,number:id,group,tag,difficulty,stem,options,answer,explanation,pitfall,fig});\n}\nQ(1,'A','功能与顺序','基础','典型工频线性直流稳压电源中，变压器之后的基本处理顺序是',\n ['稳压 → 滤波 → 整流','整流 → 滤波 → 稳压','滤波 → 整流 → 稳压','整流 → 稳压 → 变频'],1,\n 'B 正确：整流先把交流变为单向脉动电压，滤波再减小纹波，稳压最后抑制输入和负载变化造成的输出变化。A、C 颠倒了整流与后续处理的顺序；D 中的变频不是这一典型电源的末级。',\n '整流后并不立即得到平滑且稳定的直流；整流、滤波和稳压各有任务。');\nQ(2,'B','桥式导通路径','理解','图示理想桥式整流电路，无滤波电容，RL 为电阻。当交流端 a 的电位高于 b 时，哪一组二极管导通？',\n ['D1、D3','D1、D2','D2、D4','D3、D4'],0,\n 'A 正确：常规电流沿 a → D1 → P → RL → N → D3 → b 流动。B 中两管都通向正输出端，不能组成负载回路；C 是 b 高于 a 时的导通对；D 中两管都从负输出端引出，也不能组成这一半周的负载回路。',\n '先按二极管方向找完整回路；另一半周虽然换成 D2、D4，负载电流仍由 P 流向 N。','bridge');\nQ(3,'B','整流脉动频率','基础','输入为 50 Hz 正弦交流，理想单相桥式整流电路无滤波电容。负载电压的脉动重复频率为',\n ['25 Hz','50 Hz','100 Hz','200 Hz'],2,\n 'C 正确：桥式整流利用正、负两个半周，每个输入周期出现两次输出脉动，所以频率为 2×50＝100 Hz。A 将频率误减半；B 对应半波整流的重复频率；D 错把四只二极管的数量当成频率倍数。',\n '整流后的波形虽然单向，仍在周期性变化。“直流分量”与“没有纹波”不是一回事。');\nQ(4,'B','无滤波平均电压','简算','理想单相桥式整流，无滤波电容、纯电阻负载。变压器副边正弦电压的有效值 U2＝12 V，输出电压平均值 UD 约为',\n ['5.4 V','10.8 V','14.4 V','17.0 V'],1,\n 'B 正确：无滤波桥式整流的 UD＝(2√2/π)U2≈0.9U2＝10.8 V。A 用了半波整流的 0.45 系数；C 套用了某些有载电容滤波题的 1.2 估算；D 约为输入峰值，不能当成这一波形的平均值。',\n '0.9U2 指理想桥式整流且无滤波时的平均值；U2 是交流有效值，不是峰值。');\nQ(5,'B','桥式反向耐压','简算','理想单相桥式整流，无滤波电容。副边正弦电压的有效值 U2＝10 V，每只二极管承受的最大反向电压约为',\n ['9.0 V','10.0 V','28.3 V','14.1 V'],3,\n 'D 正确：理想桥式整流中，截止管承受的最大反向电压为副边峰值 √2U2≈14.1 V。A 混淆了整流平均输出电压；B 把有效值当成峰值；C 的 2√2U2 不是本桥式电路的结论。实际选管还应留耐压余量。',\n '耐压结论跟电路结构有关，不能把中心抽头全波整流的结论直接套到桥式整流。');\nQ(6,'C','滤波电容充放电','理解','桥式整流后，在负载 RL 两端并联较大的滤波电容 C。正常有载工作时，关于充放电过程，正确的是',\n ['二极管始终导通，电容只储能而不放电','整流电压接近峰值时给电容充电，其余大部分时间电容向负载放电','电容与负载串联，隔开输出中的直流','电容使输出严格恒定，因此不再需要稳压'],1,\n 'B 正确：只有整流瞬时电压高于电容电压并足以克服导通压降时，桥中相应二极管才给电容补充电荷；随后电容向负载放电。A 忽略了间歇导通；C 描述的是串联隔直；D 把减小纹波误认为完全稳压。',\n '滤波电容并联在负载两端；充电较快、放电较慢，输出仍有纹波。','ripple');\nQ(7,'C','轻载峰值估算','简算','桥式整流加电容滤波，副边正弦电压有效值 U2＝10 V。负载极轻，可忽略电容两次充电间的放电；每只导通二极管压降为 0.7 V。电容电压约为',\n ['12.7 V','9.0 V','13.4 V','14.1 V'],0,\n 'A 正确：桥中每次充电经过两只二极管，电容电压约为 √2U2−2×0.7≈12.7 V。B 是忽略压降的无滤波平均值；C 只减去一只二极管压降；D 完全忽略了题设明确给出的二极管压降。',\n '这里用的是极轻载近似。正常有载时，电容会在两次充电之间放电，平均输出低于这一近似峰值。');\nQ(8,'C','纹波变化趋势','理解','桥式整流加电容滤波，输入频率和有效值不变。在基本工作状态不变的前提下，哪一组变化都有利于减小输出纹波？',\n ['C 减小，RL 减小','C 减小，RL 增大','C 增大，RL 增大','C 增大，RL 减小'],2,\n 'C 正确：增大 C 可使相同负载电流引起的电压下降减小；增大 RL 表示负载变轻、放电电流减小，也使纹波减小。A 的两项都会加重放电引起的电压起伏；B、D 各含一项相反作用，不能说两项都有利。',\n 'RL 越大表示负载越轻；滤波不是把电容无限加大，实际还要考虑充电冲击电流等限制。');\nQ(9,'C','有载教材估算','简算','桥式整流加电容滤波，U2＝10 V。题设明确采用教材中满足滤波条件时的有载近似 UD≈1.2U2，忽略二极管压降。按这一给定模型，UD 约为',\n ['4.5 V','9.0 V','14.1 V','12.0 V'],3,\n 'D 正确：题目已经指定有载估算模型，直接代入 UD≈1.2×10＝12.0 V。A、B 分别套用了无滤波半波、桥式整流系数；C 则是忽略放电的峰值近似，不是本题指定的有载估算。',\n '1.2 是特定有载滤波条件下的经验近似，不能对任何负载或任何电容都当成精确规律。');\nQ(10,'D','稳压管与限流','基础','在常见的电阻—稳压管并联稳压电路中，要使正输出电压近似稳定，通常应使稳压管',\n ['反向接入并工作在规定的反向击穿稳压区，同时用串联电阻限流','正向导通在 0.7 V，输出即可稳定为任意标称稳压值','反向接入且完全截止，输出仍保持为标称稳压值','不经限流电阻直接跨接在任意高压电源上'],0,\n 'A 正确：稳压管在允许电流范围内的反向击穿区，电压变化相对较小；串联电阻用于限流，并承担输入与输出的电压差。B 混淆正向压降和反向稳压值；C 截止时没有稳压作用；D 可能产生过流并损坏器件。',\n '稳压管的“击穿”是受控工作方式，仍有最小稳压电流、最大电流和功耗限制。','zener');\nQ(11,'D','电流分配','简算','图示稳压电路中，UI＝12 V，稳压值 UZ＝6 V，R＝300 Ω，RL＝600 Ω。假定稳压管正常稳压且不超额定值，稳压管电流 IZ 为',\n ['5 mA','20 mA','10 mA','30 mA'],2,\n 'C 正确：串联电阻电流 IR＝(UI−UZ)/R＝(12−6)/300＝20 mA；负载电流 IL＝UZ/RL＝6/600＝10 mA，所以 IZ＝IR−IL＝10 mA。A 算错了电阻上的电压；B 把 IR 全算成 IZ；D 把应相减的分流电流相加。',\n '流过限流电阻的电流分成负载电流和稳压管电流两路，不能把它们当成串联。','zener');\nQ(12,'D','输入变化时的调节','理解','电阻—稳压管并联稳压电路中，R、RL 不变，UI 略有升高。若稳压管始终处于正常稳压区且不超额定值，主要变化是',\n ['IZ 减小，输出电压大幅升高','IZ 增大，输出电压近似不变','负载电流保持不变，IZ 也必然严格不变','稳压管立即截止'],1,\n 'B 正确：输出近似为 UZ，负载电流近似不变；UI 升高使限流电阻上的压差增大，IR 增大，多出的电流主要流入稳压管，所以 IZ 增大。A 的电流方向判断相反；C 忽略了电流分配；D 不符合仍在稳压区的题设。',\n '输入升高或负载变轻时，要留意稳压管电流和功耗可能增大；稳压范围有边界。');\nQ(13,'E','串联负反馈稳压','理解','典型串联型线性稳压电路正常工作时，负载变重使 UO 有下降趋势。负反馈环路应使调整管',\n ['导通减弱、压降增大，进一步拉低 UO','立即永久截止','保持原状态，完全不响应输出变化','导通增强、压降减小，使 UO 回升'],3,\n 'D 正确：负反馈应抵消原来的变化。UO 下跌时，控制电路使串联调整管导通增强、管上压降减小，从而推动 UO 回升。A 会加剧输出下降；B 会中断正常供电；C 没有体现反馈调节。题设假定输入余量和器件能力充足。',\n '“串联”指调整管位于负载供电通路中；稳压管并联稳压电路的调节方式与此不同。');\nQ(14,'F','78 / 79 系列','基础','以公共端为参考，在常规基本接法并满足输入、电流和散热条件时，7805、7905 的标称输出依次为',\n ['＋5 V、−5 V','−5 V、＋5 V','＋5 V、＋5 V','＋7.8 V、−7.9 V'],0,\n 'A 正确：常见 78xx 是正输出固定式线性三端稳压器，79xx 是负输出系列；后两位 05 表示输出电压幅值约为 5 V。B 颠倒极性；C 忽略 79 系列为负输出；D 把系列编号误当输出数值。',\n '这里是基本接法。实际引脚顺序须查对应型号、封装的数据手册，不能假设 78 与 79 系列相同。');\nQ(15,'F','线性稳压器功耗','简算','7805 已在正常稳压区工作，UI＝12 V、UO＝5 V、负载电流 IO＝0.20 A。忽略稳压器自身静态电流，其耗散功率约为',\n ['1.0 W','1.4 W','2.4 W','3.4 W'],1,\n 'B 正确：线性稳压器消耗输入输出之间的差额功率，P损≈(UI−UO)IO＝(12−5)×0.20＝1.4 W。A 是负载得到的输出功率；C 是输入总功率的近似值；D 把输入和输出功率相加，不符合功率平衡。',\n '输入电压不是越高越好；在稳定输出和相同负载电流下，输入升高会增加发热。计算已忽略静态电流。');\nQ(16,'G','开关稳压的基本思路','基础','与串联型线性稳压相比，开关型稳压电源提高效率的主要思路是',\n ['让调整管长期同时承受大压降和大电流','完全取消储能与滤波，直接得到无纹波输出','使功率器件主要在导通和关断状态切换，以减少器件耗散','让负载不再消耗电能'],2,\n 'C 正确：开关器件导通时压降较小，关断时电流较小，可减少大电压与大电流同时出现的时间，并配合储能、滤波实现能量传递。A 正是大耗散状态；B 忽略储能和纹波处理；D 不符合负载仍需获得功率的事实。',\n '开关稳压器仍有导通损耗、开关损耗和纹波；效率较高不等于效率达到 100%。');\nconst COVERAGE=[\n ['9.1','整流、滤波、稳压的作用与顺序',[1]],\n ['9.2','桥式整流的半周导通路径',[2]],\n ['9.2','全波整流的脉动频率',[3]],\n ['9.2','无滤波桥式平均输出 0.9U2',[4]],\n ['9.2','桥式整流二极管反向耐压',[5]],\n ['9.3','滤波电容的充放电过程',[6]],\n ['9.3','极轻载峰值与两只二极管压降',[7]],\n ['9.3','C、RL 对纹波的影响',[8]],\n ['9.3','题设给定条件下的 1.2U2 估算',[9]],\n ['9.4','反向击穿稳压与串联限流',[10]],\n ['9.4','限流电阻、负载、稳压管的电流分配',[11]],\n ['9.4','输入升高时的电流调节',[12]],\n ['9.5','串联调整管与负反馈调节方向',[13]],\n ['9.5','78 / 79 系列输出极性与幅值',[14]],\n ['9.5','线性稳压器耗散功率',[15]],\n ['9.6','开关工作降低耗散的基本思路',[16]]\n];\n\nfunction diagram(type,prefix){\r\n if(!type)return '';\r\n const teaching=prefix.startsWith('lesson-');\r\n const start=(label,box)=>`\u003csvg id=\"${prefix}diagram\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"${box}\" role=\"img\" aria-label=\"${label}\">\u003cdefs>\u003cmarker id=\"${prefix}arr\" markerWidth=\"7\" markerHeight=\"7\" refX=\"6\" refY=\"3.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\u003cpath d=\"M0 0L7 3.5L0 7Z\" fill=\"#146c59\"/>\u003c/marker>\u003c/defs>\u003cstyle>#${prefix}diagram text{font:16px 'Microsoft YaHei',sans-serif;fill:#274c3f}#${prefix}diagram .wire{fill:none;stroke:#355f4f;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}#${prefix}diagram .fine{fill:none;stroke:#a0b1a6;stroke-width:1.3}#${prefix}diagram .arrow{fill:none;stroke:#146c59;stroke-width:2;marker-end:url(#${prefix}arr)}#${prefix}diagram .lbl{font-size:13px;fill:#718277}\u003c/style>`;\r\n const end=caption=>`\u003c/svg>\u003cfigcaption>${caption}\u003c/figcaption>\u003c/figure>`;\r\n const ground=(x,y)=>`\u003cpath class=\"wire\" d=\"M${x} ${y}v10m-17 0h34m-27 7h20m-14 7h8\"/>`;\r\n if(type==='chain'){\r\n  const boxes=[['变压','交流变交流'],['整流','变为单向脉动'],['滤波','减小纹波'],['稳压','稳定输出']];\r\n  return `\u003cfigure>${start('工频线性稳压电源依次包含变压、整流、滤波和稳压四个环节','0 0 600 160')}`+boxes.map((b,i)=>{\r\n   const x=12+i*151;return `\u003crect x=\"${x}\" y=\"32\" width=\"122\" height=\"80\" rx=\"8\" fill=\"#edf4ec\" stroke=\"#a9c5af\"/>\u003ctext x=\"${x+61}\" y=\"66\" text-anchor=\"middle\">${b[0]}\u003c/text>\u003ctext class=\"lbl\" x=\"${x+61}\" y=\"91\" text-anchor=\"middle\">${b[1]}\u003c/text>${i\u003c3?`\u003cpath class=\"arrow\" d=\"M${x+128} 72h18\"/>`:''}`;\r\n  }).join('')+`\u003ctext class=\"lbl\" x=\"300\" y=\"145\" text-anchor=\"middle\">输入：交流电　→　输出：较稳定的直流电\u003c/text>`+end('典型工频线性电源的功能框图；开关电源的实际结构另行分析。');\r\n }\r\n if(type==='bridge'){\r\n  const diode=(x1,y1,x2,y2,name,tx,ty)=>{\r\n   const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),angle=Math.atan2(dy,dx)*180/Math.PI;\r\n   return `\u003cg transform=\"translate(${x1} ${y1}) rotate(${angle})\">\u003cpath class=\"wire\" d=\"M0 0H${len/2-12}M${len/2+6} 0H${len}\"/>\u003cpath d=\"M${len/2-12} -9L${len/2+4} 0L${len/2-12} 9Z\" fill=\"#e7efe6\" stroke=\"#355f4f\" stroke-width=\"2\"/>\u003cpath class=\"wire\" d=\"M${len/2+5} -11v22\"/>\u003c/g>\u003ctext x=\"${tx}\" y=\"${ty}\">${name}\u003c/text>`;\r\n  };\r\n  return `\u003cfigure>${start('桥式整流：D1从a通向正输出P，D2从b通向P，D3从负输出N通向b，D4从N通向a。负载RL跨接P与N。','0 0 600 375')}`+\r\n   diode(135,180,295,45,'D1',168,91)+diode(455,180,295,45,'D2',387,91)+diode(295,315,455,180,'D3',388,291)+diode(295,315,135,180,'D4',167,291)+\r\n   `\u003cpath class=\"wire\" d=\"M135 180h133m54 0h133M295 45h240v111m0 56v103H295\"/>\u003ccircle cx=\"295\" cy=\"180\" r=\"27\" fill=\"#fafcf9\" stroke=\"#355f4f\" stroke-width=\"2\"/>\u003cpath class=\"wire\" d=\"M277 180q9-21 18 0t18 0\"/>\u003crect x=\"525\" y=\"156\" width=\"20\" height=\"56\" fill=\"#fafcf9\" stroke=\"#355f4f\" stroke-width=\"2\"/>\u003cg fill=\"#146c59\">${[[135,180],[455,180],[295,45],[295,315]].map(([x,y])=>`\u003ccircle cx=\"${x}\" cy=\"${y}\" r=\"4\"/>`).join('')}\u003c/g>\u003ctext x=\"111\" y=\"174\">a\u003c/text>\u003ctext x=\"464\" y=\"174\">b\u003c/text>\u003ctext x=\"270\" y=\"34\">P ＋\u003c/text>\u003ctext x=\"270\" y=\"343\">N −\u003c/text>\u003ctext x=\"552\" y=\"190\">RL\u003c/text>\u003ctext class=\"lbl\" x=\"273\" y=\"227\">u2 ～\u003c/text>\u003cpath class=\"arrow\" d=\"M507 106v45\"/>\u003ctext class=\"lbl\" x=\"471\" y=\"101\">IL\u003c/text>\u003ctext class=\"lbl\" x=\"300\" y=\"367\" text-anchor=\"middle\">${teaching?'a 高于 b：a → D1 → P → RL → N → D3 → b':'交流输入：a、b　｜　直流输出：P（＋）、N（−）'}\u003c/text>`+end(teaching?'二极管横线端为阴极。无滤波、纯电阻负载；两半周交替导通，负载电流方向相同。':'图中二极管横线端为阴极，编号仅用于本题。负载为纯电阻，无滤波电容。');\r\n }\r\n if(type==='ripple'){\r\n  const n=720,rect=[],cap=[];let vc=1;\r\n  for(let i=0;i\u003c=n;i++){const t=i/n*4,u=Math.abs(Math.cos(Math.PI*t));if(i)vc=Math.max(u,vc*Math.exp(-4/n/4));const x=55+i/n*500;rect.push(`${i?'L':'M'}${x.toFixed(2)} ${(235-u*150).toFixed(2)}`);cap.push(`${i?'L':'M'}${x.toFixed(2)} ${(235-vc*150).toFixed(2)}`);}\r\n  return `\u003cfigure>${start('桥式整流和电容滤波的定性波形：整流输出每半个交流周期起伏一次，滤波后电压在每个峰值之间缓慢下降。','0 0 600 310')}\u003cpath class=\"fine\" d=\"M55 55v180h510M55 85h500\"/>\u003cpath d=\"${rect.join('')}\" fill=\"none\" stroke=\"#a5b3a5\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\u003cpath d=\"${cap.join('')}\" fill=\"none\" stroke=\"#146c59\" stroke-width=\"3\"/>\u003ctext class=\"lbl\" x=\"18\" y=\"44\">电压\u003c/text>\u003ctext class=\"lbl\" x=\"554\" y=\"257\">时间\u003c/text>\u003ctext class=\"lbl\" x=\"37\" y=\"255\">0\u003c/text>\u003cpath d=\"M80 27h30\" fill=\"none\" stroke=\"#a5b3a5\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\u003ctext class=\"lbl\" x=\"119\" y=\"32\">无滤波\u003c/text>\u003cpath d=\"M288 27h30\" fill=\"none\" stroke=\"#146c59\" stroke-width=\"3\"/>\u003ctext class=\"lbl\" x=\"327\" y=\"32\">电容滤波后\u003c/text>\u003ctext class=\"lbl\" x=\"300\" y=\"289\" text-anchor=\"middle\">${teaching?'峰值附近补充充电　｜　两次充电之间向负载放电':'桥式整流输出与电容滤波后输出的对照'}\u003c/text>`+end('定性示意，忽略二极管压降；真实纹波大小取决于电容、负载、频率及电源内阻。');\r\n }\r\n if(type==='zener')return `\u003cfigure>${start('稳压管并联稳压电路：输入经限流电阻R接到输出，稳压管阴极接正输出、阳极接公共端，负载RL与稳压管并联；IR等于IZ加IL。','0 0 600 340')}\u003cpath class=\"wire\" d=\"M35 75h60m65 0h305v64m0 60v61H35M300 75v70m0 20v95\"/>\u003crect x=\"95\" y=\"65\" width=\"65\" height=\"20\" fill=\"#fafcf9\" stroke=\"#355f4f\" stroke-width=\"2\"/>\u003crect x=\"455\" y=\"139\" width=\"20\" height=\"60\" fill=\"#fafcf9\" stroke=\"#355f4f\" stroke-width=\"2\"/>\u003cpath d=\"M289 165L300 145L311 165Z\" fill=\"#e7efe6\" stroke=\"#355f4f\" stroke-width=\"2\"/>\u003cpath class=\"wire\" d=\"M285 151v-6h30v-6\"/>${ground(300,260)}\u003cg fill=\"#146c59\">\u003ccircle cx=\"300\" cy=\"75\" r=\"4\"/>\u003ccircle cx=\"300\" cy=\"260\" r=\"4\"/>\u003c/g>\u003cg fill=\"#fafcf9\" stroke=\"#355f4f\" stroke-width=\"2\">\u003ccircle cx=\"35\" cy=\"75\" r=\"4\"/>\u003ccircle cx=\"35\" cy=\"260\" r=\"4\"/>\u003c/g>\u003ctext x=\"110\" y=\"49\">R\u003c/text>\u003ctext x=\"18\" y=\"162\">UI\u003c/text>\u003ctext x=\"36\" y=\"103\">＋\u003c/text>\u003ctext x=\"38\" y=\"244\">−\u003c/text>\u003ctext x=\"492\" y=\"79\">UO≈UZ\u003c/text>\u003ctext x=\"487\" y=\"184\">RL\u003c/text>\u003ctext class=\"lbl\" x=\"248\" y=\"155\">DZ\u003c/text>\u003cpath class=\"arrow\" d=\"M188 56h50\"/>\u003cpath class=\"arrow\" d=\"M340 151v44\"/>\u003cpath class=\"arrow\" d=\"M503 106v36\"/>\u003ctext class=\"lbl\" x=\"200\" y=\"43\">IR\u003c/text>\u003ctext class=\"lbl\" x=\"350\" y=\"178\">IZ\u003c/text>\u003ctext class=\"lbl\" x=\"513\" y=\"128\">IL\u003c/text>\u003ctext class=\"lbl\" x=\"300\" y=\"326\" text-anchor=\"middle\">${teaching?'IR = (UI − UZ) / R　　IL = UZ / RL　　IZ = IR − IL':'输入与输出均以公共端为参考，元件数值按题干给定。'}\u003c/text>`+end(teaching?'正输出：稳压管阴极接上方正电位，工作在反向击穿区；三条电流按常规电流方向标示。':'R 为串联电阻，稳压管 DZ 与负载 RL 并联；电流按图中参考方向。');\r\n return '';\r\n}\r\n\nconst $ = s => document.querySelector(s);\nconst $$ = s => Array.from(document.querySelectorAll(s));\nconst KEY = 'szu801.analog02.v1';\nconst TOTAL = BANK.questions.length;\nconst byId = new Map(BANK.questions.map(q => [q.id,q]));\nconst letters = ['A','B','C','D'];\nlet state = {answers:{},stars:[],current:1};\nlet moduleId = 'all', filter = 'all', view = 'learn', query = '';\nlet draft = {}, storageAvailable = true, toastTimer;\nconst esc = text => String(text).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction rich(text) {\n  const symbols={U2:'U\u003csub>2\u003c/sub>',UD:'U\u003csub>D\u003c/sub>',UI:'U\u003csub>I\u003c/sub>',UO:'U\u003csub>O\u003c/sub>',UZ:'U\u003csub>Z\u003c/sub>',IR:'I\u003csub>R\u003c/sub>',IL:'I\u003csub>L\u003c/sub>',IZ:'I\u003csub>Z\u003c/sub>',IO:'I\u003csub>O\u003c/sub>',RL:'R\u003csub>L\u003c/sub>'};\n  return esc(text).replace(/\\b(U2|UD|UI|UO|UZ|IR|IL|IZ|IO|RL)\\b/g,m=>'\u003cspan class=\"math\">'+symbols[m]+'\u003c/span>');\n}\nfunction cleanRecord(raw) {\n  const result = {answers:{},stars:[],current:1};\n  if (!raw || typeof raw !== 'object') return result;\n  if (raw.answers && typeof raw.answers === 'object') for (const q of BANK.questions) {\n    const record = raw.answers[q.id];\n    if (record && Number.isInteger(record.choice) && record.choice>=0 && record.choice\u003c4) {\n      result.answers[q.id] = {choice:record.choice,correct:record.choice===q.answer,at:typeof record.at==='string'?record.at.slice(0,40):''};\n    }\n  }\n  if (Array.isArray(raw.stars)) result.stars = [...new Set(raw.stars.filter(id=>byId.has(id)))];\n  if (byId.has(raw.current)) result.current=raw.current;\n  return result;\n}\ntry {\n  const saved=localStorage.getItem(KEY);\n  state=cleanRecord(JSON.parse(saved));\n} catch(e) { storageAvailable=false; }\nfunction save() {\n  try { localStorage.setItem(KEY,JSON.stringify(state)); storageAvailable=true; } catch(e) { storageAvailable=false; }\n  $('#storage-warning').hidden=storageAvailable;\n}\nfunction toast(message) { $('#toast').textContent=message; $('#toast').hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('#toast').hidden=true,3500); }\nfunction filtered() {\n  return BANK.questions.filter(q=>{\n    const a=state.answers[q.id];\n    return (moduleId==='all'||q.group===moduleId) &&\n      (filter==='all'||filter==='unanswered'&&!a||filter==='wrong'&&a&&!a.correct||filter==='starred'&&state.stars.includes(q.id)) &&\n      (!query||[q.stem,q.tag,q.number,...q.options].join(' ').toLowerCase().includes(query.toLowerCase()));\n  });\n}\nfunction renderModules() {\n  $('#module-list').innerHTML = `\u003cbutton class=\"module-btn ${moduleId==='all'?'active':''}\" data-module=\"all\">\u003cspan class=\"module-letter\">∑\u003c/span>\u003cspan class=\"module-info\">全部模块\u003csmall>基础概念与一步简算\u003c/small>\u003c/span>\u003cspan class=\"module-number\">${TOTAL}\u003c/span>\u003c/button>` + BANK.groups.map(g=>`\u003cbutton class=\"module-btn ${moduleId===g.id?'active':''}\" data-module=\"${g.id}\">\u003cspan class=\"module-letter\">${g.id}\u003c/span>\u003cspan class=\"module-info\">${esc(g.name)}\u003csmall>${g.scope==='拓展'?'选学 · 关联拓展':'教材 '+g.section}\u003c/small>\u003c/span>\u003cspan class=\"module-number\">${BANK.questions.filter(q=>q.group===g.id).length}\u003c/span>\u003c/button>`).join('');\n}\nfunction renderStats() {\n  const answers=Object.values(state.answers),right=answers.filter(a=>a.correct).length;\n  $('#stat-done').innerHTML=`${answers.length}\u003csmall>/ ${TOTAL}\u003c/small>`;\n  $('#stat-right').textContent=right;\n  $('#stat-rate').textContent=answers.length?Math.round(right/answers.length*100)+'%':'—';\n  $('#stat-wrong').textContent=answers.length-right;\n  $('#progress-fill').style.width=answers.length/TOTAL*100+'%';\n  $('#progress-text').textContent=answers.length===TOTAL?'16 道精选题已全部作答':answers.length?`已完成 ${Math.round(answers.length/TOTAL*100)}% · 按自己的节奏继续`:'从第一题开始';\n}\nfunction renderQuestion(list, preserve) {\n  if(!preserve&&!list.some(q=>q.id===state.current)) state.current=list[0]?.id??null;\n  const q=byId.get(state.current);\n  if(!q) { $('#question-area').innerHTML='\u003cdiv class=\"empty-state\">\u003cdiv class=\"eyebrow\">NO MATCHES\u003c/div>\u003ch2>这里暂时没有题目\u003c/h2>\u003cp>可切换模块、清除搜索，或选择其他筛选条件。\u003c/p>\u003cbutton id=\"clear-filter\" class=\"primary\">显示全部题目\u003c/button>\u003c/div>'; return; }\n  const a=state.answers[q.id],choice=a?.choice??draft[q.id],group=BANK.groups.find(g=>g.id===q.group),idx=list.findIndex(item=>item.id===q.id),starred=state.stars.includes(q.id);\n  $('#question-area').innerHTML=`\u003carticle class=\"question-card\" data-question-id=\"${q.id}\">\u003cdiv class=\"question-top\">\u003cdiv class=\"question-meta\">\u003cspan class=\"badge \">${group.section+' · '+q.tag}\u003c/span>\u003cspan class=\"badge level\">${q.difficulty}\u003c/span>\u003c/div>\u003cbutton class=\"star-button ${starred?'on':''}\" id=\"star-question\" aria-pressed=\"${starred}\" aria-label=\"${starred?'取消收藏':'收藏本题'}\">${starred?'★':'☆'}\u003c/button>\u003c/div>\u003cdiv class=\"question-body\">\u003cdiv class=\"question-id\">QUESTION ${String(q.number).padStart(2,'0')} / ${TOTAL}\u003c/div>\u003ch2 class=\"stem\">${rich(q.stem)}\u003c/h2>${diagram(q.fig,'q'+q.id)}\u003cdiv class=\"options\" role=\"group\" aria-label=\"选择答案\">${q.options.map((o,i)=>`\u003cbutton class=\"option ${choice===i?'selected':''} ${a&&i===q.answer?'correct':''} ${a&&choice===i&&!a.correct?'incorrect':''}\" data-choice=\"${i}\" aria-pressed=\"${choice===i}\" ${a?'disabled':''}>\u003cspan class=\"option-letter\">${letters[i]}\u003c/span>\u003cspan>${rich(o)}\u003c/span>${a&&i===q.answer?'\u003cspan class=\"option-status\" aria-label=\"正确答案\">✓\u003c/span>':a&&choice===i&&!a.correct?'\u003cspan class=\"option-status\" aria-label=\"你的错误答案\">×\u003c/span>':''}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"answer-actions\">${a?'\u003cbutton id=\"retry-question\" class=\"text-button\">↻ 重新作答本题\u003c/button>':`\u003cbutton id=\"check-answer\" class=\"primary\" ${choice===undefined?'disabled':''}>核对答案\u003c/button>`}\u003cspan class=\"answer-hint\">1—4 选择 · Enter 核对\u003c/span>\u003c/div>${a?`\u003cdiv class=\"explanation\">\u003cdiv class=\"result ${a.correct?'':'wrong'}\">${a.correct?'✓ 回答正确':'× 本题答错'}\u003cspan>·\u003c/span>正确答案 ${letters[q.answer]}\u003c/div>\u003ch3>解析\u003c/h3>\u003cp>${rich(q.explanation)}\u003c/p>\u003cdiv class=\"pitfall\">\u003ch3>易错提醒\u003c/h3>\u003cp>${rich(q.pitfall)}\u003c/p>\u003c/div>\u003c/div>`:''}\u003c/div>\u003cdiv class=\"question-bottom\">\u003cbutton id=\"prev-question\" ${idx===0||!list.length?'disabled':''}>← 上一题\u003c/button>\u003cspan>${idx>=0?`当前筛选 ${idx+1} / ${list.length}`:'本题已完成当前筛选条件'}\u003c/span>\u003cbutton id=\"next-question\" ${idx===list.length-1||!list.length?'disabled':''}>下一题 →\u003c/button>\u003c/div>\u003c/article>`;\n}\nfunction renderMap(list) {\n  $('#filtered-count').textContent=`${list.length} 题`;\n  $('#question-grid').innerHTML=list.map(q=>{const a=state.answers[q.id];return `\u003cbutton class=\"grid-btn ${a?(a.correct?'is-right':'is-wrong'):''} ${q.id===state.current?'current':''} ${state.stars.includes(q.id)?'is-starred':''}\" data-goto=\"${q.id}\" aria-label=\"第${q.number}题，${a?(a.correct?'已答对':'已答错'):'未答'}${state.stars.includes(q.id)?'，已收藏':''}\" ${q.id===state.current?'aria-current=\"true\"':''}>${String(q.number).padStart(2,'0')}\u003c/button>`;}).join('');\n  $('#module-description').textContent=moduleId==='all'?'按教材 9.1—9.6 学习，或从题号直接跳转。所有练习均以基础概念和一步简算为主。':BANK.groups.find(g=>g.id===moduleId).intro;\n}\nfunction renderCoverage() {\n  const complete=COVERAGE.filter(row=>row[2].every(id=>state.answers[id])).length;\n  $('#coverage-summary').innerHTML=`知识节点已全部作答 \u003cb>${complete} / ${COVERAGE.length}\u003c/b> · 这里只统计本批精选内容`;\n  $('#coverage-body').innerHTML=COVERAGE.map(row=>`\u003ctr class=\"${row[0]==='关联拓展'?'opt-row':''}\">\u003ctd>${row[0]}\u003c/td>\u003ctd>${esc(row[1])}\u003c/td>\u003ctd>${row[2].map(id=>`\u003cbutton class=\"qid-link\" data-goto=\"${id}\" aria-label=\"练习第${byId.get(id).number}题\">${String(byId.get(id).number).padStart(2,'0')}\u003c/button>`).join('')}\u003c/td>\u003ctd>${row[2].filter(id=>state.answers[id]).length} / ${row[2].length}\u003c/td>\u003c/tr>`).join('');\n}\nfunction render(preserve=false) {\n  const list=filtered();\n  renderModules(); renderStats(); renderQuestion(list,preserve); renderMap(list); renderCoverage();\n  $$('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));\n  $('#storage-warning').hidden=storageAvailable;\n}\nfunction switchView(name) {\n  if(!['learn','practice','coverage','guide'].includes(name))return;\n  view=name;\n  $$('.view').forEach(el=>el.hidden=el.id!=='view-'+name);\n  $$('.tab, .learn-entry').forEach(b=>{b.classList.toggle('active',b.dataset.view===name);b.setAttribute('aria-pressed',String(b.dataset.view===name));});\n  $$('.module-btn').forEach(b=>b.classList.toggle('active',view==='practice'&&b.dataset.module===moduleId));\n}\nfunction openLesson(id) {\n  const lesson=document.getElementById(id);\n  if(!lesson||!lesson.classList.contains('lesson-card'))return;\n  switchView('learn');lesson.open=true;\n  lesson.scrollIntoView({block:'start'});lesson.querySelector('summary').focus({preventScroll:true});\n}\nfunction focusQuestion() {\n  const target=$('#question-area .stem')||$('#question-area');\n  target.tabIndex=-1;target.focus({preventScroll:true});\n  $('#question-area').scrollIntoView({block:'start'});\n}\nfunction go(id,reset=false) {\n  if(reset) { moduleId='all';filter='all';query='';$('#search').value=''; }\n  if(!byId.has(id)) return;\n  state.current=id; switchView('practice'); render(); save();\n  focusQuestion();\n}\nfunction navigate(delta) {\n  const list=filtered(),idx=list.findIndex(q=>q.id===state.current);\n  const next=idx\u003c0?(delta>0?list[0]:list.at(-1)):list[idx+delta];\n  if(next) go(next.id);\n}\nfunction choose(choice) { if(!byId.has(state.current)||state.answers[state.current]) return;draft[state.current]=choice;render(true); }\nfunction check() {\n  const q=byId.get(state.current),choice=draft[state.current];\n  if(!q||state.answers[q.id]||choice===undefined)return;\n  state.answers[q.id]={choice,correct:choice===q.answer,at:new Date().toISOString()};save();render(true);\n}\nfunction printBank(solutions) {\n  let html=`\u003cdiv class=\"print-cover\">\u003ch1>直流电源 · 基础拓展练习\u003c/h1>\u003cp>深大 801 电子电路 · 模电第二批 · ${TOTAL} 道精选单选题${solutions?' · 含解析':' · 学生练习版'}\u003c/p>\u003cp>教材参照：童诗白 / 华成英《模拟电子技术基础》第五版，第 9 章 9.1—9.6 基础内容。非官方试题。\u003c/p>\u003cp>统一约定：U2 为变压器副边正弦电压有效值，UD 为整流/滤波后的电压平均值；UI、UO 为稳压级输入和输出。无滤波桥式平均值约 0.9U2；电容滤波须按题设区分有载和极轻载；稳压管计算以处于正常稳压区为前提。\u003c/p>\u003cp>姓名：__________________ 日期：__________________\u003c/p>\u003c/div>`;\n  for (const g of BANK.groups) {\n    html+=`\u003ch2 class=\"print-section\">${g.id}　${g.name}\u003c/h2>`;\n    for(const q of BANK.questions.filter(q=>q.group===g.id)) html+=`\u003carticle class=\"print-question\">\u003cdiv class=\"print-meta\">${g.section} · ${q.tag} · ${q.difficulty}\u003c/div>\u003ch3>${String(q.number).padStart(2,'0')}. ${rich(q.stem)}\u003c/h3>${diagram(q.fig,'print'+q.id)}\u003cdiv class=\"print-options\">${q.options.map((o,i)=>`\u003cdiv>${letters[i]}. ${rich(o)}\u003c/div>`).join('')}\u003c/div>${solutions?`\u003cdiv class=\"print-answer\">\u003cb>答案：${letters[q.answer]}\u003c/b>\u003cp>解析：${rich(q.explanation)}\u003c/p>\u003cp>易错提醒：${rich(q.pitfall)}\u003c/p>\u003c/div>`:''}\u003c/article>`;\n  }\n  if(solutions) html+=`\u003ch2 class=\"print-section\">答案速查\u003c/h2>\u003cp class=\"print-key\">${BANK.questions.map(q=>`${q.number}.${letters[q.answer]}`).join('　')}\u003c/p>`;\n  html+='\u003cp class=\"print-source\">参考来源：深圳大学研究生招生 801 考试大纲（2027）；高等教育出版社模电第五版第 9 章目录；Texas Instruments LM340 / LM7805 数据手册。本练习为原创教学材料，并非官方试题。大纲及器件参数以对应年份和具体型号发布的原文为准。\u003c/p>';\n  $('#print-root').innerHTML=html;\n  window.print();\n}\ndocument.addEventListener('click',event=>{\n  const b=event.t button>\u003cbutton class=\"tab\" data-view=\"coverage\">覆盖清单\u003c/button>\u003cbutton class=\"tab\" data-view=\"guide\">使用说明\u003c/button>\u003c/nav>\u003cspan class=\"edition\">模电 · 第三至六批\u003c/span>\u003c/header>\r\n\u003cdiv id=\"storage-warning\" class=\"notice\" hidden>当前浏览器无法保存进度；关闭页面前请导出记录。\u003c/div>\r\n\u003csection class=\"hero\">\u003cdiv>\u003cdiv class=\"eyebrow\">ANALOG ELECTRONICS / BATCH 03—06\u003c/div>\u003ch1>从频率响应到信号处理\u003cspan class=\"hero-dot\">.\u003c/span>\u003c/h1>\u003cp>四个专题，先看懂基础，再做简单小题。\u003c/p>\u003cdiv class=\"hero-tags\">\u003cspan>童诗白 · 模电第五版\u003c/span>\u003cspan>共 46 道精选题\u003c/span>\u003cspan>支持离线使用\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"hero-facts\">\u003cdiv>\u003cstrong>4\u003c/strong>\u003cspan>个专题批次\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>18\u003c/strong>\u003cspan>个入门主题\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>46\u003c/strong>\u003cspan>道基础练习\u003c/span>\u003c/div>\u003c/div>\u003c/section>\r\n\u003cdiv class=\"app-shell\">\u003caside class=\"sidebar\">\u003cbutton class=\"learn-entry active\" data-view=\"learn\">\u003cspan>先学\u003c/span> 知识点汇总 →\u003c/button>\u003cdiv class=\"side-heading\">练习专题\u003cspan>03—06\u003c/span>\u003c/div>\u003cdiv id=\"module-list\">\u003c/div>\u003cdiv class=\"side-note\">\u003cspan class=\"tiny-label\">学习范围\u003c/span>\u003cp>四个专题共 46 道基础精选题。题量依据所纳入的知识节点确定；不把较难的整章推导纳入本合集。\u003c/p>\u003c/div>\u003cdiv class=\"side-actions\">\u003cbutton id=\"export-btn\">导出进度 ↗\u003c/button>\u003cbutton id=\"import-btn\">导入进度 ↙\u003c/button>\u003c/div>\u003cinput id=\"import-file\" type=\"file\" accept=\"application/json,.json\" hidden>\u003cp class=\"local-note\">进度保存在本机浏览器；换设备请先导出。\u003c/p>\u003c/aside>\r\n\u003cmain>\u003csection id=\"view-learn\" class=\"view\">\u003cdiv class=\"learn-intro\">\u003cdiv class=\"eyebrow\">LEARN FIRST / ANALOG ELECTRONICS\u003c/div>\u003ch2>按专题学习基础概念，再做精选小题。\u003c/h2>\u003cp class=\"learn-lead\">第三至第六批合并学习：频率响应、有源滤波、比较器及信号转换。主要覆盖基础概念、读图和一步简算。每节都有练习入口；复杂稳定性计算、波形周期推导及器件设计不列入本合集。\u003c/p>\u003cdiv class=\"learn-route\">\u003cspan>03 频率响应\u003c/span>\u003ci>→\u003c/i>\u003cspan>04 有源滤波\u003c/span>\u003ci>→\u003c/i>\u003cspan>05 比较器\u003c/span>\u003ci>→\u003c/i>\u003cspan>06 信号处理\u003c/span>\u003c/div>\u003cdiv class=\"learn-intro-bottom\">\u003cp>点选下方批次或目录开始学习。随时可以返回对应知识点。\u003c/p>\u003cbutton id=\"start-practice\" class=\"primary\" data-view=\"practice\">开始练习 →\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=\"batch-index\" class=\"batch-index\">\u003c/div>\u003cdiv class=\"lesson-practice\">\u003cspan>直接进入练习\u003c/span>\u003cbutton data-practice-batch=\"A\">第三批练习\u003c/button>\u003cbutton data-practice-batch=\"B\">第四批练习\u003c/button>\u003cbutton data-practice-batch=\"C\">第五批练习\u003c/button>\u003cbutton data-practice-batch=\"D\">第六批练习\u003c/button>\u003c/div>\u003cdiv id=\"lesson-index\" class=\"lesson-index\">\u003c/div>\u003cdiv id=\"lesson-container\">\u003c/div>\u003c/section>\r\n\u003csection id=\"view-practice\" class=\"view\" hidden>\u003cdiv class=\"learning-return\">\u003cspan>遇到没学过的概念，可以随时返回知识点讲解。\u003c/span>\u003cbutton class=\"text-button\" data-view=\"learn\">← 知识点汇总\u003c/button>\u003c/div>\u003cdiv class=\"progress-strip\" aria-label=\"练习进度\">\u003cdiv>\u003cspan>已作答\u003c/span>\u003cstrong id=\"stat-done\">0\u003csmall>/ 46\u003c/small>\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>答对\u003c/span>\u003cstrong id=\"stat-right\">0\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>正确率\u003c/span>\u003cstrong id=\"stat-rate\">—\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>当前错题\u003c/span>\u003cstrong id=\"stat-wrong\">0\u003c/strong>\u003c/div>\u003cdiv class=\"progress-track\">\u003cdiv class=\"track\">\u003ci id=\"progress-fill\">\u003c/i>\u003c/div>\u003cspan id=\"progress-text\">从第一题开始\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"toolbar\">\u003cdiv class=\"filter-tabs\" role=\"group\" aria-label=\"题目筛选\">\u003cbutton class=\"filter active\" data-filter=\"all\">全部\u003c/button>\u003cbutton class=\"filter\" data-filter=\"unanswered\">未答\u003c/button>\u003cbutton class=\"filter\" data-filter=\"wrong\">错题\u003c/button>\u003cbutton class=\"filter\" data-filter=\"starred\">收藏\u003c/button>\u003c/div>\u003clabel class=\"search\">\u003cspan>⌕\u003c/span>\u003cinput id=\"search\" type=\"search\" placeholder=\"搜索知识点或题目\" aria-label=\"搜索知识点或题目\">\u003c/label>\u003c/div>\u003cdiv class=\"practice-layout\">\u003cdiv id=\"question-area\" aria-live=\"polite\">\u003c/div>\u003caside class=\"question-map\">\u003cdiv class=\"map-title\">题目导航\u003cspan id=\"filtered-count\">\u003c/span>\u003c/div>\u003cdiv class=\"map-legend\">\u003cspan>\u003ci class=\"dot right\">\u003c/i>答对\u003c/span>\u003cspan>\u003ci class=\"dot wrong\">\u003c/i>答错\u003c/span>\u003cspan>☆ 已收藏\u003c/span>\u003c/div>\u003cdiv id=\"question-grid\">\u003c/div>\u003cdiv class=\"map-foot\">\u003cp id=\"module-description\">\u003c/p>\u003cbutton id=\"continue-btn\" class=\"text-button\">下一道未答 →\u003c/button>\u003c/div>\u003c/aside>\u003c/div>\u003cdiv class=\"print-bar\">\u003cp>可打印全部题目或含答案解析的教师版。\u003c/p>\u003cdiv>\u003cbutton id=\"print-questions\">打印题目\u003c/button>\u003cbutton id=\"print-solutions\">打印题目与解析\u003c/button>\u003c/div>\u003c/div>\u003c/section>\r\n\u003csection id=\"view-coverage\" class=\"view\" hidden>\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">COVERAGE MAP\u003c/div>\u003ch2>四批基础知识覆盖清单\u003c/h2>\u003cp>只列实际选入的基础节点，不追求整章覆盖，也不代表命题概率。\u003c/p>\u003c/div>\u003cdiv id=\"coverage-summary\" class=\"coverage-summary\">\u003c/div>\u003cdiv class=\"coverage-table-wrap\">\u003ctable class=\"coverage-table\">\u003cthead>\u003ctr>\u003cth>批次与教材位置\u003c/th>\u003cth>知识节点\u003c/th>\u003cth>题号\u003c/th>\u003cth>已答\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"coverage-body\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\r\n\u003csection id=\"view-guide\" class=\"view\" hidden>\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">READ BEFORE PRACTICE\u003c/div>\u003ch2>使用说明与来源\u003c/h2>\u003cp>模电第三至第六批合并合集，先读讲解，再做基础选择题。\u003c/p>\u003c/div>\u003cdiv class=\"guide-card\">\u003ch3>范围与编题原则\u003c/h3>\u003cp>第三批：放大电路频率响应、负反馈稳定性初识；第四批：有源滤波、非线性运算与乘法器；第五批：电压比较器、非正弦波形识别；第六批：信号转换、仪表放大、电荷放大、隔离放大与噪声。\u003c/p>\u003cp>共46道原创四选一题，按基础知识节点确定每批题量（13、13、12、8），不固定为16道。本合集以概念、功能识别、波形读图和一步简算为主，舍去复杂稳定性推导、波形周期推导和器件设计。此类主题在深圳大学801大纲中未单列或属于边缘补充；材料用于帮助学习，不是官方试题，不表示命题概率。\u003c/p>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://ehall.szu.edu.cn/gsapp/sys/zsjzapp/index.do#/2027/2/801\" target=\"_blank\" rel=\"noopener\">深圳大学 801 电子电路考试大纲（2027） ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://xuanshu.hep.com.cn/front/book/findBookDetails?bookId=59cf4af2ba9eb884cf822130\" target=\"_blank\" rel=\"noopener\">高等教育出版社：童诗白、华成英《模拟电子技术基础》第五版目录 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.ti.com/lit/an/sloa049b/sloa049b.pdf\" target=\"_blank\" rel=\"noopener\">Texas Instruments：有源滤波器设计指南 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.ti.com/lit/an/sboa313a/sboa313a.pdf\" target=\"_blank\" rel=\"noopener\">Texas Instruments：比较器滞回设计 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.analog.com/media/en/technical-documentation/data-sheets/AD620.pdf\" target=\"_blank\" rel=\"noopener\">Analog Devices：AD620 仪表放大器数据手册 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.analog.com/media/en/technical-documentation/data-sheets/AD633.pdf\" target=\"_blank\" rel=\"noopener\">Analog Devices：AD633 模拟乘法器数据手册 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.ti.com/lit/an/sloa020a/sloa020a.pdf\" target=\"_blank\" rel=\"noopener\">Texas Instruments：运放稳定性与频率补偿 ↗\u003c/a>\u003c/li>\u003c/ul>\u003cp class=\"muted\">实际器件的输入范围、增益带宽、共模范围和输出摆幅，以具体型号的数据手册为准。图形为基础原理示意。\u003c/p>\u003c/div>\u003cdiv class=\"guide-card\">\u003ch3>常见关系\u003c/h3>\u003cdiv class=\"formula-block\">RC截止频率：fC ≈ 1/(2πRC)\u003cbr>带宽：fBW = fH − fL\u003cbr>滞回宽度：ΔV = VH − VL\u003cbr>模拟乘法器：W = XY/K\u003cbr>电荷放大：Vout ≈ −Q/Cf\u003c/div>\u003cp>比较器不按线性运放的虚短规律分析。上升与下降使用不同滞回门限。截止频率处仍有输出。有源电路受供电、带宽和输出范围限制。\u003c/p>\u003c/div>\u003cdiv class=\"guide-card\">\u003ch3>操作与进度\u003c/h3>\u003cp>点击选项后核对答案，解析中同时说明正确思路和易错点。按专题筛选、搜索、收藏或复习错题。题目提供对应讲解入口。\u003c/p>\u003cp>进度仅保存在当前浏览器。换设备或清理浏览数据前，可导出JSON并在本合集导入。此合集使用独立的进度标识，不会改动前两批。\u003c/p>\u003cbutton id=\"reset-btn\" class=\"danger-button\">清空本合集全部进度与收藏\u003c/button>\u003c/div>\u003c/section>\r\n\u003cfooter class=\"footer\">\u003cspan>深大 801 · 模电拓展练习 03—06\u003c/span>\u003cspan>46 道基础精选 · v1.0\u003c/span>\u003c/footer>\u003c/main>\u003c/div>\u003cdiv id=\"toast\" role=\"status\" hidden>\u003c/div>\u003cdiv id=\"print-root\">\u003c/div>\u003cscript>const BANK={\r\n  \"version\": 1,\r\n  \"edition\": \"analog-03-06\",\r\n  \"title\": \"模电第三至六批\",\r\n  \"subtitle\": \"深大 801 电子电路 · 基础拓展合集\",\r\n  \"groups\": [\r\n    {\r\n      \"id\": \"A\",\r\n      \"batch\": 3,\r\n      \"name\": \"频率响应与稳定性\",\r\n      \"section\": \"第四章、5.6\",\r\n      \"scope\": \"基础精选\",\r\n      \"intro\": \"读懂频率变化对放大倍数的影响，认识反馈过强时的自激风险。\"\r\n    },\r\n    {\r\n      \"id\": \"B\",\r\n      \"batch\": 4,\r\n      \"name\": \"有源滤波与运算电路\",\r\n      \"section\": \"6.1—6.3\",\r\n      \"scope\": \"基础精选\",\r\n      \"intro\": \"识别滤波器用途、截止频率，并了解对数与乘除运算电路。\"\r\n    },\r\n    {\r\n      \"id\": \"C\",\r\n      \"batch\": 5,\r\n      \"name\": \"比较器与非正弦波\",\r\n      \"section\": \"7.2—7.3\",\r\n      \"scope\": \"基础精选\",\r\n      \"intro\": \"判断比较器翻转状态、滞回区间和基本波形发生关系。\"\r\n    },\r\n    {\r\n      \"id\": \"D\",\r\n      \"batch\": 6,\r\n      \"name\": \"信号转换、特殊放大与噪声\",\r\n      \"section\": \"6.4、7.4\",\r\n      \"scope\": \"基础精选\",\r\n      \"intro\": \"认识信号转换及仪表、电荷、隔离放大器和抗干扰常识。\"\r\n    }\r\n  ],\r\n  \"questions\": [\r\n    {\r\n      \"id\": 1,\r\n      \"number\": 1,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A1\",\r\n      \"tag\": \"中频增益\",\r\n      \"difficulty\": \"基础\",\r\n      \"stem\": \"放大电路处在中频段、耦合电容近似短路而结电容影响可忽略时，增益通常\",\r\n      \"options\": [\r\n        \"必然为零\",\r\n        \"接近稳定的中频值\",\r\n        \"只由结电容决定\",\r\n        \"随频率升高无限增大\"\r\n      ],\r\n      \"answer\": 1,\r\n      \"explanation\": \"B正确：中频段两端电容的影响较小，增益近似平坦。A把耦合电容误作开路；C提前考虑了高频影响；D忽略了有限带宽。\",\r\n      \"pitfall\": \"中频增益只是在一定频率范围内的近似值。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 1,\r\n      \"section\": \"4.1\"\r\n    },\r\n    {\r\n      \"id\": 2,\r\n      \"number\": 2,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A1\",\r\n      \"tag\": \"上下限频率\",\r\n      \"difficulty\": \"基础\",\r\n      \"stem\": \"上下限频率处的电压增益通常降为中频增益约0.707倍，即下降\",\r\n      \"options\": [\r\n        \"10 dB\",\r\n        \"20 dB\",\r\n        \"6 dB\",\r\n        \"3 dB\"\r\n      ],\r\n      \"answer\": 3,\r\n      \"explanation\": \"D正确：幅度变成1/√2，功率约减半，电压增益下降约3 dB。其余选项的分贝值不对应半功率点。\",\r\n      \"pitfall\": \"把下降3 dB理解为电压幅度约0.707倍。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 2,\r\n      \"section\": \"4.1\"\r\n    },\r\n    {\r\n      \"id\": 3,\r\n      \"number\": 3,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A2\",\r\n      \"tag\": \"低频端电容\",\r\n      \"difficulty\": \"理解\",\r\n      \"stem\": \"阻容耦合放大电路的低端响应主要受耦合电容控制。减小该电容、其他条件不变，最可能出现\",\r\n      \"options\": [\r\n        \"下限频率升高，低频响应变差\",\r\n        \"下限频率降低，低频响应改善\",\r\n        \"上限频率必然升高\",\r\n        \"中频增益变成负值\"\r\n      ],\r\n      \"answer\": 0,\r\n      \"explanation\": \"A正确：耦合电容变小使RC时间常数减小，高通拐点上升。B方向相反；C混淆高频因素；D无关。\",\r\n      \"pitfall\": \"单一RC高通的拐点约为1/(2πRC)。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 3,\r\n      \"section\": \"4.4\"\r\n    },\r\n    {\r\n      \"id\": 4,\r\n      \"number\": 4,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A2\",\r\n      \"tag\": \"发射极旁路\",\r\n      \"difficulty\": \"理解\",\r\n      \"stem\": \"典型共射放大电路的发射极旁路电容失效并近似开路，直流工作点保持不变时，其中频电压增益幅值通常\",\r\n      \"options\": [\r\n        \"严格不变\",\r\n        \"增大，因为交流负反馈减弱\",\r\n        \"减小，因为交流负反馈增强\",\r\n        \"必定变成零\"\r\n      ],\r\n      \"answer\": 2,\r\n      \"explanation\": \"C正确：电容开路后，发射极电阻不能被交流旁路，交流负反馈增强，电压增益幅值通常下降。增益并非必然为零；只要直流偏置仍正常，电路通常仍能放大信号。\",\r\n      \"pitfall\": \"旁路电容主要改变交流增益和低频响应。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 4,\r\n      \"section\": \"4.4\"\r\n    },\r\n    {\r\n      \"id\": 5,\r\n      \"number\": 5,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A2\",\r\n      \"tag\": \"低端截止简算\",\r\n      \"difficulty\": \"简算\",\r\n      \"stem\": \"RC高通环节R=10 kΩ、C=10 nF，取1/(2π)≈0.16，截止频率约为\",\r\n      \"options\": [\r\n        \"160 Hz\",\r\n        \"16 kHz\",\r\n        \"约1.6 kHz\",\r\n        \"160 kHz\"\r\n      ],\r\n      \"answer\": 2,\r\n      \"explanation\": \"C正确：0.16/(10⁴×10⁻⁸)=1600 Hz。其余选项的小数点或十进位错误。RC=10⁴ Ω×10⁻⁸ F=10⁻⁴ s；先统一成Ω与F再代入。\",\r\n      \"pitfall\": \"先算RC=100 μs，再取倒数并乘0.16。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 5,\r\n      \"section\": \"4.4\"\r\n    },\r\n    {\r\n      \"id\": 6,\r\n      \"number\": 6,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A3\",\r\n      \"tag\": \"高频端结电容\",\r\n      \"difficulty\": \"基础\",\r\n      \"stem\": \"单级放大器高频增益下降，通常主要因为\",\r\n      \"options\": [\r\n        \"结电容、寄生电容的影响随频率升高而增大\",\r\n        \"耦合电容容抗变得很大\",\r\n        \"输入直流分量增加\",\r\n        \"反馈电阻自动断开\"\r\n      ],\r\n      \"answer\": 0,\r\n      \"explanation\": \"A正确：结电容和布线电容在高频形成分流与额外极点。B是低频影响；C、D无关。高频容抗减小，会分流一部分信号。耦合电容在低频才容易形成明显衰减。\",\r\n      \"pitfall\": \"电容本身不随频率改变，变化的是容抗。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 6,\r\n      \"section\": \"4.2\"\r\n    },\r\n    {\r\n      \"id\": 7,\r\n      \"number\": 7,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A3\",\r\n      \"tag\": \"密勒效应\",\r\n      \"difficulty\": \"理解\",\r\n      \"stem\": \"反相放大级中输入输出间的微小电容Cμ，增益幅值变大后，在输入端的等效值通常\",\r\n      \"options\": [\r\n        \"变成电阻\",\r\n        \"变为零\",\r\n        \"仍严格等于Cμ\",\r\n        \"增大\"\r\n      ],\r\n      \"answer\": 3,\r\n      \"explanation\": \"D正确：反相级输入等效电容约为Cμ(1+|Av|)。B、C忽略增益效应；A混淆元件类型。例如反相增益幅值增加，跨接电容两端的交流电压变化更大，因此输入端需要的电容电流也更大。\",\r\n      \"pitfall\": \"这是小信号近似，密勒效应会降低高频响应。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 7,\r\n      \"section\": \"4.2\"\r\n    },\r\n    {\r\n      \"id\": 8,\r\n      \"number\": 8,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A3\",\r\n      \"tag\": \"密勒效应简算\",\r\n      \"difficulty\": \"简算\",\r\n      \"stem\": \"反相级Av=−9，跨接电容Cμ=20 pF，按C输入≈(1+|Av|)Cμ估算为\",\r\n      \"options\": [\r\n        \"20 pF\",\r\n        \"200 pF\",\r\n        \"180 pF\",\r\n        \"2 nF\"\r\n      ],\r\n      \"answer\": 1,\r\n      \"explanation\": \"B正确：(1+9)×20 pF=200 pF。其余选项分别忽略、少算系数或多算十倍。20 pF是元件本身的电容，不是反相放大后的输入等效值；不要漏掉括号内的1。\",\r\n      \"pitfall\": \"先取反相增益幅值，再乘电容。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 8,\r\n      \"section\": \"4.2\"\r\n    },\r\n    {\r\n      \"id\": 9,\r\n      \"number\": 9,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A4\",\r\n      \"tag\": \"多级带宽\",\r\n      \"difficulty\": \"基础\",\r\n      \"stem\": \"两级相同、互不加载的一阶低通放大级串接。在单级自身截止频率处，每级增益均为各自通带增益的0.707倍。总增益约为总通带增益的\",\r\n      \"options\": [\r\n        \"0.707倍\",\r\n        \"不变\",\r\n        \"1.414倍\",\r\n        \"0.50倍\"\r\n      ],\r\n      \"answer\": 3,\r\n      \"explanation\": \"D正确：两级增益相乘，0.707²≈0.50。A只计一极；C、B忽略级联衰减。此时总电压增益已下降约6 dB，所以整个级联电路的−3 dB上限频率会比单级上限更低。\",\r\n      \"pitfall\": \"串接时幅度增益相乘；总截止频率不等于单级截止频率。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 9,\r\n      \"section\": \"4.5、5.6\"\r\n    },\r\n    {\r\n      \"id\": 10,\r\n      \"number\": 10,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A4\",\r\n      \"tag\": \"带宽\",\r\n      \"difficulty\": \"简算\",\r\n      \"stem\": \"放大器下限频率200 Hz、上限频率20 kHz，带宽约为\",\r\n      \"options\": [\r\n        \"20.2 kHz\",\r\n        \"19.8 kHz\",\r\n        \"100 Hz\",\r\n        \"1.01 kHz\"\r\n      ],\r\n      \"answer\": 1,\r\n      \"explanation\": \"B正确：带宽fH−fL=19800 Hz。A把上下限相加；C、D误算。用Hz统一计算：20000−200=19800 Hz，再除以1000换成kHz。\",\r\n      \"pitfall\": \"频带宽度用上下限频率相减。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 10,\r\n      \"section\": \"4.1\"\r\n    },\r\n    {\r\n      \"id\": 11,\r\n      \"number\": 11,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A4\",\r\n      \"tag\": \"负反馈稳定性\",\r\n      \"difficulty\": \"基础\",\r\n      \"stem\": \"负反馈环路的相移令反馈在某频率附近变成等效正反馈，且环路增益足够大时，可能发生\",\r\n      \"options\": [\r\n        \"输出阻抗必为零\",\r\n        \"带宽无限增大\",\r\n        \"自激振荡\",\r\n        \"稳定直流偏置\"\r\n      ],\r\n      \"answer\": 2,\r\n      \"explanation\": \"C正确：反馈相位和环路增益共同满足起振条件时可能自激。其余不是该条件的结果。负反馈在中频有效，并不意味着它在所有频率都稳定；频率补偿用于改善环路的稳定性。\",\r\n      \"pitfall\": \"有相移本身不足以判断自激，还需检查环路增益。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 11,\r\n      \"section\": \"4.5、5.6\"\r\n    },\r\n    {\r\n      \"id\": 12,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A3\",\r\n      \"tag\": \"增益带宽积\",\r\n      \"difficulty\": \"简算\",\r\n      \"stem\": \"某运放可按单主极点模型近似，且满足闭环增益×带宽≈1 MHz。非反相闭环增益为20时，带宽约为\",\r\n      \"options\": [\r\n        \"50 kHz\",\r\n        \"1 MHz\",\r\n        \"20 MHz\",\r\n        \"5 kHz\"\r\n      ],\r\n      \"answer\": 0,\r\n      \"explanation\": \"A正确：带宽≈1 MHz/20=0.05 MHz=50 kHz。在这类近似下，闭环增益提高，带宽相应减小。不是将1 MHz与增益相乘。\",\r\n      \"pitfall\": \"只用于题设给定的单主极点近似；不要推广成所有放大电路都严格满足的规律。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 101,\r\n      \"number\": 12,\r\n      \"section\": \"4.2\"\r\n    },\r\n    {\r\n      \"id\": 13,\r\n      \"group\": \"A\",\r\n      \"lesson\": \"learn-A4\",\r\n      \"tag\": \"频率补偿的作用\",\r\n      \"difficulty\": \"基础\",\r\n      \"stem\": \"负反馈放大电路出现高频自激倾向时，频率补偿的主要目的是\",\r\n      \"options\": [\r\n        \"改善反馈环路的稳定性\",\r\n        \"使所有频率的增益同时无限增大\",\r\n        \"让运放失去供电\",\r\n        \"把负反馈永久改成正反馈\"\r\n      ],\r\n      \"answer\": 0,\r\n      \"explanation\": \"A正确：补偿改变环路的幅频或相频特性，使环路离自激条件更远。常见代价是带宽或响应速度降低；补偿不是让所有性能同时无限提高。\",\r\n      \"pitfall\": \"这里只认识补偿目的，不要求设计补偿电容或推导相位裕度。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 102,\r\n      \"number\": 13,\r\n      \"section\": \"4.5、5.6\"\r\n    },\r\n    {\r\n      \"id\": 14,\r\n      \"number\": 14,\r\n      \"group\": \"B\",\r\n      \"lesson\": \"learn-B1\",\r\n      \"tag\": \"低通滤波器\",\r\n      \"difficulty\": \"基础\",\r\n      \"stem\": \"低通滤波器通常用于\",\r\n      \"options\": [\r\n        \"消除所有频率\",\r\n        \"只保留高于截止频率的信号\",\r\n        \"保留低频并衰减高频噪声\",\r\n        \"把交流自动变成直流\"\r\n      ],\r\n      \"answer\": 2,\r\n      \"explanation\": \"C正确：低通在低频通带内通过，较高频率逐渐衰减。B是高通；A、D不符合滤波器功能。\",\r\n      \"pitfall\": \"实际滤波器有过渡带，阻带不是突然变成零。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 12,\r\n      \"section\": \"6.3.2\"\r\n    },\r\n    {\r\n      \"id\": 15,\r\n      \"number\": 15,\r\n      \"group\": \"B\",\r\n      \"lesson\": \"learn-B1\",\r\n      \"tag\": \"高通滤波器\",\r\n      \"difficulty\": \"基础\",\r\n      \"stem\": \"若需抑制低频漂移并保留较高频信号，优先考虑\",\r\n      \"options\": [\r\n        \"低通\",\r\n        \"高通\",\r\n        \"带阻\",\r\n        \"直流放大器\"\r\n      ],\r\n      \"answer\": 1,\r\n      \"explanation\": \"B正确：高通衰减截止频率以下的低频成分。A衰减所需高频；C只抑制一段；D不能抑制漂移。低通是保留低频；带阻只衰减一段有限频带；本题要衰减低端漂移而保留更高频率，所以选高通。\",\r\n      \"pitfall\": \"确认信号频谱后再设截止频率。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 13,\r\n      \"section\": \"6.3.2\"\r\n    },\r\n    {\r\n      \"id\": 16,\r\n      \"number\": 16,\r\n      \"group\": \"B\",\r\n      \"lesson\": \"learn-B1\",\r\n      \"tag\": \"带通滤波器\",\r\n      \"difficulty\": \"基础\",\r\n      \"stem\": \"图中为某滤波器的归一化幅频曲线。它主要属于哪一种滤波器？\",\r\n      \"options\": [\r\n        \"低通\",\r\n        \"高通\",\r\n        \"带阻\",\r\n        \"带通\"\r\n      ],\r\n      \"answer\": 3,\r\n      \"explanation\": \"D正确：带通保留一段频率范围。带阻则抑制一段范围；低通和高通只选择一侧。带通相当于同时限定一个低端和高端。带阻的作用相反：让中间一段较难通过。\",\r\n      \"pitfall\": \"带通关心上下两个截止频率。\",\r\n      \"fig\": \"q-bandpass\",\r\n      \"sourceId\": 14,\r\n      \"section\": \"6.3.2\"\r\n    },\r\n    {\r\n      \"id\": 17,\r\n      \"number\": 17,\r\n      \"group\": \"B\",\r\n      \"lesson\": \"learn-B1\",\r\n      \"tag\": \"带阻滤波器\",\r\n      \"difficulty\": \"基础\",\r\n      \"stem\": \"保留低频和高频两侧，只抑制中间一段干扰，可考虑\",\r\ 高的输入阻抗可减轻传感器负载；较大的共模抑制比可减弱两端共同干扰对输出的影响。\",\r\n      \"pitfall\": \"共模范围和CMRR有限，需查器件指标。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 38,\r\n      \"section\": \"6.4.1\"\r\n    },\r\n    {\r\n      \"id\": 43,\r\n      \"number\": 43,\r\n      \"group\": \"D\",\r\n      \"lesson\": \"learn-D4\",\r\n      \"tag\": \"差分放大简算\",\r\n      \"difficulty\": \"简算\",\r\n      \"stem\": \"理想仪表放大器差分增益G=100，输入同相端V+=2.002 V、反相端V−=2.000 V；两输入都在允许范围内，按Vo=G(V+−V−)，输出为\",\r\n      \"options\": [\r\n        \"0.002 V\",\r\n        \"200.2 V\",\r\n        \"2.0 V\",\r\n        \"0.20 V\"\r\n      ],\r\n      \"answer\": 3,\r\n      \"explanation\": \"D正确：先相减得到2.002−2.000=0.002 V，再乘100，输出为0.20 V。仪表放大器放大的是差分量，不是把其中一个输入对地电压直接乘100。\",\r\n      \"pitfall\": \"共同具有的约2 V成分是共模量；本题理想模型忽略其对输出的贡献。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 39,\r\n      \"section\": \"6.4.1\"\r\n    },\r\n    {\r\n      \"id\": 44,\r\n      \"number\": 44,\r\n      \"group\": \"D\",\r\n      \"lesson\": \"learn-D5\",\r\n      \"tag\": \"电荷放大器\",\r\n      \"difficulty\": \"简算\",\r\n      \"stem\": \"理想电荷放大器满足Vout≈−Q/Cf，供电与输出余量足够。Q=12 nC、Cf=2 nF时，输出约为\",\r\n      \"options\": [\r\n        \"−6 V\",\r\n        \"+6 V\",\r\n        \"−24 V\",\r\n        \"+24 V\"\r\n      ],\r\n      \"answer\": 0,\r\n      \"explanation\": \"A正确：−12/2=−6 V，负号表示反相。nC/nF与C/F一样得到V，纳米前缀相消；反馈电容增大时，同一电荷对应的输出幅值减小。\",\r\n      \"pitfall\": \"假定输出未超过供电摆幅；检查反相符号和单位。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 40,\r\n      \"section\": \"6.4.2\"\r\n    },\r\n    {\r\n      \"id\": 45,\r\n      \"number\": 45,\r\n      \"group\": \"D\",\r\n      \"lesson\": \"learn-D6\",\r\n      \"tag\": \"隔离放大器\",\r\n      \"difficulty\": \"基础\",\r\n      \"stem\": \"隔离放大器最关键的结构特点是\",\r\n      \"options\": [\r\n        \"增益必为零\",\r\n        \"输入与输出间无直接导电通路\",\r\n        \"只能处理数字信号\",\r\n        \"自动把共模变为差模\"\r\n      ],\r\n      \"answer\": 1,\r\n      \"explanation\": \"B正确：电气隔离可切断地环路并适应某些高共模测量。信号可经电容、磁或光等方式传递；隔离并非要求信号不能通过，而是切断直接导电连接。\",\r\n      \"pitfall\": \"隔离耐压、漏电流和带宽均看具体型号。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 41,\r\n      \"section\": \"6.4.3—6.4.4\"\r\n    },\r\n    {\r\n      \"id\": 46,\r\n      \"number\": 46,\r\n      \"group\": \"D\",\r\n      \"lesson\": \"learn-D6\",\r\n      \"tag\": \"带宽与噪声\",\r\n      \"difficulty\": \"理解\",\r\n      \"stem\": \"有用信号主要位于100 Hz以下，干扰主要位于10 kHz附近。只需保留该低频有用信号，较合适的处理是\",\r\n      \"options\": [\r\n        \"用高通滤波器衰减有用低频信号\",\r\n        \"无限增大放大器带宽\",\r\n        \"采用合适截止频率的低通滤波器\",\r\n        \"仅把信号和干扰同时放大\"\r\n      ],\r\n      \"answer\": 2,\r\n      \"explanation\": \"C正确：选择合适的低通截止频率，可让有用低频信号通过，并衰减远处的高频干扰。带宽越宽并不总是越好，输入的无关频率成分也可能更多。高通会损失本题需要的低频信号。\",\r\n      \"pitfall\": \"滤波只抑制相应频带的干扰；落在有用频带内的噪声仍可能通过，不能承诺全部消除。\",\r\n      \"fig\": \"\",\r\n      \"sourceId\": 42,\r\n      \"section\": \"6.4.3—6.4.4\"\r\n    }\r\n  ]\r\n};\r\nconst LESSONS=[\r\n  [\r\n    \"4.1\",\r\n    \"learn-A1\",\r\n    \"中频增益与通频带\",\r\n    \"中频是放大电路增益相对平坦的一段范围。低频下耦合和旁路电容影响明显，高频下结电容和寄生电容影响明显，因此常见阻容耦合放大器在两端衰减。若只标出fL、fH，它们通常指增益幅值较中频下降至1/√2的两个点。电压幅值约0.707倍对应功率约一半，也对应−3 dB。\",\r\n    [\r\n      \"通频带：fL至fH\",\r\n      \"带宽：fH−fL\",\r\n      \"0.707倍约为半功率点\"\r\n    ],\r\n    [\r\n      1,\r\n      2\r\n    ],\r\n    \"例：中频电压增益为100，截止频率处约为70.7。fL=200 Hz、fH=20 kHz，则带宽为19.8 kHz。\",\r\n    \"直流耦合放大器可以没有非零的低端截止频率；这里讨论的是常见有限通频带模型。\"\r\n  ],\r\n  [\r\n    \"4.4\",\r\n    \"learn-A2\",\r\n    \"低频响应：耦合与旁路电容\",\r\n    \"耦合电容用于传递交流并隔开前后级的直流偏置。频率很低时，它的容抗较大，会对交流信号产生较大衰减。发射极旁路电容则让交流绕过发射极电阻的一部分；若旁路不充分，局部负反馈增强、增益减小。它们都可能影响低端响应。\",\r\n    [\r\n      \"fL≈1/(2πRC)\",\r\n      \"电容减小，拐点频率升高\",\r\n      \"旁路失效会增强交流负反馈\"\r\n    ],\r\n    [\r\n      3,\r\n      4,\r\n      5\r\n    ],\r\n    \"例：R=10 kΩ、C=10 nF，RC=100 μs，fC≈1/(2πRC)≈1.59 kHz。C加倍，则这个RC环节的截止频率约减半。\",\r\n    \"这里的R是电容所见的等效电阻；不是任意取图中某一只电阻。多个电容共同作用时，不直接套一个RC公式。\"\r\n  ],\r\n  [\r\n    \"4.2、5.6.5\",\r\n    \"learn-A3\",\r\n    \"高频响应、密勒效应与增益带宽\",\r\n    \"高频时，结电容与布线寄生电容更容易分流信号，造成增益下降。反相级中跨接输入、输出的微小电容还会因密勒效应呈现较大的输入等效值。另一个常见简算是增益带宽积：在单主极点近似成立时，运放闭环增益越高，带宽通常越小。\",\r\n    [\r\n      \"容抗随频率升高而下降\",\r\n      \"20 pF×(1+9)=200 pF\",\r\n      \"密勒效应限制高频响应\"\r\n    ],\r\n    [\r\n      6,\r\n      7,\r\n      8,\r\n      12\r\n    ],\r\n    \"例：Av=−9、Cμ=20 pF，则输入等效值约(1+9)×20=200 pF。若闭环增益×带宽≈1 MHz，增益20时带宽约50 kHz。\",\r\n    \"密勒公式与增益带宽积都有适用模型。非反相电路的信号增益与噪声增益相同；更复杂电路不要机械套用。\"\r\n  ],\r\n  [\r\n    \"4.5、5.6\",\r\n    \"learn-A4\",\r\n    \"多级响应与负反馈稳定性\",\r\n    \"互不加载的放大级串接，总增益等于各级增益相乘。因此两个级各衰减到0.707倍时，整个系统已降到0.50倍，总带宽通常比单级窄。负反馈还要考虑相位：某频率下相移使反馈变成等效正反馈，且环路增益足够大，可能出现自激。频率补偿用于改善环路稳定性。\",\r\n    [\r\n      \"0.707×0.707≈0.50\",\r\n      \"稳定性看整个环路\",\r\n      \"本节只判断自激成因\"\r\n    ],\r\n    [\r\n      9,\r\n      10,\r\n      11,\r\n      13\r\n    ],\r\n    \"例：0.707×0.707≈0.50，约为−6 dB。补偿常需牺牲一定带宽或响应速度，不能保证所有指标同时提高。\",\r\n    \"这里只掌握带宽趋势、自激成因与补偿目的，不做复杂的多极点相位计算或补偿元件设计。\"\r\n  ],\r\n  [\r\n    \"6.3.2\",\r\n    \"learn-B1\",\r\n    \"四类滤波器与有源滤波\",\r\n    \"滤波器按“哪一段频率容易通过”命名。低通通过低频，高通通过高频；带通通过一段有限频带，带阻抑制一段频带并保留两侧。截止附近通常有过渡带，并不是一道理想的直角门。有源滤波器用运放与R、C组合，可缓冲信号并提供一定增益。\",\r\n    [\r\n      \"低通：低频通\",\r\n      \"高通：高频通\",\r\n      \"带通与带阻的中间频带作用相反\"\r\n    ],\r\n    [\r\n      14,\r\n      15,\r\n      16,\r\n      17,\r\n      18\r\n    ],\r\n    \"例：需要保留低频温度变化而减轻高频噪声，可考虑低通；需要只选出某一段通信频带，可考虑带通。\",\r\n    \"实际有源滤波器受运放带宽、供电和输出摆幅限制；类型相同也可以有不同的阶数和响应形状。\"\r\n  ],\r\n  [\r\n    \"6.3.1\",\r\n    \"learn-B2\",\r\n    \"截止频率与RC时间常数\",\r\n    \"一阶RC低通或高通的拐点由时间常数RC决定：fC=1/(2πRC)。R用Ω、C用F，结果就是Hz。R或C增大，拐点降低。对一阶低通，截止处幅度约为低频通带的0.707倍。\",\r\n    [\r\n      \"fC≈0.16/(RC)\",\r\n      \"R或C加倍，截止频率减半\",\r\n      \"截止点不是完全截止\"\r\n    ],\r\n    [\r\n      19,\r\n      20,\r\n      21\r\n    ],\r\n    \"例：10 kΩ×10 nF=10⁻⁴ s，fC≈0.16/10⁻⁴=1.6 kHz。C加倍后约为0.8 kHz。\",\r\n    \"截止处仍有输出；−3 dB不是“电压为零”。公式用于该一阶RC模型，不代表所有有源滤波拓扑。\"\r\n  ],\r\n  [\r\n    \"6.3.2\",\r\n    \"learn-B3\",\r\n    \"阶数与滚降斜率\",\r\n    \"阶数反映传输函数中主要储能环节的阶次，常见低通每增加一阶，高频远端的渐近衰减就增加约20 dB/dec。dec表示频率变化十倍的区间，因此二阶约为40 dB/dec。阶数高通常能更快衰减阻带，但电路也更复杂。\",\r\n    [\r\n      \"一阶约20 dB/dec\",\r\n      \"二阶约40 dB/dec\",\r\n      \"过渡带是平滑变化\"\r\n    ],\r\n    [\r\n      22\r\n    ],\r\n    \"例：二阶低通已在高频渐近区时，频率再提高十倍，电压增益约再下降40 dB；这不是截止点处固定下降40 dB。\",\r\n    \"本合集只认识阶数与斜率，不推导Butterworth、Chebyshev等滤波器的设计参数。\"\r\n  ],\r\n  [\r\n    \"6.1.5、6.1.6\",\r\n    \"learn-B4\",\r\n    \"非线性运算与模拟乘法器\",\r\n    \"线性加减运算之外，运放还可配合具有指数伏安特性的二极管或晶体管实现对数、指数等非线性运算。模拟乘法器把两个输入相乘，并按一个标度常数缩放；两输入相接还可形成平方关系。借助运放反馈，也可实现除法。\",\r\n    [\r\n      \"W=XY/K\",\r\n      \"异号输入得到负乘积\",\r\n      \"量程和输入符号要看电路\"\r\n    ],\r\n    [\r\n      23,\r\n      24,\r\n      25,\r\n      26\r\n    ],\r\n    \"例：W=XY/(10 V)，X=2 V、Y=−3 V，则W=−0.6 V。若Vo=(10 V)·V1/V2，V1=2 V、V2=5 V，则Vo=4 V。\",\r\n    \"本节只识别关系并按已给公式代入；不设计晶体管参数。除法分母不能为零，对数和指数也有规定的输入范围。\"\r\n  ],\r\n  [\r\n    \"7.2.2\",\r\n    \"learn-C1\",\r\n    \"比较器与单限比较\",\r\n    \"比较器判断两个输入哪一个更高。Vin接同相端、Vref接反相端时，Vin>Vref输出趋向高，Vin\u003cVref输出趋向低；信号若改接反相端，判断方向就反过来。单限比较器只有一个切换阈值。输出高低幅值由电源和输出级决定。\",\r\n    [\r\n      \"V+>V−时趋向高电平\",\r\n      \"输出受供电和输出级限制\",\r\n      \"比较器不使用虚短结论\"\r\n    ],\r\n    [\r\n      27,\r\n      28,\r\n      29\r\n    ],\r\n    \"例：参考为4 V，Vin从2 V升到6 V，越过4 V后输出转向高。恰好等于阈值的理想瞬间不指定输出。\",\r\n    \"比较器通常是开环或正反馈工作，不能套用线性负反馈运放的“虚短”。\"\r\n  ],\r\n  [\r\n    \"7.2.2、7.2.4\",\r\n    \"learn-C2\",\r\n    \"分压阈值与窗口比较器\",\r\n    \"基准电压常由电阻分压产生。输入电流忽略时，节点对地电压=电源电压×下臂电阻/(上臂+下臂电阻)。窗口比较器再用上下两个阈值判断输入是否处于某个范围；它解决的是“在不在区间内”的问题。\",\r\n    [\r\n      \"Vref=VCC·R下/(R上+R下)\",\r\n      \"节点到地电阻在分子\",\r\n      \"输入接同相或反相会改变输出极性\"\r\n    ],\r\n    [\r\n      30,\r\n      34\r\n    ],\r\n    \"例：12 V经20 kΩ和10 kΩ分压，下臂为10 kΩ时节点为4 V。窗口内有效表示VL\u003cVin\u003cVH。\",\r\n    \"窗口输出极性依接法而定。窗口比较器的两个边界用于判断范围，与滞回比较器的状态记忆不同。\"\r\n  ],\r\n  [\r\n    \"7.2.3\",\r\n    \"learn-C3\",\r\n    \"滞回比较器与回差\",\r\n    \"滞回比较器利用正反馈产生上、下两个翻转门限。输入从低处上升，越过上门限才翻转；从高处下降，越过下门限才翻转。在两个门限之间，输出保留前一状态，因此能减少阈值附近微小扰动造成的抖动。\",\r\n    [\r\n      \"上门限VH，下门限VL\",\r\n      \"ΔV=VH−VL\",\r\n      \"输入上升看上门限\"\r\n    ],\r\n    [\r\n      31,\r\n      32,\r\n      33\r\n    ],\r\n    \"例：VH=+3 V、VL=+1 V，回差ΔV=2 V。若输入已从低处上升到2 V，仍未越过上门限，不应提前翻转。\",\r\n    \"在回差区里，仅知道当前输入值还不足以确定输出；需知道此前状态或输入变化方向。\"\r\n  ],\r\n  [\r\n    \"7.3.1—7.3.4\",\r\n    \"learn-C4\",\r\n    \"矩形、三角与锯齿波\",\r\n    \"比较器在两个输出状态间切换，产生近似矩形波。矩形波的每个半周期是常量，送入积分器后变成斜线，形成三角波。三角波与固定阈值比较又可得到矩形波。锯齿波则以一段缓慢斜坡配合较快回扫，上升与下降不对称。\",\r\n    [\r\n      \"比较器输出近似矩形波\",\r\n      \"积分器输出近似三角波\",\r\n      \"这里不推导振荡周期\"\r\n    ],\r\n    [\r\n      35,\r\n      36,\r\n      37,\r\n      38\r\n    ],\r\n    \"例：±U且正负各半周期的矩形波，经未饱和的理想积分器可形成三角波。阈值位于三角波幅值范围内时，可用比较器把它变回矩形波。\",\r\n    \"这里识别电路功能和波形关系，不推导振荡周期。单独比较一个固定电压不会自动产生振荡。\"\r\n  ],\r\n  [\r\n    \"7.4.1\",\r\n    \"learn-D1\",\r\n    \"电压—电流转换\",\r\n    \"电压—电流转换让输入电压控制负载电流。某些取样电阻电路将电阻两端的电压控制为Vin，就有IL≈Vin/Rs。只要输出电压余量足够，负载电阻在一定范围内变化时，电流仍主要由Vin与Rs决定。\",\r\n    [\r\n      \"V/Ω=A\",\r\n      \"须保证输出余量充足\",\r\n      \"维持设定电流所需的负载电压超出输出余量时会饱和\"\r\n    ],\r\n    [\r\n      39\r\n    ],\r\n    \"例：Vin=2 V、Rs=1 kΩ，IL≈2 mA。电路所需的负载端电压也不能超过供电可提供的范围。\",\r\n    \"传输关系取决于具体接法；不能把IL=Vin/Rs当成所有V/I电路都无条件成立的公式。\"\r\n  ],\r\n  [\r\n    \"7.4.2\",\r\n    \"learn-D2\",\r\n    \"精密整流\",\r\n    \"普通硅二极管存在明显正向压降，直接整流很小的交流信号时容易失真。精密整流把二极管纳入运放反馈路径，在导通的相应半周由运放调节来补偿压降，使小信号也能整流。\",\r\n    [\r\n      \"适合微弱交流信号\",\r\n      \"带宽和切换速度有限\",\r\n      \"不是滤波器\"\r\n    ],\r\n    [\r\n      40\r\n    ],\r\n    \"例：几十毫伏的交流信号，不能简单用“必须超过约0.7 V才有效”的普通二极管直觉判断精密整流输出。\",\r\n    \"精密整流仍受运放速度、输出摆幅、二极管切换和恢复过程限制；不等于整流后自动无纹波。\"\r\n  ],\r\n  [\r\n    \"7.4.3\",\r\n    \"learn-D3\",\r\n    \"电压—频率转换\",\r\n    \"电压—频率转换把输入模拟电压编码为输出脉冲频率。输入变化时，主要观察单位时间内脉冲个数如何改变，而不是只看脉冲高低幅值。输出可供计数，也有利于某些传输与测量。\",\r\n    [\r\n      \"Vin变化→脉冲频率变化\",\r\n      \"输出仍是脉冲列\",\r\n      \"比例系数取决于设计\"\r\n    ],\r\n    [\r\n      41\r\n    ],\r\n    \"例：若某电路标定为输入增大、输出频率增大，则更高输入对应更密集的脉冲；比例系数与零点偏置以题设为准。\",\r\n    \"不要把V/F与V/I混淆：前者输出量是频率，后者控制负载电流。\"\r\n  ],\r\n  [\r\n    \"6.4.1\",\r\n    \"learn-D4\",\r\n    \"仪表放大器\",\r\n    \"仪表放大器常用于电桥等传感器的微弱差分信号。较高输入阻抗可减轻对传感器的负载，较好的共模抑制可减弱两输入共同电压对输出的影响。理想差分关系Vo=G(V+−V−)，先求差，再乘增益。\",\r\n    [\r\n      \"Vo=G(V+−V−)\",\r\n      \"先求差分量，再乘增益\",\r\n      \"高输入阻抗与共模抑制\"\r\n    ],\r\n    [\r\n      42,\r\n      43\r\n    ],\r\n    \"例：V+=2.002 V、V−=2.000 V，差值只有2 mV；G=100时Vo=0.20 V，不是200.2 V。\",\r\n    \"实际电路的共模范围与共模抑制比有限；公式成立还需输入与输出都在允许范围内。\"\r\n  ],\r\n  [\r\n    \"6.4.2\",\r\n    \"learn-D5\",\r\n    \"电荷放大器\",\r\n    \"压电传感器可将受力变化转换成电荷，电荷放大器把输入电荷在反馈电容上转换成电压。理想反相关系Vout≈−Q/Cf；反馈电容越大，同一电荷得到的电压幅值越小。\",\r\n    [\r\n      \"单位Q/C为V\",\r\n      \"增大反馈电容会减小同一电荷的输出\",\r\n      \"注意反相符号和输出余量\"\r\n    ],\r\n    [\r\n      44\r\n    ],\r\n    \"例：Q=12 nC、Cf=2 nF，前缀相消得Q/Cf=6 V，再加反相符号，输出约−6 V。\",\r\n    \"输出需在线性范围内。真实电路还有偏置、漏电、反馈电阻和传感器电容等影响，这里不作深入计算。\"\r\n  ],\r\n  [\r\n    \"6.4.3—6.4.4\",\r\n    \"learn-D6\",\r\n    \"隔离放大、差分测量与噪声\",\r\n    \"隔离放大器使输入与输出之间没有直接的导电通路，信号可经磁、光或电容等方式跨越隔离边界，以切断地环路并适应某些测量场合。噪声抑制还需要匹配、布线、屏蔽和合适带宽；差分测量能减弱共同干扰，滤波能减弱特定频段干扰。\",\r\n    [\r\n      \"隔离可切断地环路\",\r\n      \"布局、屏蔽和接地仍重要\",\r\n      \"无放大器能消除所有噪声\"\r\n    ],\r\n    [\r\n      45,\r\n      46\r\n    ],\r\n    \"例：有用信号在100 Hz以下、干扰在10 kHz附近，可选合适的低通滤波。放大器带宽并非越宽越好，因为无关频率成分也可能被引入。\",\r\n    \"隔离能力、共模抑制和滤波效果都有范围限制。落在有用频带里的噪声仍可能通过，不能宣称全部消除。\"\r\n  ]\r\n];\r\nconst COVERAGE=BANK.questions.map(q=>[q.section,q.tag,[q.id]]);\r\n\r\nconst DIAGRAMS={\r\n  \"bode\": {\r\n    \"label\": \"放大器归一化幅频响应与上下限频率\",\r\n    \"box\": \"0 0 560 290\",\r\n    \"svg\": \"\u003cpath d=\\\"M65 35L65 225\\\" fill=\\\"none\\\" stroke=\\\"#a0b1a6\\\" stroke-width=\\\"2.4\\\" stroke-linejoin=\\\"round\\\" stroke-linecap=\\\"round\\\"/>\u003cpath d=\\\"M65 225L520 225\\\" fill=\\\"none\\\" stroke=\\\"#a0b1a6\\\" stroke-width=\\\"2.4\\\" stroke-linejoin=\\\"round\\\" stroke-linecap=\\\"round\\\"/>\u003cpath d=\\\"M65.00 223.35 L66.80 223.24 L68.60 223.12 L70.40 223.00 L72.20 222.86 L74.00 222.72 L75.80 222.57 L77.60 222.41 L79.40 222.24 L81.20 222.05 L83.00 221.86 L84.80 221.65 L86.60 221.42 L88.40 221.19 L90.20 220.93 L92.00 220.66 L93.80 220.37 L95.60 220.06 L97.40 219.74 L99.20 219.39 L101.00 219.01 L102.80 218.62 L104.60 218.19 L106.40 217.74 L
